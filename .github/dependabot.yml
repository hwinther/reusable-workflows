# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
version: 2

updates:
- package-ecosystem: "github-actions"
  directories:
    - "/"
    - "/.github/actions/*"
  open-pull-requests-limit: 20
  target-branch: "main"
  schedule:
    interval: "weekly"
    day: "monday"
  # Skip versions younger than a week, so a compromised or broken release has time to be pulled.
  cooldown:
    default-days: 7

# The badges action's renderer (badge-maker, fast-xml-parser), installed with npm ci at run time.
- package-ecosystem: "npm"
  directory: "/.github/actions/badges/scripts"
  target-branch: "main"
  schedule:
    interval: "weekly"
    day: "monday"
  cooldown:
    default-days: 7
