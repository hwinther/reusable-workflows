name: "Generate SBOM and scan image with Grype"
description: |
  Generates an SPDX SBOM (always) and a CycloneDX SBOM (when supply-chain
  attestation is enabled) for the image, runs Grype against the SPDX SBOM,
  uploads SARIF to Code Scanning, renders findings via `_grype-summary`, and
  enforces the configured severity gate. Also produces a Grype JSON report
  (always when scan is enabled, or via a non-gating run when only attestation
  is needed) for downstream cosign vuln attestation.

  Internal — leading underscore signals it's not part of the public surface.

inputs:
  image_ref:
    required: true
    description: "Local image reference to scan (must already be loaded in the local Docker daemon)."
  container_image_name_postfix:
    required: true
    description: "Used to build distinct SARIF category and PR-comment identifier when scanning multiple images."
  arch_suffix:
    required: false
    description: "Optional architecture suffix (e.g. 'amd64', 'arm64'). When set, SARIF category, SBOM filenames, Grype JSON path, and PR-comment identifier all gain '-${arch_suffix}' so per-platform scans in the same job don't stomp on each other."
    default: ""
  artifact_name_suffix:
    required: false
    description: "Optional caller-supplied suffix that disambiguates scans of different image variants in the same workflow run (typically a matrix dimension, e.g. the value of matrix.debian_release). Applied additively alongside `arch_suffix` to SARIF category, SBOM workflow-artifact names, Grype JSON / SARIF filenames, and the PR-comment identifier. Without this, matrix callers that share `container_image_name_postfix` collide on `actions/upload-artifact` with HTTP 409. The image-name-postfix itself is not affected (matrix variants should still publish to the same image)."
    default: ""
  grype_scan_enabled:
    required: false
    description: "Run the Grype gate scan."
    default: "true"
  grype_severity_cutoff:
    required: false
    description: "Severity-cutoff: negligible, low, medium, high, critical."
    default: "high"
  grype_only_fixed:
    required: false
    description: "Only consider vulnerabilities that have a fix available."
    default: "true"
  grype_fail_build:
    required: false
    description: "Fail this action when vulnerabilities meet severity-cutoff."
    default: "true"
  cosign_supply_chain_attest_enabled:
    required: false
    description: "When true, generates the CycloneDX SBOM and the Grype JSON for downstream cosign attestation."
    default: "true"
  code_scanning_upload_enabled:
    required: false
    description: "Upload the Grype SARIF to GitHub Code Scanning. Set to false on private repositories without GitHub Advanced Security (the Code Scanning API rejects uploads with `Advanced Security must be enabled`). When false, the Grype scan still runs and findings still appear in the job summary and PR comment via _grype-summary; only the Code Scanning UI integration is skipped, and the severity gate is enforced from the Grype step's outcome regardless."
    default: "true"
  release_asset_upload_enabled:
    required: false
    description: "Attach the generated SBOMs to a matching GitHub Release as release assets (anchore/sbom-action's default behaviour on tag pushes). Requires `contents: write` — set to false on private repos / consumers that only grant `contents: read` to the build job (the API rejects the upload with `Resource not accessible by integration`). When false, the SBOMs are still uploaded as workflow artifacts; only the release-asset attachment is skipped."
    default: "true"
  github_token:
    required: false
    description: "Token for the Grype-summary PR comment."
    default: ""

outputs:
  sbom_spdx_path:
    description: "Path to the generated SPDX SBOM file."
    value: ${{ steps.paths.outputs.sbom_spdx_path }}
  sbom_cyclonedx_path:
    description: "Path to the CycloneDX SBOM (only when cosign_supply_chain_attest_enabled is true)."
    value: ${{ steps.paths.outputs.sbom_cyclonedx_path }}
  grype_json_path:
    description: "Path to the Grype JSON for cosign vuln attestation (only when cosign_supply_chain_attest_enabled is true)."
    value: ${{ steps.paths.outputs.grype_json_path }}
  spdx_artifact_name:
    description: "Workflow-artifact name under which the SPDX SBOM is uploaded by anchore/sbom-action. Use with actions/download-artifact in a downstream consumer-side sign job."
    value: ${{ steps.paths.outputs.spdx_artifact_name }}
  cyclonedx_artifact_name:
    description: "Workflow-artifact name under which the CycloneDX SBOM is uploaded (only when cosign_supply_chain_attest_enabled is true). Use with actions/download-artifact in a downstream consumer-side sign job."
    value: ${{ steps.paths.outputs.cyclonedx_artifact_name }}
  grype_artifact_name:
    description: "Workflow-artifact name under which the Grype JSON is uploaded (only when cosign_supply_chain_attest_enabled is true). Use with actions/download-artifact in a downstream consumer-side sign job."
    value: ${{ steps.paths.outputs.grype_artifact_name }}

runs:
  using: "composite"
  steps:
    - name: Resolve output paths and category labels
      id: paths
      shell: bash
      env:
        RUNNER_TEMP_DIR: ${{ runner.temp }}
        POSTFIX: ${{ inputs.container_image_name_postfix }}
        ARCH_SUFFIX: ${{ inputs.arch_suffix }}
        ARTIFACT_NAME_SUFFIX: ${{ inputs.artifact_name_suffix }}
      run: |
        set -euo pipefail
        # Order: variant first (matrix dim), then arch. So matrix callers that also enable
        # scan_all_platforms get e.g. `-bookworm-amd64` rather than `-amd64-bookworm`.
        file_suffix=""
        name_suffix=""
        if [ -n "$ARTIFACT_NAME_SUFFIX" ]; then
          file_suffix="${file_suffix}-${ARTIFACT_NAME_SUFFIX}"
          name_suffix="${name_suffix}-${ARTIFACT_NAME_SUFFIX}"
        fi
        if [ -n "$ARCH_SUFFIX" ]; then
          file_suffix="${file_suffix}-${ARCH_SUFFIX}"
          name_suffix="${name_suffix}-${ARCH_SUFFIX}"
        fi
        echo "sbom_spdx_path=${RUNNER_TEMP_DIR}/container-image${file_suffix}.spdx.json" >> "$GITHUB_OUTPUT"
        echo "sbom_cyclonedx_path=${RUNNER_TEMP_DIR}/container-image${file_suffix}.cyclonedx.json" >> "$GITHUB_OUTPUT"
        echo "grype_json_path=${RUNNER_TEMP_DIR}/grype-cosign-vuln${file_suffix}.json" >> "$GITHUB_OUTPUT"
        echo "sarif_path=${RUNNER_TEMP_DIR}/grype-results${file_suffix}.sarif" >> "$GITHUB_OUTPUT"
        echo "sarif_category=grype-container-${POSTFIX}${name_suffix}" >> "$GITHUB_OUTPUT"
        echo "spdx_artifact_name=container-image-${POSTFIX}${name_suffix}.spdx.json" >> "$GITHUB_OUTPUT"
        echo "cyclonedx_artifact_name=container-image-${POSTFIX}${name_suffix}.cyclonedx.json" >> "$GITHUB_OUTPUT"
        echo "grype_artifact_name=container-image-${POSTFIX}${name_suffix}.grype.json" >> "$GITHUB_OUTPUT"
        echo "pr_comment_identifier=grype-summary-${POSTFIX}${name_suffix}" >> "$GITHUB_OUTPUT"

    - name: Generate SBOM (SPDX)
      uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
      with:
        image: ${{ inputs.image_ref }}
        format: spdx-json
        output-file: ${{ steps.paths.outputs.sbom_spdx_path }}
        artifact-name: ${{ steps.paths.outputs.spdx_artifact_name }}
        upload-release-assets: ${{ inputs.release_asset_upload_enabled }}

    - name: Generate SBOM (CycloneDX) for cosign attestation
      if: ${{ inputs.cosign_supply_chain_attest_enabled == 'true' }}
      uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
      with:
        image: ${{ inputs.image_ref }}
        format: cyclonedx-json
        output-file: ${{ steps.paths.outputs.sbom_cyclonedx_path }}
        artifact-name: ${{ steps.paths.outputs.cyclonedx_artifact_name }}
        upload-release-assets: ${{ inputs.release_asset_upload_enabled }}

    - name: Vulnerability scan (Grype)
      id: grype-scan
      if: ${{ inputs.grype_scan_enabled == 'true' }}
      continue-on-error: true
      uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
      with:
        sbom: ${{ steps.paths.outputs.sbom_spdx_path }}
        output-format: sarif
        output-file: ${{ steps.paths.outputs.sarif_path }}
        severity-cutoff: ${{ inputs.grype_severity_cutoff }}
        only-fixed: ${{ inputs.grype_only_fixed }}
        fail-build: ${{ inputs.grype_fail_build }}

    - name: Upload Grype SARIF to Code Scanning
      if: ${{ always() && inputs.grype_scan_enabled == 'true' && inputs.code_scanning_upload_enabled == 'true' && steps.grype-scan.outcome != 'skipped' }}
      uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
      with:
        sarif_file: ${{ steps.paths.outputs.sarif_path }}
        category: ${{ steps.paths.outputs.sarif_category }}
        wait-for-processing: false

    - name: Render Grype findings (job summary + PR comment)
      if: ${{ always() && inputs.grype_scan_enabled == 'true' && steps.grype-scan.outcome != 'skipped' }}
      uses: hwinther/reusable-workflows/.github/actions/_grype-summary@v2.0.0
      with:
        sarif_file: ${{ steps.paths.outputs.sarif_path }}
        category: ${{ steps.paths.outputs.sarif_category }}
        github_token: ${{ inputs.github_token }}
        pr_comment_identifier: ${{ steps.paths.outputs.pr_comment_identifier }}

    - name: Enforce Grype vulnerability gate
      if: ${{ inputs.grype_scan_enabled == 'true' && inputs.grype_fail_build == 'true' && steps.grype-scan.outcome == 'failure' }}
      shell: bash
      env:
        SARIF_CATEGORY: ${{ steps.paths.outputs.sarif_category }}
      run: |
        echo "::error::Grype reported vulnerabilities at or above the configured severity cutoff. See Code Scanning (category ${SARIF_CATEGORY}) or the Grype step log."
        exit 1

    - name: Download Grype CLI (JSON report for cosign vuln attestation)
      id: grype-for-attest
      if: ${{ inputs.cosign_supply_chain_attest_enabled == 'true' && inputs.grype_scan_enabled == 'true' }}
      uses: anchore/scan-action/download-grype@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0 (same ref as scan-action)

    - name: Grype JSON for cosign vuln attestation
      if: ${{ inputs.cosign_supply_chain_attest_enabled == 'true' && inputs.grype_scan_enabled == 'true' }}
      shell: bash
      env:
        GRYPE_CMD: ${{ steps.grype-for-attest.outputs.cmd }}
        SBOM_PATH: ${{ steps.paths.outputs.sbom_spdx_path }}
        OUT_PATH: ${{ steps.paths.outputs.grype_json_path }}
      run: |
        set -euo pipefail
        "$GRYPE_CMD" "sbom:${SBOM_PATH}" -o json > "$OUT_PATH"

    - name: Grype JSON only (supply-chain attestation, no SARIF gate)
      if: ${{ inputs.cosign_supply_chain_attest_enabled == 'true' && inputs.grype_scan_enabled != 'true' }}
      uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
      with:
        sbom: ${{ steps.paths.outputs.sbom_spdx_path }}
        output-format: json
        output-file: ${{ steps.paths.outputs.grype_json_path }}
        severity-cutoff: negligible
        only-fixed: false
        fail-build: false

    # Mirrors the SBOM upload pattern (anchore/sbom-action's `artifact-name` field): the
    # Grype JSON is uploaded as a workflow artifact whenever it's generated, so matrix
    # callers running a consumer-signed downstream sign job can `actions/download-artifact`
    # it instead of regenerating Grype against the registry image. Matrix safety comes from
    # `artifact_name_suffix` already being included in `grype_artifact_name`.
    #
    # build-and-scan-{docker,dotnet}.yml retains its own `build-and-scan-${postfix}-grype`
    # upload step under a different name — this artifact is additive and harmless to
    # existing consumers (image-push.yml, test-ghcr web-container-consumer-signs.yml).
    - name: Upload Grype JSON artifact
      if: ${{ inputs.cosign_supply_chain_attest_enabled == 'true' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ steps.paths.outputs.grype_artifact_name }}
        path: ${{ steps.paths.outputs.grype_json_path }}
        if-no-files-found: error
