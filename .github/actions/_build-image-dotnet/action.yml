name: "Build dotnet container locally"
description: |
  Runs `dotnet publish -t:PublishContainer` to a local archive, then `docker
  load`s it so the image is available in the local Docker daemon for downstream
  scan and push steps. Does not push to any registry.

  The published image is tagged as `<repository>/<postfix>:<each-image-tag>`
  (no registry prefix). Downstream steps add the registry prefix via
  `docker tag` before pushing.

  Internal — leading underscore signals it's not part of the public surface.

inputs:
  dotnet_version:
    required: true
    description: ".NET version, e.g. 10.0.x"
  solution_path:
    required: true
    description: "Solution path, e.g. backend (used as working-directory and for cache key)."
  solution_file:
    required: true
    description: "Solution file (relative to solution_path), e.g. ProjectName.slnx"
  project_file:
    required: true
    description: "Project file (relative to solution_path), e.g. src/Api/Api.csproj"
  cache_enabled:
    required: false
    description: "Enable NuGet package caching (requires lock files)."
    default: "true"
  image_tags:
    required: true
    description: "Semicolon-separated image tags (no registry, no name) — passed as ContainerImageTags MSBuild property."
  repository:
    required: true
    description: "Lowercased GITHUB_REPOSITORY (owner/repo)."
  container_image_name_postfix:
    required: true
    description: "Image name postfix appended to repository (becomes ContainerRepository)."
  version:
    required: true
    description: "Version string for ContainerVersion / InformationalVersion MSBuild properties."
  git_sha:
    required: false
    description: "Value for SourceRevisionId."
    default: ${{ github.sha }}
  archive_path:
    required: false
    description: "Output path for the container archive. Defaults to a runner-temp tarball."
    default: ""
  github_token:
    required: false
    description: "GitHub token, used as the fallback for nuget_auth_token when private feeds are configured. Defaults to the runner-provided GITHUB_TOKEN."
    default: ${{ github.token }}
  nuget_auth_token:
    required: false
    description: "Auth token used for NUGET_AUTH_TOKEN (setup-dotnet) and as --password for the extra source. When empty, falls back to github_token."
    default: ""
  primary_nuget_source:
    required: false
    description: "Primary NuGet source URL passed to actions/setup-dotnet via source-url."
    default: ""
  extra_nuget_source:
    required: false
    description: "Additional private NuGet feed URL added via `dotnet nuget add source` before restore."
    default: ""
  extra_nuget_source_name:
    required: false
    description: "Name for the extra NuGet source."
    default: ""
  extra_nuget_source_username:
    required: false
    description: "Username for `dotnet nuget add source` on the extra source. GitHub Packages and Azure Artifacts both accept any non-empty value alongside a PAT."
    default: "az"

outputs:
  local_ref:
    description: "First image ref produced by `docker load` after publish (no registry prefix)."
    value: ${{ steps.load-image.outputs.ref }}
  archive_path:
    description: "Path to the container archive produced by dotnet publish."
    value: ${{ steps.publish.outputs.archive_path }}

runs:
  using: "composite"
  steps:
    - name: Set up .NET
      uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
      with:
        dotnet-version: ${{ inputs.dotnet_version }}
        source-url: ${{ inputs.primary_nuget_source }}
        cache: ${{ inputs.cache_enabled }}
        cache-dependency-path: ${{ inputs.solution_path != '' && format('{0}/**/packages.lock.json', inputs.solution_path) || '**/packages.lock.json' }}
      env:
        NUGET_AUTH_TOKEN: ${{ inputs.nuget_auth_token != '' && inputs.nuget_auth_token || inputs.github_token }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

    - name: Add extra NuGet source
      if: inputs.extra_nuget_source != ''
      uses: hwinther/reusable-workflows/.github/actions/_dotnet-add-nuget-source@v2.0.1
      with:
        extra_nuget_source: ${{ inputs.extra_nuget_source }}
        extra_nuget_source_name: ${{ inputs.extra_nuget_source_name }}
        extra_nuget_source_username: ${{ inputs.extra_nuget_source_username }}
        nuget_auth_token: ${{ inputs.nuget_auth_token != '' && inputs.nuget_auth_token || inputs.github_token }}
        working_directory: ${{ inputs.solution_path }}

    - name: Restore
      shell: bash
      working-directory: ${{ inputs.solution_path }}
      env:
        SOLUTION_FILE: ${{ inputs.solution_file }}
      run: |
        set -euo pipefail
        dotnet restore --locked-mode "$SOLUTION_FILE"
        # Restore any committed nuget.config; otherwise drop the runtime-added one so it doesn't leak into the publish context.
        if git ls-files --error-unmatch nuget.config > /dev/null 2>&1; then
          git checkout HEAD -- nuget.config
        else
          rm -f nuget.config || true
        fi

    - name: Publish container to archive
      id: publish
      shell: bash
      working-directory: ${{ inputs.solution_path }}
      env:
        ContainerImageTags: ${{ inputs.image_tags }}
        PROJECT_FILE: ${{ inputs.project_file }}
        REPOSITORY: ${{ inputs.repository }}
        POSTFIX: ${{ inputs.container_image_name_postfix }}
        VERSION: ${{ inputs.version }}
        GIT_SHA: ${{ inputs.git_sha }}
        SERVER_URL: ${{ github.server_url }}
        REPO_FULL: ${{ github.repository }}
        ARCHIVE_OVERRIDE: ${{ inputs.archive_path }}
        RUNNER_TEMP_DIR: ${{ runner.temp }}
      run: |
        set -euo pipefail
        ARCHIVE="${ARCHIVE_OVERRIDE:-${RUNNER_TEMP_DIR}/container-image.tar.gz}"
        dotnet publish "$PROJECT_FILE" \
          -c Release \
          --no-restore \
          -t:PublishContainer \
          -p:ContainerArchiveOutputPath="$ARCHIVE" \
          -p:ContainerRepository="${REPOSITORY}/${POSTFIX}" \
          -p:ContainerVersion="$VERSION" \
          -p:InformationalVersion="$VERSION" \
          -p:SourceRevisionId="$GIT_SHA" \
          -p:PublishRepositoryUrl=true \
          -p:RepositoryUrl="${SERVER_URL}/${REPO_FULL}.git"
        echo "archive_path=$ARCHIVE" >> "$GITHUB_OUTPUT"

    - name: Load image from archive
      id: load-image
      shell: bash
      env:
        ARCHIVE: ${{ steps.publish.outputs.archive_path }}
      run: |
        set -euo pipefail
        mapfile -t loaded < <(docker load -i "$ARCHIVE" | sed -n 's/^Loaded image: //p')
        [ "${#loaded[@]}" -ge 1 ] || { echo "::error::docker load produced no image lines"; exit 1; }
        echo "ref=${loaded[0]}" >> "$GITHUB_OUTPUT"
        echo "Loaded refs:"
        printf '  %s\n' "${loaded[@]}"
