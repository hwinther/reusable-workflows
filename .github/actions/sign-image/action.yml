name: "Sign and attest a pushed container image"
description: |
  Public composite. Attaches the same supply-chain artifacts as
  `_push-image-with-signatures` does after its push step, but as a standalone
  action a consumer's own job can call AFTER an already-pushed digest:
    - GitHub artifact-build-provenance attestation (when enabled)
    - Cosign keyless signature (when enabled)
    - Cosign CycloneDX SBOM and Grype vuln attestations (when enabled)

  Because this action runs inline in the caller's job, the OIDC token minted
  for cosign and actions/attest carries the CALLER's
  `job_workflow_ref` — i.e. the consumer repo's own workflow, not this
  reusable-workflows repo. Use this when you want each consumer's signatures
  to be bound to their own workflow identity (so Kyverno / cosign verify
  policies can pin to per-consumer identities instead of trusting any repo
  that calls our reusable workflow).

  Caveats and prerequisites:
    - Caller must `docker login` to the registry before calling this action
      (cosign attest pushes attestation manifests to the registry).
    - Caller's job must declare permissions:
        id-token: write
        attestations: write     # only when attest_build_provenance_enabled
        packages: write
    - Cosign is pinned to v2.4.3 here for the same Kyverno 1.17 compat reason
      explained in CLAUDE.md (legacy `sha256-….att` manifest path). Do NOT
      bump to v3 without revisiting that constraint.

inputs:
  container_registry:
    required: true
    description: "Container registry, e.g. ghcr.io"
  repository:
    required: true
    description: "Lowercased GITHUB_REPOSITORY (owner/repo)."
  container_image_name_postfix:
    required: true
    description: "Image name postfix appended to repository for the subject ref."
  image_digest:
    required: false
    description: "OCI manifest digest of the already-pushed image (sha256:...). Subject of attestations and the `tag@digest` form passed to cosign sign. When empty, the action resolves it from the registry using the first entry of container_tags (`docker buildx imagetools inspect`) — caller must have done `docker login` first. Resolving here avoids the matrix-output last-writer-wins problem: a matrix sign job keyed on the same dimension as the build can recover its own entry's digest from the per-entry tag."
    default: ""
  container_tags:
    required: true
    description: "Comma-separated full image refs (registry/name:tag) the digest was pushed under. Each is signed as `<tag>@<digest>` so verifiers resolving via tag find the signature. Also the source for digest auto-resolution when image_digest is empty (first entry)."
  sbom_artifact_name:
    required: false
    description: "Workflow artifact holding the CycloneDX SBOM (e.g. build-and-scan-*.yml sbom_artifact). When set, the action downloads it and resolves sbom_cyclonedx_path internally — the job must declare permissions: actions: read. Takes effect only when cosign_supply_chain_attest_enabled. Ignored when sbom_cyclonedx_path is set explicitly (in-job callers)."
    default: ""
  grype_artifact_name:
    required: false
    description: "Workflow artifact holding the Grype JSON (e.g. build-and-scan-*.yml grype_artifact). When set, the action downloads it and resolves grype_json_path internally. Same semantics as sbom_artifact_name."
    default: ""
  cosign_sign_enabled:
    required: false
    description: "Sign with cosign keyless."
    default: "true"
  cosign_supply_chain_attest_enabled:
    required: false
    description: "Attach CycloneDX SBOM + Grype vuln attestations after sign."
    default: "true"
  attest_build_provenance_enabled:
    required: false
    description: "Generate a GitHub artifact-build-provenance attestation. Set to false on private repos without GitHub Advanced Security / paid plan."
    default: "true"
  sbom_cyclonedx_path:
    required: false
    description: "Path to the CycloneDX SBOM, required when cosign_supply_chain_attest_enabled."
    default: ""
  grype_json_path:
    required: false
    description: "Path to the Grype JSON report, required when cosign_supply_chain_attest_enabled."
    default: ""
  sbom_cyclonedx_sha256:
    required: false
    description: "Expected sha256 of the CycloneDX SBOM file (build-and-scan-*.yml sbom_cyclonedx_sha256 output). When set, the file at sbom_cyclonedx_path is re-hashed and the action fails if the digest does not match — closing the cross-job tampering window between the build job and this consumer-side sign job. Leave empty for in-job use where the predicate is not crossing a job boundary."
    default: ""
  grype_json_sha256:
    required: false
    description: "Expected sha256 of the Grype JSON file (build-and-scan-*.yml grype_json_sha256 output). Same semantics as sbom_cyclonedx_sha256."
    default: ""
  expected_image_id:
    required: false
    description: "Expected docker image-ID (config-blob digest, sha256:...) of the image the SBOM was scanned against. Pass `needs.build.outputs.image_digest` from build-and-scan-*.yml. When set, the binding check matches this value against the SBOM's syft:image:imageID property. anchore/sbom-action emits imageID universally for daemon-source images; manifestDigest is only present when syft derives it from a registry pull or buildkit metadata, so imageID is the more reliable handle."
    default: ""
  version:
    required: false
    description: "Application version (referenced in the cosign-vuln scanner.invocation parameters; informational)."
    default: ""

runs:
  using: "composite"
  steps:
    # Resolve the manifest digest once, here, so every downstream step (binding
    # check, attestation subject, cosign sign ref) shares one value. When the
    # caller passes image_digest we use it verbatim; otherwise we read it back
    # from the registry via the first container tag. The registry round-trip is
    # what lets a matrix sign job recover its own entry's digest (matrix job
    # outputs are last-writer-wins and unusable for per-entry plumbing).
    - name: Resolve image digest
      id: digest
      shell: bash
      env:
        IMAGE_DIGEST: ${{ inputs.image_digest }}
        CONTAINER_TAGS: ${{ inputs.container_tags }}
      run: |
        set -euo pipefail
        if [ -n "$IMAGE_DIGEST" ]; then
          echo "value=$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"
          echo "Using provided image digest: $IMAGE_DIGEST"
          exit 0
        fi
        first_tag=""
        while IFS= read -r tag; do
          tag=$(echo "$tag" | xargs)
          [ -z "$tag" ] && continue
          first_tag="$tag"
          break
        done < <(echo "$CONTAINER_TAGS" | tr ',' '\n')
        [ -n "$first_tag" ] || { echo "::error::No image_digest provided and no container_tags to resolve a digest from"; exit 1; }
        echo "Resolving digest from registry for: $first_tag"
        digest=$(docker buildx imagetools inspect "$first_tag" --format '{{.Manifest.Digest}}')
        [ -n "$digest" ] || { echo "::error::Failed to resolve a digest for $first_tag (is the caller logged in to the registry?)"; exit 1; }
        echo "value=$digest" >> "$GITHUB_OUTPUT"
        echo "Resolved digest: $digest"

    # Optional: pull the predicate files from workflow artifacts so the consumer
    # sign job doesn't have to download them itself. Explicit *_path inputs win
    # (in-job callers already have the files on disk).
    - name: Download CycloneDX SBOM artifact
      if: ${{ inputs.cosign_sign_enabled == 'true' && inputs.cosign_supply_chain_attest_enabled == 'true' && inputs.sbom_cyclonedx_path == '' && inputs.sbom_artifact_name != '' }}
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ inputs.sbom_artifact_name }}
        path: ${{ runner.temp }}/sign-image-sbom

    - name: Download Grype JSON artifact
      if: ${{ inputs.cosign_sign_enabled == 'true' && inputs.cosign_supply_chain_attest_enabled == 'true' && inputs.grype_json_path == '' && inputs.grype_artifact_name != '' }}
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ inputs.grype_artifact_name }}
        path: ${{ runner.temp }}/sign-image-grype

    # Single source of truth for the predicate paths used by every step below:
    # explicit input path if given, otherwise the file found in the downloaded
    # artifact directory. Only runs when attestations are on.
    - name: Resolve predicate paths
      id: predicates
      if: ${{ inputs.cosign_sign_enabled == 'true' && inputs.cosign_supply_chain_attest_enabled == 'true' }}
      shell: bash
      env:
        SBOM_PATH_INPUT: ${{ inputs.sbom_cyclonedx_path }}
        GRYPE_PATH_INPUT: ${{ inputs.grype_json_path }}
        SBOM_DIR: ${{ runner.temp }}/sign-image-sbom
        GRYPE_DIR: ${{ runner.temp }}/sign-image-grype
        SBOM_ARTIFACT: ${{ inputs.sbom_artifact_name }}
        GRYPE_ARTIFACT: ${{ inputs.grype_artifact_name }}
      run: |
        set -euo pipefail
        if [ -n "$SBOM_PATH_INPUT" ]; then
          sbom_path="$SBOM_PATH_INPUT"
        elif [ -n "$SBOM_ARTIFACT" ]; then
          sbom_path=$(find "$SBOM_DIR" -type f -name '*.cyclonedx.json' | head -1)
          [ -n "$sbom_path" ] || sbom_path=$(find "$SBOM_DIR" -type f -name '*.json' | head -1)
        else
          sbom_path=""
        fi
        if [ -n "$GRYPE_PATH_INPUT" ]; then
          grype_path="$GRYPE_PATH_INPUT"
        elif [ -n "$GRYPE_ARTIFACT" ]; then
          grype_path=$(find "$GRYPE_DIR" -type f -name '*.grype.json' | head -1)
          [ -n "$grype_path" ] || grype_path=$(find "$GRYPE_DIR" -type f -name '*.json' | head -1)
        else
          grype_path=""
        fi
        [ -n "$sbom_path" ] && [ -f "$sbom_path" ] || { echo "::error::Could not resolve a CycloneDX SBOM (sbom_cyclonedx_path empty and artifact '${SBOM_ARTIFACT:-<none>}' yielded no .cyclonedx.json)"; exit 1; }
        [ -n "$grype_path" ] && [ -f "$grype_path" ] || { echo "::error::Could not resolve a Grype JSON (grype_json_path empty and artifact '${GRYPE_ARTIFACT:-<none>}' yielded no .grype.json)"; exit 1; }
        echo "sbom_path=$sbom_path" >> "$GITHUB_OUTPUT"
        echo "grype_path=$grype_path" >> "$GITHUB_OUTPUT"
        echo "CycloneDX SBOM: $sbom_path"
        echo "Grype JSON: $grype_path"

    # Cross-job integrity: re-hash the predicate files passed in and bail
    # before any signing if they don't match what the build job produced.
    # Empty inputs → skipped (in-job callers don't need this).
    - name: Verify predicate integrity (sha256)
      if: ${{ inputs.cosign_sign_enabled == 'true' && inputs.cosign_supply_chain_attest_enabled == 'true' && (inputs.sbom_cyclonedx_sha256 != '' || inputs.grype_json_sha256 != '') }}
      shell: bash
      env:
        SBOM_PATH: ${{ steps.predicates.outputs.sbom_path }}
        GRYPE_PATH: ${{ steps.predicates.outputs.grype_path }}
        EXPECTED_SBOM: ${{ inputs.sbom_cyclonedx_sha256 }}
        EXPECTED_GRYPE: ${{ inputs.grype_json_sha256 }}
      run: |
        set -euo pipefail
        if [ -n "$EXPECTED_SBOM" ]; then
          actual=$(sha256sum "$SBOM_PATH" | cut -d' ' -f1)
          if [ "$actual" != "$EXPECTED_SBOM" ]; then
            echo "::error::CycloneDX SBOM hash mismatch (expected $EXPECTED_SBOM, got $actual). The predicate may have been swapped between jobs — refusing to attest."
            exit 1
          fi
          echo "CycloneDX SBOM hash matches: $actual"
        fi
        if [ -n "$EXPECTED_GRYPE" ]; then
          actual=$(sha256sum "$GRYPE_PATH" | cut -d' ' -f1)
          if [ "$actual" != "$EXPECTED_GRYPE" ]; then
            echo "::error::Grype JSON hash mismatch (expected $EXPECTED_GRYPE, got $actual). The predicate may have been swapped between jobs — refusing to attest."
            exit 1
          fi
          echo "Grype JSON hash matches: $actual"
        fi

    # SBOM-image binding: try several known locations syft has used over time
    # to identify the scanned image, and assert one of them matches the digest
    # or image-ID we're about to attest. When we find a property, we fail loud
    # on mismatch. When we find nothing (newer/older syft schema we don't
    # recognise), we warn and continue — the cross-job sha256 hash check above
    # is the load-bearing integrity guarantee, this binding is a second layer.
    #
    # Locations checked, in order:
    #   metadata.component.properties[].name = syft:image:manifestDigest
    #   metadata.component.properties[].name = syft:image:imageID
    #   metadata.properties[].name           = syft:image:manifestDigest
    #   metadata.properties[].name           = syft:image:imageID
    #   metadata.component.version           = sha256:...
    #   sha256 extracted from metadata.component.bom-ref (e.g. ...@sha256:abc)
    - name: Verify SBOM-image binding
      if: ${{ inputs.cosign_sign_enabled == 'true' && inputs.cosign_supply_chain_attest_enabled == 'true' }}
      shell: bash
      env:
        CYCLONEDX_PATH: ${{ steps.predicates.outputs.sbom_path }}
        EXPECTED_MANIFEST_DIGEST: ${{ steps.digest.outputs.value }}
        EXPECTED_IMAGE_ID: ${{ inputs.expected_image_id }}
      run: |
        set -euo pipefail

        find_prop() {
          local path="$1" name="$2"
          jq -r --arg n "$name" "$path"'[]? | select(.name == $n) | .value' "$CYCLONEDX_PATH" 2>/dev/null | head -1
        }

        manifest_digest="$(find_prop '.metadata.component.properties' 'syft:image:manifestDigest')"
        [ -n "$manifest_digest" ] && [ "$manifest_digest" != "null" ] || \
          manifest_digest="$(find_prop '.metadata.properties' 'syft:image:manifestDigest')"

        image_id="$(find_prop '.metadata.component.properties' 'syft:image:imageID')"
        [ -n "$image_id" ] && [ "$image_id" != "null" ] || \
          image_id="$(find_prop '.metadata.properties' 'syft:image:imageID')"

        # CycloneDX `metadata.component.version` is sometimes the digest.
        if [ -z "$manifest_digest" ] || [ "$manifest_digest" = "null" ]; then
          v=$(jq -r '.metadata.component.version // empty' "$CYCLONEDX_PATH" 2>/dev/null)
          case "$v" in sha256:*) manifest_digest="$v" ;; esac
        fi

        # Last resort: extract `@sha256:...` from bom-ref.
        if [ -z "$manifest_digest" ] || [ "$manifest_digest" = "null" ]; then
          ref=$(jq -r '.metadata.component."bom-ref" // empty' "$CYCLONEDX_PATH" 2>/dev/null)
          case "$ref" in *@sha256:*) manifest_digest="${ref##*@}" ;; esac
        fi

        if [ -n "$manifest_digest" ] && [ "$manifest_digest" != "null" ]; then
          if [ "$manifest_digest" = "$EXPECTED_MANIFEST_DIGEST" ]; then
            echo "SBOM-image binding via manifest digest: $manifest_digest ✓"
            exit 0
          fi
          # If the digest in the SBOM happens to be the imageID rather than the
          # manifest digest (depends on syft's source detection), accept it
          # under that interpretation too.
          if [ -n "$EXPECTED_IMAGE_ID" ] && [ "$manifest_digest" = "$EXPECTED_IMAGE_ID" ]; then
            echo "SBOM-image binding via image-ID (in manifest-digest field): $manifest_digest ✓"
            exit 0
          fi
          echo "::error::SBOM-image binding mismatch: SBOM identifies image as $manifest_digest, but expected manifest digest $EXPECTED_MANIFEST_DIGEST or image-ID ${EXPECTED_IMAGE_ID:-<unset>}."
          exit 1
        fi

        if [ -n "$image_id" ] && [ "$image_id" != "null" ]; then
          if [ -z "$EXPECTED_IMAGE_ID" ]; then
            echo "::warning::SBOM identifies the image only by syft:image:imageID, but no expected_image_id input was passed to sign-image. Skipping binding check (cross-job sha256 still enforced)."
            exit 0
          fi
          if [ "$image_id" != "$EXPECTED_IMAGE_ID" ]; then
            echo "::error::SBOM-image binding mismatch (syft:image:imageID): SBOM says $image_id but expected $EXPECTED_IMAGE_ID."
            exit 1
          fi
          echo "SBOM-image binding via syft:image:imageID: $image_id ✓"
          exit 0
        fi

        echo "::warning::Could not locate an image identifier in the CycloneDX SBOM (checked metadata.component.properties, metadata.properties, metadata.component.version, metadata.component.bom-ref). Skipping binding check — the cross-job sha256 hash check remains in force."
        echo "metadata block of the SBOM (for debugging — file an issue if this looks like it should have a digest somewhere):"
        jq '.metadata' "$CYCLONEDX_PATH" 2>/dev/null || cat "$CYCLONEDX_PATH" || true

    - name: Generate artifact attestation
      if: ${{ inputs.attest_build_provenance_enabled == 'true' }}
      uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
      with:
        subject-name: ${{ inputs.container_registry }}/${{ inputs.repository }}/${{ inputs.container_image_name_postfix }}
        subject-digest: ${{ steps.digest.outputs.value }}
        push-to-registry: true

    # Kyverno 1.17 resolves Cosign attestations like Cosign v2 (sha256-….att manifest tags). Cosign v3+ often publishes via OCI referrers only → 404 on that path while local cosign v3 verify still works via /referrers/.
    - name: Install Cosign
      if: ${{ inputs.cosign_sign_enabled == 'true' }}
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      with:
        cosign-release: v2.4.3

    - name: Sign container image (cosign, keyless)
      if: ${{ inputs.cosign_sign_enabled == 'true' }}
      shell: bash
      env:
        DIGEST: ${{ steps.digest.outputs.value }}
        CONTAINER_TAGS: ${{ inputs.container_tags }}
      run: |
        set -euo pipefail
        images=""
        while IFS= read -r tag; do
          tag=$(echo "$tag" | xargs)
          [ -z "$tag" ] && continue
          if [ -z "$images" ]; then
            images="${tag}@${DIGEST}"
          else
            images="${images} ${tag}@${DIGEST}"
          fi
        done < <(echo "$CONTAINER_TAGS" | tr ',' '\n')
        [ -n "$images" ] || { echo "::error::No image refs to sign"; exit 1; }
        echo "Signing images: ${images}"
        cosign sign --yes ${images}

    - name: Build cosign vuln attestation predicate
      if: ${{ inputs.cosign_sign_enabled == 'true' && inputs.cosign_supply_chain_attest_enabled == 'true' }}
      shell: bash
      env:
        RUN_URI: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        RUN_ID: ${{ github.run_id }}
        GRYPE_JSON: ${{ steps.predicates.outputs.grype_path }}
        OUT_PATH: ${{ runner.temp }}/cosign-vuln-predicate.json
      run: |
        set -euo pipefail
        [ -f "$GRYPE_JSON" ] || { echo "::error::Missing Grype JSON for vuln attestation: $GRYPE_JSON"; exit 1; }
        STARTED="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        FINISHED="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        jq -n \
          --slurpfile result "$GRYPE_JSON" \
          --arg run_uri "$RUN_URI" \
          --arg run_id "$RUN_ID" \
          --arg started "$STARTED" \
          --arg finished "$FINISHED" \
          '{
            invocation: {
              parameters: ["sbom"],
              uri: $run_uri,
              event_id: $run_id,
              "builder.id": "https://github.com/actions/runner"
            },
            scanner: {
              uri: "https://github.com/anchore/grype",
              version: "anchore/scan-action@v7",
              db: {uri: "", version: ""},
              result: $result[0]
            },
            metadata: {
              scanStartedOn: $started,
              scanFinishedOn: $finished
            }
          }' > "$OUT_PATH"

    - name: Cosign attest CycloneDX and vulnerability scan (registry)
      if: ${{ inputs.cosign_sign_enabled == 'true' && inputs.cosign_supply_chain_attest_enabled == 'true' }}
      shell: bash
      env:
        IMAGE_REF: ${{ inputs.container_registry }}/${{ inputs.repository }}/${{ inputs.container_image_name_postfix }}@${{ steps.digest.outputs.value }}
        CYCLONEDX_PATH: ${{ steps.predicates.outputs.sbom_path }}
        VULN_PREDICATE: ${{ runner.temp }}/cosign-vuln-predicate.json
      run: |
        set -euo pipefail
        [ -f "$CYCLONEDX_PATH" ] || { echo "::error::Missing CycloneDX SBOM: $CYCLONEDX_PATH"; exit 1; }
        cosign attest --yes --type cyclonedx --predicate "$CYCLONEDX_PATH" "$IMAGE_REF"
        cosign attest --yes --type vuln --predicate "$VULN_PREDICATE" "$IMAGE_REF"
