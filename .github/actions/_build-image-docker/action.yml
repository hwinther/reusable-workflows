name: "Build Docker container locally"
description: |
  Runs `docker buildx build` with `load: true` so the image is available in the
  local Docker daemon for downstream scan and push steps. Does not push to any
  registry. Tags from gitversion are applied to the loaded image.

  Internal — leading underscore signals it's not part of the public surface.

inputs:
  build_context:
    required: true
    description: "Docker build context, e.g. frontend or '.'"
  dockerfile:
    required: true
    description: "Dockerfile path, e.g. frontend/Dockerfile"
  tags:
    required: true
    description: "Comma-separated full image refs to apply (from gitversion container_image_tags)."
  app_version:
    required: false
    description: "APP_VERSION build arg, typically gitversion version output."
    default: ""
  git_sha:
    required: false
    description: "GIT_SHA build arg."
    default: ${{ github.sha }}
  labels:
    required: false
    description: "OCI labels to apply (newline-separated, from docker/metadata-action)."
    default: ""
  platforms:
    required: false
    description: "Single buildx platform for the local-loaded image, e.g. linux/amd64 or linux/arm64. Multi-platform manifest lists are produced at push time, not here."
    default: "linux/amd64"
  build_args:
    required: false
    description: "Additional newline-separated KEY=VALUE build args appended after APP_VERSION and GIT_SHA. Used for things like passing a digest-pinned base image ref."
    default: ""
  npm_auth_token:
    required: false
    description: "When non-empty, exposed to the build as a BuildKit secret with id `npm_auth_token`. Consume in the Dockerfile via `RUN --mount=type=secret,id=npm_auth_token,target=/run/secrets/npm_auth_token`. Build args are NOT used for this because they leak into image history."
    default: ""

outputs:
  local_ref:
    description: "First tag in `tags`, available in the local Docker daemon after this action runs."
    value: ${{ steps.resolve-ref.outputs.local_ref }}

runs:
  using: "composite"
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

    - name: Build container (load locally, do not push)
      uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
      with:
        context: ${{ inputs.build_context }} # zizmor: ignore[template-injection]
        file: ${{ inputs.dockerfile }} # zizmor: ignore[template-injection]
        push: false
        load: true
        platforms: ${{ inputs.platforms }}
        tags: ${{ inputs.tags }}
        build-args: |
          APP_VERSION=${{ inputs.app_version }}
          GIT_SHA=${{ inputs.git_sha }}
          ${{ inputs.build_args }}
        labels: ${{ inputs.labels }}
        secrets: ${{ inputs.npm_auth_token != '' && format('npm_auth_token={0}', inputs.npm_auth_token) || '' }}

    - name: Resolve local ref (first tag)
      id: resolve-ref
      shell: bash
      env:
        TAGS: ${{ inputs.tags }}
      run: |
        set -euo pipefail
        FIRST=$(echo "$TAGS" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | grep -v '^$' | head -1)
        [ -n "$FIRST" ] || { echo "::error::No tag could be resolved from inputs.tags ('$TAGS')"; exit 1; }
        echo "local_ref=$FIRST" >> "$GITHUB_OUTPUT"
        echo "Local ref: $FIRST"
