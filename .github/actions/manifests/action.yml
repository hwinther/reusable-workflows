name: "Render, validate, publish and diff app manifests"
description: |
  Public composite. Ships an app's kustomize directories as a rendered, signed OCI artifact for
  a Flux OCIRepository, and reviews manifest changes on PRs.

    mode: push  renders every `renders` entry with `images` pinned (tag@digest), validates with
                kubeconform, checks the variable contract, pushes `artifact:tag` with
                `flux push artifact`, and signs it with cosign keyless.
    mode: diff  renders the PR head (validated) and base (best effort) and posts a report to the
                job summary and a sticky PR comment: a change summary and a Mermaid resource map
                per render, plus a collapsible dyff per changed resource.

  Runs inline in the caller's job, so the cosign certificate identity is the CALLER's workflow
  (e.g. `.../container.yml@refs/tags/v1.2.3`), not this repo; pin that in the OCIRepository's
  `verify.matchOIDCIdentity`. Same reasoning as sign-image.

  Contract check: a rendered `${VAR}` without a default fails unless the nearest README.md at or
  above its directory documents it as `VAR` (Flux substitutes an undefined variable with "").

  A cluster repo can use diff mode too: one render per Flux Kustomization path, `map: changed`
  (a whole-cluster map would have hundreds of nodes), `contract: "false"`, and `validate:
  "false"` or CRD-tolerant kubeconform_args.

  The caller must check out its repo first (persist-credentials: false is fine). Permissions:
    push: contents: read, packages: write, id-token: write
    diff: contents: read, pull-requests: write (or comment: "false")

inputs:
  mode:
    required: true
    description: "push or diff."
  renders:
    required: false
    description: |
      One render per line: `<out-path>=<deploy-dir>[,<component>]`. out-path is the file inside
      the artifact (the Flux Kustomization `path` is its directory); component is a kustomize
      Component path under deploy-dir. Example for an app with a migration Job:
        app/manifests.yaml=deploy/app
        migrate/manifests.yaml=deploy/migrate
    default: "manifests.yaml=deploy"
  images:
    required: false
    description: "push: image refs to pin, one per line, `registry/name:tag@sha256:...`. Applied to every render."
    default: ""
  artifact:
    required: false
    description: "push: OCI repository without tag or scheme, e.g. ghcr.io/owner/app/manifests."
    default: ""
  tag:
    required: false
    description: "push: artifact tag, e.g. the release version or pr-<N>."
    default: ""
  revision:
    required: false
    description: "push: source revision recorded on the artifact. Default `<ref name>@sha1:<sha>`, or `<tag>@sha1:<PR head sha>` on pull requests."
    default: ""
  sign:
    required: false
    description: "push: sign the pushed digest with cosign keyless (needs id-token: write)."
    default: "true"
  registry_username:
    required: false
    description: "push: registry login user."
    default: ${{ github.actor }}
  registry_token:
    required: false
    description: "push: registry login token (packages: write)."
    default: ${{ github.token }}
  kubeconform_args:
    required: false
    description: "kubeconform flags, e.g. add `-ignore-missing-schemas` for CRDs without a schema."
    default: "-strict -summary"
  validate:
    required: false
    description: "Run kubeconform on the head renders."
    default: "true"
  contract:
    required: false
    description: "Run the contract check. Set false for directories that aren't an artifact contract."
    default: "true"
  map:
    required: false
    description: |
      diff: `all` maps every resource of a render; `changed` maps only the changed resources and
      their direct neighbours and folds unchanged renders into one line (whole-cluster renders).
    default: "all"
  helm:
    required: false
    description: |
      diff: also template each changed Flux HelmRelease's chart at the base and the head (helm
      template, with its HelmRepository/OCIRepository, valuesFrom ConfigMaps, values and
      postRenderers from the render) and report the chart's resource changes below it.
    default: "false"
  helm_kube_version:
    required: false
    description: "diff: --kube-version for helm template, e.g. the cluster's 1.35.8."
    default: ""
  note:
    required: false
    description: "diff: footer line of the report."
    default: "Placeholder image tags; the release job pins tag@digest."
  comment:
    required: false
    description: "diff: keep a sticky PR comment in sync (skipped for fork PRs, whose token is read-only; Dependabot PRs get the caller's pull-requests: write)."
    default: "true"
  comment_key:
    required: false
    description: "diff: marker that identifies the sticky comment; set distinct keys to run several diffs on one PR."
    default: "manifest-diff"
  github_token:
    required: false
    description: "diff: token for the PR comment."
    default: ${{ github.token }}

outputs:
  digest:
    description: "push: digest of the pushed artifact (sha256:...)."
    value: ${{ steps.push.outputs.digest }}
  ref:
    description: "push: repository@digest of the pushed artifact."
    value: ${{ steps.push.outputs.ref }}

runs:
  using: "composite"
  steps:
  - name: Check inputs
    shell: bash
    env:
      MODE: ${{ inputs.mode }}
      ARTIFACT: ${{ inputs.artifact }}
      TAG: ${{ inputs.tag }}
      IMAGES: ${{ inputs.images }}
      EVENT_NAME: ${{ github.event_name }}
    run: |
      case "$MODE" in
        push)
          if [ -z "$ARTIFACT" ] || [ -z "$TAG" ]; then
            echo "::error::mode push needs artifact and tag"
            exit 1
          fi
          if [ -z "$(printf '%s' "$IMAGES" | tr -d '[:space:]')" ]; then
            echo "::error::mode push needs images: an artifact with placeholder image tags would deploy nothing useful"
            exit 1
          fi
          ;;
        diff)
          if [[ "$EVENT_NAME" != pull_request* ]]; then
            echo "::error::mode diff runs on pull_request events (it diffs against the PR base)"
            exit 1
          fi
          ;;
        *)
          echo "::error::mode must be push or diff, got '$MODE'"
          exit 1
          ;;
      esac

  - name: Install kubeconform and dyff
    shell: bash
    env:
      MODE: ${{ inputs.mode }}
      KUBECONFORM_VERSION: v0.8.0
      KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
      DYFF_VERSION: 1.12.0
      DYFF_SHA256: 50b43017a7474c2216694d0b5387439488a1d3c2b5eefe1674cd0e5c18bc0316
    run: |
      bin="$RUNNER_TEMP/manifests-bin"
      mkdir -p "$bin"
      curl -fsSLo "$RUNNER_TEMP/kubeconform.tgz" "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
      echo "${KUBECONFORM_SHA256}  $RUNNER_TEMP/kubeconform.tgz" | sha256sum -c -
      tar -xzf "$RUNNER_TEMP/kubeconform.tgz" -C "$bin" kubeconform
      if [ "$MODE" = diff ]; then
        curl -fsSLo "$RUNNER_TEMP/dyff.tgz" "https://github.com/homeport/dyff/releases/download/v${DYFF_VERSION}/dyff_${DYFF_VERSION}_linux_amd64.tar.gz"
        echo "${DYFF_SHA256}  $RUNNER_TEMP/dyff.tgz" | sha256sum -c -
        tar -xzf "$RUNNER_TEMP/dyff.tgz" -C "$bin" dyff
      fi

  - name: Render and validate
    shell: bash
    env:
      RENDERS: ${{ inputs.renders }}
      IMAGES: ${{ inputs.mode == 'push' && inputs.images || '' }}
      KUBECONFORM_ARGS: ${{ inputs.kubeconform_args }}
      VALIDATE: ${{ inputs.validate }}
      CONTRACT: ${{ inputs.contract }}
    # The tools live in $RUNNER_TEMP/manifests-bin; each step adds it to its own PATH rather than
    # writing GITHUB_PATH for the rest of the caller's job.
    run: |
      export PATH="$RUNNER_TEMP/manifests-bin:$PATH"
      bash "$GITHUB_ACTION_PATH/scripts/render-all.sh" . "$RUNNER_TEMP/manifests-head" "$RUNNER_TEMP/manifests-renders.txt" validate

  # --- diff -------------------------------------------------------------------------------------

  - name: Check out the PR base
    if: inputs.mode == 'diff'
    uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    with:
      ref: ${{ github.event.pull_request.base.sha }}
      path: .manifests-base
      persist-credentials: false

  - name: Render the PR base
    if: inputs.mode == 'diff'
    shell: bash
    env:
      RENDERS: ${{ inputs.renders }}
      CONTRACT: ${{ inputs.contract }}
    # The base is rendered with this action's scripts, so a script change can't break it, and
    # its contract isn't this PR's problem.
    run: bash "$GITHUB_ACTION_PATH/scripts/render-all.sh" .manifests-base "$RUNNER_TEMP/manifests-base" "$RUNNER_TEMP/manifests-base-renders.txt" best-effort

  - name: Build the report
    if: inputs.mode == 'diff'
    shell: bash
    env:
      COMMENT_KEY: ${{ inputs.comment_key }}
      MAP: ${{ inputs.map }}
      NOTE: ${{ inputs.note }}
      HELM: ${{ inputs.helm }}
      HELM_KUBE_VERSION: ${{ inputs.helm_kube_version }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    run: |
      export PATH="$RUNNER_TEMP/manifests-bin:$PATH"
      head="$RUNNER_TEMP/manifests-head"
      base="$RUNNER_TEMP/manifests-base"
      args=()
      while IFS= read -r out; do
        mkdir -p "$(dirname "$base/$out")"
        touch "$base/$out"
        yq -o=json -I=0 '.' "$base/$out" > "$base/$out.jsonl"
        yq -o=json -I=0 '.' "$head/$out" > "$head/$out.jsonl"
        args+=("$out" "$base/$out.jsonl" "$head/$out.jsonl")
      done < "$RUNNER_TEMP/manifests-renders.txt"
      python3 "$GITHUB_ACTION_PATH/scripts/manifest-report.py" --run-url "$RUN_URL" --marker "$COMMENT_KEY" --map "$MAP" --note "$NOTE" --helm "$HELM" "${args[@]}" > "$RUNNER_TEMP/manifests-report.md"
      cat "$RUNNER_TEMP/manifests-report.md" >> "$GITHUB_STEP_SUMMARY"

  - name: Keep the sticky PR comment in sync
    if: inputs.mode == 'diff' && inputs.comment == 'true' && github.event.pull_request.head.repo.full_name == github.repository
    shell: bash
    env:
      GH_TOKEN: ${{ inputs.github_token }}
      PR: ${{ github.event.pull_request.number }}
      MARKER: "<!-- ${{ inputs.comment_key }} -->"
    run: |
      id="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" \
        --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"${MARKER}\"))) | .id" | head -n1)"
      if [ -n "$id" ]; then
        gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${id}" -F body=@"$RUNNER_TEMP/manifests-report.md" > /dev/null
      else
        gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" -F body=@"$RUNNER_TEMP/manifests-report.md" > /dev/null
      fi

  # --- push -------------------------------------------------------------------------------------

  - name: Set up Flux CLI
    if: inputs.mode == 'push'
    uses: fluxcd/flux2/action@b9c17924adb533d3617ec7de97a7b0f4acc07b39 # v2.9.6

  - name: Set up cosign
    if: inputs.mode == 'push' && inputs.sign == 'true'
    uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

  - name: Push and sign
    id: push
    if: inputs.mode == 'push'
    shell: bash
    env:
      ARTIFACT: ${{ inputs.artifact }}
      TAG: ${{ inputs.tag }}
      REVISION: ${{ inputs.revision }}
      SIGN: ${{ inputs.sign }}
      REGISTRY_USERNAME: ${{ inputs.registry_username }}
      REGISTRY_TOKEN: ${{ inputs.registry_token }}
      EVENT_NAME: ${{ github.event_name }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    run: |
      if [ -z "$REVISION" ]; then
        if [[ "$EVENT_NAME" == pull_request* ]]; then
          REVISION="${TAG}@sha1:${PR_HEAD_SHA}"
        else
          REVISION="${GITHUB_REF_NAME}@sha1:${GITHUB_SHA}"
        fi
      fi
      # flux push and cosign both read ~/.docker/config.json.
      printf '%s' "$REGISTRY_TOKEN" | docker login "${ARTIFACT%%/*}" --username "$REGISTRY_USERNAME" --password-stdin
      pushed="$(flux push artifact "oci://${ARTIFACT}:${TAG}" \
        --path="$RUNNER_TEMP/manifests-head" \
        --source="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
        --revision="$REVISION" \
        --output=json)"
      digest="$(printf '%s' "$pushed" | jq -r '.digest')"
      ref="$(printf '%s' "$pushed" | jq -r '.repository')@${digest}"
      if [ "$SIGN" = true ]; then
        cosign sign --yes "$ref"
      fi
      echo "digest=$digest" >> "$GITHUB_OUTPUT"
      echo "ref=$ref" >> "$GITHUB_OUTPUT"
      {
        echo "### Manifest artifact"
        echo
        echo "\`${ARTIFACT}:${TAG}\` → \`${digest}\`$([ "$SIGN" = true ] && echo ', signed (cosign keyless).')"
        echo
        echo "Renders: $(sed 's/.*/`&`/' "$RUNNER_TEMP/manifests-renders.txt" | paste -sd, - | sed 's/,/, /g')"
      } >> "$GITHUB_STEP_SUMMARY"
