name: "Determine package version and container image tag"
description: "Determine package version and container image tag based on GitVersion"

inputs:
  container_registry:
    description: 'Container registry, e.g. ghcr.io'
    default: 'ghcr.io'
  container_image_name:
    description: 'Container image name, e.g. owner/repo/frontend'
    default: ''
  override_config:
    description: |
      GitVersion /overrideconfig entries, one `key=value` per line (e.g. `tag-prefix=v`).
      gittools/actions silently drops lines that aren't key=value, so nested YAML such as
      `branches:` blocks can't be passed here; put those in the repo's GitVersion.yml.
    default: ''
  persist_checkout_credentials:
    description: 'actions/checkout persist-credentials; set true only if a later step in the same job runs git push using this clone.'
    required: false
    default: 'false'

outputs:
  deploy_tag:
    description: "Deploy tag: registry, image name and tag to deploy to an environment"
    value: ${{ steps.determine_version_and_tag_values.outputs.deploy_tag }}
  container_image_tags:
    description: "Registry, image name and tags to push to the container registry"
    value: ${{ steps.determine_version_and_tag_values.outputs.container_image_tags }}
  image_tags:
    description: "Image tags only (without registry and image name)"
    value: ${{ steps.determine_version_and_tag_values.outputs.image_tags }}
  version:
    description: "Package version to use when deploying to a package registry"
    value: ${{ steps.determine_version_and_tag_values.outputs.version }}
  is_alpha:
    description: "Boolean indicating whether the version is an alpha/prerelease"
    value: ${{ steps.determine_version_and_tag_values.outputs.is_alpha }}
  git_version_major_minor_patch:
    description: "GitVersion Major.Minor.Patch version — useful for debugging or handling edge cases"
    value: ${{ steps.determine_version_values.outputs.majorMinorPatch }}
  git_version_semver:
    description: "GitVersion SemVer version — useful for debugging or handling edge cases"
    value: ${{ steps.determine_version_values.outputs.semVer }}

runs:
  using: "composite"
  steps:
  - name: Checkout code
    uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
    with:
      fetch-depth: 0
      fetch-tags: true
      persist-credentials: ${{ inputs.persist_checkout_credentials == 'true' }}

  - name: Install GitVersion
    uses: gittools/actions/gitversion/setup@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0
    with:
      versionSpec: '6.8.x'

  - name: Determine next version
    id: determine_version_values
    uses: gittools/actions/gitversion/execute@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0
    with:
      overrideConfig: ${{ inputs.override_config }}

  # A pull_request build checks out refs/pull/<N>/merge, so GitVersion labels it
  # "PullRequest<N>" (no branch rule can see the source branch there). Swap that label for the
  # source branch, sanitised the way GitVersion does it for push builds, so PR tags read like
  # "0.20.1-feat-login-fix.2" and match what a push build of the same branch produces.
  - name: Use the source branch as the pull-request label
    id: pr_label
    shell: bash
    env:
      EVENT_NAME: ${{ github.event_name }}
      HEAD_REF: ${{ github.head_ref }}
      SEMVER: ${{ steps.determine_version_values.outputs.semVer }}
      LABEL: ${{ steps.determine_version_values.outputs.preReleaseLabel }}
    run: |
      semver="$SEMVER"
      if [[ "$EVENT_NAME" == pull_request* && -n "$HEAD_REF" && "$LABEL" == PullRequest* ]]; then
        # SemVer identifiers allow [0-9A-Za-z-]; Docker tags cap at 128 characters overall.
        branch="$(printf '%s' "$HEAD_REF" | sed -e 's/[^0-9A-Za-z-]/-/g' -e 's/--*/-/g' -e 's/^-//' | cut -c1-80 | sed -e 's/-*$//')"
        # A purely numeric identifier with a leading zero is invalid SemVer.
        if [[ "$branch" =~ ^[0-9]+$ ]]; then
          branch="b$branch"
        fi
        if [ -n "$branch" ]; then
          semver="${semver/"$LABEL"/"$branch"}"
          echo "Pull-request label: $LABEL -> $branch"
        fi
      fi
      echo "semver=$semver" >> "$GITHUB_OUTPUT"

  - name: Determine version and tag values
    id: determine_version_and_tag_values
    shell: bash
    run: |
      echo "GitVersion MajorMinorPatch: ${{ steps.determine_version_values.outputs.majorMinorPatch }}"
      echo "GitVersion SemVer: ${{ steps.pr_label.outputs.semver }}"

      LATEST_CONTAINER_IMAGE_TAG="${{ inputs.container_registry }}/${{ inputs.container_image_name }}:latest"
      GITVERSION_MAJOR_MINOR_PATCH_TAG="${{ inputs.container_registry }}/${{ inputs.container_image_name }}:${{ steps.determine_version_values.outputs.majorMinorPatch }}"
      GITVERSION_SEMVER_TAG="${{ inputs.container_registry }}/${{ inputs.container_image_name }}:${{ steps.pr_label.outputs.semver }}"

      # `:latest` should only ever point at the most recent stable minor release. We attach
      # it if all three hold:
      #   1. building from a v-prefixed git tag (no main, no feature branches)
      #   2. patch component is 0 (e.g. v2.1.0, NOT v2.1.3 — a hotfix shouldn't move :latest)
      #   3. this tag is the highest stable v-tag in the repo (so a hotfix on an old
      #      release branch can't move :latest backwards)
      INCLUDE_LATEST=false
      if [ -n "${{ github.ref_name }}" ] && [[ "${{ github.ref_name }}" == v* ]]; then
        PATCH=$(echo "${{ steps.determine_version_values.outputs.majorMinorPatch }}" | cut -d. -f3)
        if [ "$PATCH" = "0" ]; then
          CURRENT_TAG="v${{ steps.determine_version_values.outputs.majorMinorPatch }}"
          # Only consider plain vMAJOR.MINOR.PATCH tags — exclude prereleases like v2.0.0-beta1.
          HIGHEST_TAG=$(git tag -l | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          if [ "$CURRENT_TAG" = "$HIGHEST_TAG" ]; then
            INCLUDE_LATEST=true
          else
            echo "Not tagging latest: current=$CURRENT_TAG, highest=$HIGHEST_TAG"
          fi
        else
          echo "Not tagging latest: patch=$PATCH (only x.x.0 releases get :latest)"
        fi
      fi

      if [ -n "${{ github.ref_name }}" ] && [[ "${{ github.ref_name }}" == "main" ]]; then
        if [ -n "${{ inputs.container_image_name }}" ]; then
          echo "deploy_tag=$GITVERSION_MAJOR_MINOR_PATCH_TAG" >> $GITHUB_OUTPUT
          echo "container_image_tags=$GITVERSION_MAJOR_MINOR_PATCH_TAG" >> $GITHUB_OUTPUT
          echo "image_tags=${{ steps.determine_version_values.outputs.majorMinorPatch }}" >> $GITHUB_OUTPUT
          echo "Using tag: $GITVERSION_MAJOR_MINOR_PATCH_TAG"
        fi

        echo "version=${{ steps.determine_version_values.outputs.majorMinorPatch }}" >> $GITHUB_OUTPUT
        echo "Setting version to ${{ steps.determine_version_values.outputs.majorMinorPatch }}"
        echo "is_alpha=false" >> $GITHUB_OUTPUT
        echo "Setting is_alpha to false"
      elif [ -n "${{ github.ref_name }}" ] && [[ "${{ github.ref_name }}" == v* ]]; then
        if [ -n "${{ inputs.container_image_name }}" ]; then
          echo "deploy_tag=$GITVERSION_MAJOR_MINOR_PATCH_TAG" >> $GITHUB_OUTPUT
          if [ "$INCLUDE_LATEST" = "true" ]; then
            echo "container_image_tags=$LATEST_CONTAINER_IMAGE_TAG,$GITVERSION_MAJOR_MINOR_PATCH_TAG" >> $GITHUB_OUTPUT
            echo "image_tags=latest;${{ steps.determine_version_values.outputs.majorMinorPatch }}" >> $GITHUB_OUTPUT
            echo "Using tags: $LATEST_CONTAINER_IMAGE_TAG,$GITVERSION_MAJOR_MINOR_PATCH_TAG"
          else
            echo "container_image_tags=$GITVERSION_MAJOR_MINOR_PATCH_TAG" >> $GITHUB_OUTPUT
            echo "image_tags=${{ steps.determine_version_values.outputs.majorMinorPatch }}" >> $GITHUB_OUTPUT
            echo "Using tag: $GITVERSION_MAJOR_MINOR_PATCH_TAG"
          fi
        fi

        echo "version=${{ steps.determine_version_values.outputs.majorMinorPatch }}" >> $GITHUB_OUTPUT
        echo "Setting version to ${{ steps.determine_version_values.outputs.majorMinorPatch }}"
        echo "is_alpha=false" >> $GITHUB_OUTPUT
        echo "Setting is_alpha to false"
      else
        if [ -n "${{ inputs.container_image_name }}" ]; then
          # Feature/bugfix branch — use SemVer (which includes the prerelease label derived
          # from the branch name, e.g. "1.2.1-mybranch.5") so the container tag matches the
          # package version and uniquely identifies which branch the build came from.
          echo "deploy_tag=$GITVERSION_SEMVER_TAG" >> $GITHUB_OUTPUT
          echo "container_image_tags=$GITVERSION_SEMVER_TAG" >> $GITHUB_OUTPUT
          echo "image_tags=${{ steps.pr_label.outputs.semver }}" >> $GITHUB_OUTPUT
          echo "Using tag with prerelease label: $GITVERSION_SEMVER_TAG"
        fi

        echo "version=${{ steps.pr_label.outputs.semver }}" >> $GITHUB_OUTPUT
        echo "Setting version to ${{ steps.pr_label.outputs.semver }}"
        echo "is_alpha=true" >> $GITHUB_OUTPUT
        echo "Setting is_alpha to true"
      fi
