name: "Deploy pakke til GitHub Packages"

on:
  workflow_call:
    inputs:
      working-directory:
        required: false
        type: string
        description: "Mappen der for eksempel bibliotek koden ligger"
        default: "./"
      node_version:
        required: false
        type: string
        description: "Node versjon, f.eks. 24.x"
        default: "24.x"
      package_version:
        required: true
        type: string
        description: "Pakkeversjon som skal publiseres, f.eks. 1.0.0 eller 1.0.0-beta.1"
      is_alpha:
        required: false
        type: string # Vi må ha denne inn som en string fordi output fra den andre arbeidsflyten blir en string
        description: "Indikerer om versjonen som skal publiseres er en alpha/prerelease versjon"
        default: 'false'
      scope:
        required: false
        type: string
        description: "Scope for pakken, f.eks. '@organisasjon'"
        default: ''
      npm_registry_url:
        required: false
        type: string
        description: "npm registry-URL som sendes til actions/setup-node og publish. Standard er GitHub Packages."
        default: "https://npm.pkg.github.com"
    secrets:
      npm_auth_token:
        required: false
        description: "Auth token brukt som NODE_AUTH_TOKEN ved npm ci og npm publish. Ved tom verdi brukes secrets.GITHUB_TOKEN (standard GitHub Packages-flyt)."

env:
  NODE_VERSION: ${{ inputs.node_version }}

jobs:
  deploy:
    name: "Deploy npm ${{ inputs.package_version }}"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        name: Sett opp Node
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: ${{ inputs.npm_registry_url }}
          scope: ${{ inputs.scope }}
          cache: "npm"
          cache-dependency-path: ${{ inputs.working-directory != '' && format('{0}/package-lock.json', inputs.working-directory) || 'package-lock.json' }}

      - name: Oppdater pakkeversjonen
        working-directory: ${{ inputs.working-directory }}
        env:
          PKG_VERSION: ${{ inputs.package_version }}
        run: npm version "$PKG_VERSION" --no-git-tag-version

      - name: Installer avhengigheter
        working-directory: ${{ inputs.working-directory }}
        id: dependency-install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.npm_auth_token != '' && secrets.npm_auth_token || secrets.GITHUB_TOKEN }}
        run: npm ci

      - name: Bygg pakke
        working-directory: ${{ inputs.working-directory }}
        run: npm run build

      - name: Publiser pakke
        working-directory: ${{ inputs.working-directory }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.npm_auth_token != '' && secrets.npm_auth_token || secrets.GITHUB_TOKEN }}
          IS_ALPHA: ${{ inputs.is_alpha }}
        run: |
          if [ "$IS_ALPHA" = "true" ]; then
            npm publish --tag alpha
          else
            npm publish
          fi

      - name: Oppsummering
        working-directory: ${{ inputs.working-directory }}
        env:
          PKG_VERSION: ${{ inputs.package_version }}
          IS_ALPHA: ${{ inputs.is_alpha }}
          SCOPE: ${{ inputs.scope }}
          REGISTRY_URL: ${{ inputs.npm_registry_url }}
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          if [ "$IS_ALPHA" = "true" ]; then
            DIST_TAG="alpha"
          else
            DIST_TAG="latest"
          fi
          {
            echo "### npm publish"
            echo ""
            echo "- Package: \`${PKG_NAME}\`"
            echo "- Version: \`${PKG_VERSION}\`"
            echo "- Tag: \`${DIST_TAG}\`"
            echo "- Alpha: \`${IS_ALPHA}\`"
            echo "- Scope: \`${SCOPE:-(none)}\`"
            echo "- Registry: \`${REGISTRY_URL}\`"
          } >> "$GITHUB_STEP_SUMMARY"