name: "Deploy package to GitHub Packages"

on:
  workflow_call:
    inputs:
      working_directory:
        required: false
        type: string
        description: "Directory containing the package code, e.g. where package.json lives"
        default: "./"
      node_version:
        required: false
        type: string
        description: "Node version, e.g. 24.x"
        default: "24.x"
      package_version:
        required: true
        type: string
        description: "Package version to publish, e.g. 1.0.0 or 1.0.0-beta.1"
      is_alpha:
        required: false
        type: string # Must be a string because the upstream workflow output round-trips as a string
        description: "Indicates whether the version being published is an alpha/prerelease version"
        default: 'false'
      npm_scope:
        required: false
        type: string
        description: "Package scope, e.g. '@org'"
        default: ''
      npm_registry_url:
        required: false
        type: string
        description: "npm registry URL passed to actions/setup-node and publish. Defaults to GitHub Packages."
        default: "https://npm.pkg.github.com"
    secrets:
      npm_auth_token:
        required: false
        description: "Auth token used as NODE_AUTH_TOKEN for npm ci and npm publish. When empty, falls back to secrets.GITHUB_TOKEN (the standard GitHub Packages flow)."
    outputs:
      published_version:
        description: "The package version that was published."
        value: ${{ inputs.package_version }}

env:
  NODE_VERSION: ${{ inputs.node_version }}

jobs:
  deploy:
    name: "Deploy npm ${{ inputs.package_version }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        name: Set up Node
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: ${{ inputs.npm_registry_url }}
          scope: ${{ inputs.npm_scope }}
          cache: "npm"
          cache-dependency-path: ${{ inputs.working_directory != '' && format('{0}/package-lock.json', inputs.working_directory) || 'package-lock.json' }}

      - name: Update package version
        working-directory: ${{ inputs.working_directory }}
        env:
          PKG_VERSION: ${{ inputs.package_version }}
        run: npm version "$PKG_VERSION" --no-git-tag-version

      - name: Install dependencies
        working-directory: ${{ inputs.working_directory }}
        id: dependency-install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.npm_auth_token != '' && secrets.npm_auth_token || secrets.GITHUB_TOKEN }}
        run: npm ci

      - name: Build package
        working-directory: ${{ inputs.working_directory }}
        run: npm run build

      - name: Publish package
        working-directory: ${{ inputs.working_directory }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.npm_auth_token != '' && secrets.npm_auth_token || secrets.GITHUB_TOKEN }}
          IS_ALPHA: ${{ inputs.is_alpha }}
        run: |
          if [ "$IS_ALPHA" = "true" ]; then
            npm publish --tag alpha
          else
            npm publish
          fi

      - name: Summary
        working-directory: ${{ inputs.working_directory }}
        env:
          PKG_VERSION: ${{ inputs.package_version }}
          IS_ALPHA: ${{ inputs.is_alpha }}
          SCOPE: ${{ inputs.npm_scope }}
          REGISTRY_URL: ${{ inputs.npm_registry_url }}
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          if [ "$IS_ALPHA" = "true" ]; then
            DIST_TAG="alpha"
          else
            DIST_TAG="latest"
          fi
          {
            echo "### npm publish"
            echo ""
            echo "- Package: \`${PKG_NAME}\`"
            echo "- Version: \`${PKG_VERSION}\`"
            echo "- Tag: \`${DIST_TAG}\`"
            echo "- Alpha: \`${IS_ALPHA}\`"
            echo "- Scope: \`${SCOPE:-(none)}\`"
            echo "- Registry: \`${REGISTRY_URL}\`"
          } >> "$GITHUB_STEP_SUMMARY"
