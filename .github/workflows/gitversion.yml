name: "Determine package version and container image tag"

on:
  workflow_call:
    inputs:
      container_registry:
        description: 'Container registry, e.g. ghcr.io'
        default: 'ghcr.io'
        type: string
      container_image_name:
        description: 'Container image name, e.g. owner/repo/frontend'
        default: ''
        type: string
      override_config:
        description: 'GitVersion configuration overrides in YAML format'
        default: ''
        type: string
    outputs:
      deploy_tag:
        description: "Deploy tag: registry, image name and tag to deploy to an environment"
        value: ${{ jobs.determine-version.outputs.deploy_tag }}
      container_image_tags:
        description: "Registry, image name and tags to push to the container registry"
        value: ${{ jobs.determine-version.outputs.container_image_tags }}
      image_tags:
        description: "Image tags only (without registry and image name)"
        value: ${{ jobs.determine-version.outputs.image_tags }}
      version:
        description: "Package version to use when deploying to a package registry"
        value: ${{ jobs.determine-version.outputs.version }}
      is_alpha:
        description: "Boolean indicating whether the version is an alpha/prerelease"
        value: ${{ jobs.determine-version.outputs.is_alpha }}
      git_version_major_minor_patch:
        description: "GitVersion Major.Minor.Patch version — useful for debugging or handling edge cases"
        value: ${{ jobs.determine-version.outputs.git_version_major_minor_patch }}
      git_version_semver:
        description: "GitVersion SemVer version — useful for debugging or handling edge cases"
        value: ${{ jobs.determine-version.outputs.git_version_semver }}

jobs:
  determine-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      deploy_tag: ${{ steps.gitversion.outputs.deploy_tag }}
      container_image_tags: ${{ steps.gitversion.outputs.container_image_tags }}
      image_tags: ${{ steps.gitversion.outputs.image_tags }}
      version: ${{ steps.gitversion.outputs.version }}
      is_alpha: ${{ steps.gitversion.outputs.is_alpha }}
      git_version_major_minor_patch: ${{ steps.gitversion.outputs.git_version_major_minor_patch }}
      git_version_semver: ${{ steps.gitversion.outputs.git_version_semver }}
    steps:
      - name: Determine package version and container image tag
        id: gitversion
        uses: hwinther/reusable-workflows/.github/actions/gitversion@v2
        with:
          container_registry: ${{ inputs.container_registry }}
          container_image_name: ${{ inputs.container_image_name }}
          override_config: ${{ inputs.override_config }}
