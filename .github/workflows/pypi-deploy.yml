name: "Deploy package to PyPI (or test.pypi.org) via OIDC trusted publishing"

# Layer-1 PyPI publish reusable. Called from package-deploy.yml when the
# pypi ecosystem is enabled and changes are detected. The caller passes in
# a precomputed PEP 440 version string and the working directory of the
# package to build. No long-lived secrets — auth is OIDC trusted publishing
# (PEP 740) via pypa/gh-action-pypi-publish, which means the consumer must
# register a trusted publisher on PyPI / test.pypi.org for the
# (repo, workflow_filename, environment) tuple of the *caller* workflow
# (the workflow_ref in the OIDC claim is the entry workflow, not this
# reusable).
#
# The package's pyproject.toml is expected to source its version from the
# HATCH_VERSION env var (hatchling: [tool.hatch.version] source = "env",
# variable = "HATCH_VERSION"). Other backends with the same pattern work
# the same way as long as they read the same env var.

on:
  workflow_call:
    inputs:
      working-directory:
        required: true
        type: string
        description: "Directory containing the package's pyproject.toml."
      python_version:
        required: false
        type: string
        description: "Python version, e.g. '3.13'."
        default: "3.13"
      package_version:
        required: true
        type: string
        description: "PEP 440 package version to publish (e.g. '0.1.7' or '0.1.7.dev42'). Injected via HATCH_VERSION."
      is_alpha:
        required: false
        type: string
        description: "Informational only — included in the job summary. PEP 440 ordering already encodes prerelease semantics in the version string itself, so PyPI does not need a 'tag alpha' equivalent."
        default: 'false'
      repository_url:
        required: false
        type: string
        description: "Upload endpoint. Defaults to test.pypi.org. Set to 'https://upload.pypi.org/legacy/' for production PyPI."
        default: "https://test.pypi.org/legacy/"
      environment:
        required: true
        type: string
        description: "GitHub environment name. Must match the environment registered with the PyPI trusted publisher entry; OIDC won't authenticate otherwise."

jobs:
  deploy:
    name: "Deploy pypi ${{ inputs.package_version }}"
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
    env:
      HATCH_VERSION: ${{ inputs.package_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        name: Set up Python
        with:
          python-version: ${{ inputs.python_version }}
          cache: "pip"
          cache-dependency-path: ${{ format('{0}/pyproject.toml', inputs.working-directory) }}

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build sdist + wheel
        working-directory: ${{ inputs.working-directory }}
        run: python -m build --sdist --wheel

      - name: Twine check
        working-directory: ${{ inputs.working-directory }}
        run: twine check dist/*

      # TODO: pin pypa/gh-action-pypi-publish to a SHA. Currently tracking
      # release/v1 to match what test-pypi was using inline. The SHA pin
      # should land before the v1 release of these reusable workflows.
      - name: Publish to PyPI (OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ inputs.repository_url }}
          packages-dir: ${{ inputs.working-directory }}/dist/
          skip-existing: true

      - name: Summary
        if: always()
        working-directory: ${{ inputs.working-directory }}
        env:
          PKG_VERSION: ${{ inputs.package_version }}
          IS_ALPHA: ${{ inputs.is_alpha }}
          REPOSITORY_URL: ${{ inputs.repository_url }}
          ENV_NAME: ${{ inputs.environment }}
        run: |
          # Read distribution name from pyproject.toml for the summary URL.
          PKG_NAME=$(python -c "import tomllib; print(tomllib.loads(open('pyproject.toml','rb').read().decode())['project']['name'])" 2>/dev/null || echo "<unknown>")
          # Derive the project page from the upload endpoint.
          case "$REPOSITORY_URL" in
            *test.pypi.org*) PROJECT_BASE="https://test.pypi.org/project" ;;
            *)               PROJECT_BASE="https://pypi.org/project" ;;
          esac
          {
            echo "### PyPI publish"
            echo ""
            echo "- Package: \`${PKG_NAME}\`"
            echo "- Version: \`${PKG_VERSION}\`"
            echo "- Alpha: \`${IS_ALPHA}\`"
            echo "- Branch: \`${GITHUB_REF_NAME}\`"
            echo "- SHA: \`${GITHUB_SHA:0:7}\`"
            echo "- Environment: \`${ENV_NAME}\`"
            echo "- Repository: \`${REPOSITORY_URL}\`"
            echo "- URL: ${PROJECT_BASE}/${PKG_NAME}/${PKG_VERSION}/"
            echo ""
            echo "Install:"
            echo ""
            echo '```sh'
            if [ "${REPOSITORY_URL}" = "https://test.pypi.org/legacy/" ]; then
              echo "pip install --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ '${PKG_NAME}==${PKG_VERSION}'"
            else
              echo "pip install '${PKG_NAME}==${PKG_VERSION}'"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
