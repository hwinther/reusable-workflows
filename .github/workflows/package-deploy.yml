name: "Deploy package(s) across one or more ecosystems"

# Layer-2 kitchen-sink reusable workflow: computes a single shared package
# version once, optionally detects which ecosystems' files changed, and fans
# out to per-ecosystem layer-1 reusables (nuget-deploy, npm-deploy, ...) for
# the ones that are enabled and changed. All ecosystems publishing in the
# same run share the same version string.
#
# Triggers, branch checks, and label gating live in the consumer's caller
# workflow — this workflow assumes the caller has already decided "yes, run
# a publish."

on:
  workflow_call:
    inputs:
      is_alpha:
        description: "When 'true', package versions get a SemVer prerelease suffix (branch + short SHA)."
        required: false
        type: string
        default: 'false'

      # nuget --------------------------------------------------------------
      nuget_enabled:
        required: false
        type: boolean
        default: false
      nuget_solution_file:
        required: false
        type: string
        default: ''
      nuget_dotnet_version:
        required: false
        type: string
        default: '10.0.x'
      nuget_changes_regex:
        description: "Regex matched against changed file paths. Empty means 'always run when nuget_enabled'."
        required: false
        type: string
        default: ''
      nuget_tests_enabled:
        required: false
        type: boolean
        default: true
      nuget_package_source_name:
        required: false
        type: string
        default: 'github'
      nuget_version_path:
        description: "Optional path scope. Drives both version computation (only commits touching this path count toward the patch increment) and change-detection gating (publish only runs when this path has changes since the base). Empty (default) = all commits count, always run. Overridden by nuget_changes_regex when that input is set."
        required: false
        type: string
        default: ''
      nuget_package_source_url:
        description: "NuGet source URL passed through to nuget-deploy. Defaults to the calling repo owner's GitHub Packages feed (resolved inside nuget-deploy when empty)."
        required: false
        type: string
        default: ''

      # npm ----------------------------------------------------------------
      npm_enabled:
        required: false
        type: boolean
        default: false
      npm_working_directory:
        required: false
        type: string
        default: '.'
      npm_node_version:
        required: false
        type: string
        default: '24.x'
      npm_scope:
        required: false
        type: string
        default: ''
      npm_registry_url:
        description: "npm registry URL passed through to npm-deploy. Defaults to GitHub Packages."
        required: false
        type: string
        default: 'https://npm.pkg.github.com'
      npm_changes_regex:
        description: "Regex matched against changed file paths. Empty means 'always run when npm_enabled'."
        required: false
        type: string
        default: ''
      npm_version_path:
        description: "Optional path scope. Drives both version computation (only commits touching this path count toward the patch increment) and change-detection gating (publish only runs when this path has changes since the base). Empty (default) = all commits count, always run. Overridden by npm_changes_regex when that input is set."
        required: false
        type: string
        default: ''

      # pypi ---------------------------------------------------------------
      pypi_enabled:
        required: false
        type: boolean
        default: false
      pypi_working_directory:
        required: false
        type: string
        default: '.'
      pypi_python_version:
        required: false
        type: string
        default: '3.13'
      pypi_changes_regex:
        description: "Regex matched against changed file paths. Empty means 'always run when pypi_enabled'."
        required: false
        type: string
        default: ''
      pypi_version_path:
        description: "Optional path scope. Drives both version computation (only commits touching this path count toward the patch increment) and change-detection gating (publish only runs when this path has changes since the base). Empty (default) = all commits count, always run. Overridden by pypi_changes_regex when that input is set."
        required: false
        type: string
        default: ''
      pypi_repository_url:
        description: "PyPI upload endpoint passed through to pypi-deploy. Defaults to test.pypi.org. Set to 'https://upload.pypi.org/legacy/' for production PyPI."
        required: false
        type: string
        default: 'https://test.pypi.org/legacy/'
      pypi_environment:
        description: "GitHub environment name. Must match the environment registered with the PyPI trusted publisher. Required when pypi_enabled=true."
        required: false
        type: string
        default: ''
    secrets:
      packages_pat:
        description: "PAT with read:packages scope used by nuget-deploy for restoring private dependencies. Falls back to GITHUB_TOKEN inside nuget-deploy when unset."
        required: false
      npm_auth_token:
        description: "Auth token passed through to npm-deploy as NODE_AUTH_TOKEN. Falls back to GITHUB_TOKEN inside npm-deploy when unset."
        required: false
    outputs:
      nuget_version:
        description: "Computed nuget package version (empty when nuget_enabled=false)."
        value: ${{ jobs.detect-and-version.outputs.nuget_version }}
      npm_version:
        description: "Computed npm package version (empty when npm_enabled=false)."
        value: ${{ jobs.detect-and-version.outputs.npm_version }}
      pypi_version:
        description: "Computed pypi package version (PEP 440; empty when pypi_enabled=false)."
        value: ${{ jobs.detect-and-version.outputs.pypi_version }}
      nuget_published:
        description: "'true' if the nuget job ran (fanned out and not skipped)."
        value: ${{ jobs.nuget.result == 'success' }}
      npm_published:
        description: "'true' if the npm job ran (fanned out and not skipped)."
        value: ${{ jobs.npm.result == 'success' }}
      pypi_published:
        description: "'true' if the pypi job ran (fanned out and not skipped)."
        value: ${{ jobs.pypi.result == 'success' }}

jobs:
  detect-and-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      nuget_version: ${{ steps.nuget_pkgver.outputs.version }}
      nuget_informational_version: ${{ steps.nuget_pkgver.outputs.informational_version }}
      npm_version: ${{ steps.npm_pkgver.outputs.version }}
      npm_informational_version: ${{ steps.npm_pkgver.outputs.informational_version }}
      pypi_version: ${{ steps.pypi_pkgver.outputs.version }}
      pypi_informational_version: ${{ steps.pypi_pkgver.outputs.informational_version }}
      nuget_changed: ${{ steps.changes.outputs.nuget_changed }}
      npm_changed: ${{ steps.changes.outputs.npm_changed }}
      pypi_changed: ${{ steps.changes.outputs.pypi_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      # Compute version per ecosystem so different `*_version_path` inputs can
      # produce different versions. When both paths are empty (default), the
      # two composite invocations resolve to the same string.
      - name: Compute nuget version
        id: nuget_pkgver
        if: inputs.nuget_enabled
        uses: hwinther/reusable-workflows/.github/actions/package-version@v1
        with:
          is_alpha: ${{ inputs.is_alpha }}
          path: ${{ inputs.nuget_version_path }}

      - name: Compute npm version
        id: npm_pkgver
        if: inputs.npm_enabled
        uses: hwinther/reusable-workflows/.github/actions/package-version@v1
        with:
          is_alpha: ${{ inputs.is_alpha }}
          path: ${{ inputs.npm_version_path }}

      # Pinned to feat/python-support (this PR's ref): pypi requires the new
      # format=pep440 / run_number inputs which only exist on this ref of
      # package-version, not at @v1 yet. nuget/npm above keep @v1 because
      # they don't pass the new inputs. Flip to @v1 once the release is cut.
      # Relative './.github/actions/...' would break: when package-deploy.yml
      # is called from a different repo, GitHub resolves local-action paths
      # against the *caller's* checkout, not this repo.
      - name: Compute pypi version
        id: pypi_pkgver
        if: inputs.pypi_enabled
        uses: hwinther/reusable-workflows/.github/actions/package-version@feat/python-support
        with:
          is_alpha: ${{ inputs.is_alpha }}
          path: ${{ inputs.pypi_version_path }}
          format: pep440
          run_number: ${{ github.run_number }}

      - name: Validate pypi inputs
        if: inputs.pypi_enabled
        env:
          PYPI_ENVIRONMENT: ${{ inputs.pypi_environment }}
        run: |
          if [ -z "$PYPI_ENVIRONMENT" ]; then
            echo "::error::pypi_enabled=true requires pypi_environment to be set (must match the GitHub environment bound to the PyPI trusted publisher)."
            exit 1
          fi

      - name: Detect changes per ecosystem
        id: changes
        env:
          NUGET_ENABLED: ${{ inputs.nuget_enabled }}
          NPM_ENABLED: ${{ inputs.npm_enabled }}
          PYPI_ENABLED: ${{ inputs.pypi_enabled }}
          NUGET_REGEX: ${{ inputs.nuget_changes_regex }}
          NPM_REGEX: ${{ inputs.npm_changes_regex }}
          PYPI_REGEX: ${{ inputs.pypi_changes_regex }}
          NUGET_PATH: ${{ inputs.nuget_version_path }}
          NPM_PATH: ${{ inputs.npm_version_path }}
          PYPI_PATH: ${{ inputs.pypi_version_path }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          # Comparison base:
          #   pull_request → PR base sha (what the PR introduces).
          #   anything else (push to main, tag push, manual) → previous v[X.Y.Z] tag,
          #     i.e. "anything changed since the last published version." Aligns with
          #     package-version, which patches off that same tag — so a push that
          #     bumps the version implies at least one matching change here, and a
          #     push with no matching changes implies no version bump (publish skipped).
          #   No semver tag yet (first publish) → bootstrap; treat every enabled
          #     ecosystem as changed so the initial publish goes through.
          BOOTSTRAP=false
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE_REF="$PR_BASE_SHA"
          elif TAG=$(git describe --tags --abbrev=0 --match='v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null); then
            BASE_REF="$TAG"
          else
            BOOTSTRAP=true
            BASE_REF=""
          fi
          echo "Comparison base: ${BASE_REF:-<bootstrap: no semver tag yet>}"

          decide() {
            local name="$1"; local enabled="$2"; local regex="$3"; local path="$4"
            if [ "$enabled" != "true" ]; then
              echo "${name}_changed=false" >> "$GITHUB_OUTPUT"
              echo "${name}: disabled"
              return
            fi
            if [ "$BOOTSTRAP" = "true" ]; then
              echo "${name}_changed=true" >> "$GITHUB_OUTPUT"
              echo "${name}: bootstrap publish (no prior tag)"
              return
            fi
            if [ -n "$regex" ]; then
              pattern="$regex"
            elif [ -n "$path" ]; then
              pattern="^${path}/"
            else
              pattern=".*"
            fi
            if git diff --name-only "$BASE_REF"...HEAD | grep -qE "$pattern"; then
              echo "${name}_changed=true" >> "$GITHUB_OUTPUT"
              echo "${name}: changes detected matching ${pattern}"
            else
              echo "${name}_changed=false" >> "$GITHUB_OUTPUT"
              echo "${name}: no changes matching ${pattern}"
            fi
          }

          decide nuget "$NUGET_ENABLED" "$NUGET_REGEX" "$NUGET_PATH"
          decide npm "$NPM_ENABLED" "$NPM_REGEX" "$NPM_PATH"
          decide pypi "$PYPI_ENABLED" "$PYPI_REGEX" "$PYPI_PATH"

  nuget:
    needs: detect-and-version
    if: inputs.nuget_enabled && needs.detect-and-version.outputs.nuget_changed == 'true'
    permissions:
      contents: read
      packages: write
    uses: hwinther/reusable-workflows/.github/workflows/nuget-deploy.yml@v1
    secrets:
      packages_pat: ${{ secrets.packages_pat }}
    with:
      solution_file: ${{ inputs.nuget_solution_file }}
      dotnet_version: ${{ inputs.nuget_dotnet_version }}
      package_version: ${{ needs.detect-and-version.outputs.nuget_version }}
      informational_version: ${{ needs.detect-and-version.outputs.nuget_informational_version }}
      is_alpha: ${{ inputs.is_alpha }}
      tests_enabled: ${{ inputs.nuget_tests_enabled }}
      package_source_name: ${{ inputs.nuget_package_source_name }}
      package_source_url: ${{ inputs.nuget_package_source_url }}

  npm:
    needs: detect-and-version
    if: inputs.npm_enabled && needs.detect-and-version.outputs.npm_changed == 'true'
    permissions:
      contents: read
      packages: write
    uses: hwinther/reusable-workflows/.github/workflows/npm-deploy.yml@v1
    secrets:
      npm_auth_token: ${{ secrets.npm_auth_token }}
    with:
      working-directory: ${{ inputs.npm_working_directory }}
      node_version: ${{ inputs.npm_node_version }}
      scope: ${{ inputs.npm_scope }}
      npm_registry_url: ${{ inputs.npm_registry_url }}
      package_version: ${{ needs.detect-and-version.outputs.npm_version }}
      is_alpha: ${{ inputs.is_alpha }}

  # Pinned to feat/python-support (this PR's ref): pypi-deploy.yml is being
  # introduced in this same change set and isn't on the @v1 tag yet. Flip
  # to @v1 once the release is cut. Relative './.github/workflows/...'
  # doesn't work here: nested reusable workflow calls from another repo
  # require an absolute owner/repo/path@ref reference.
  pypi:
    needs: detect-and-version
    if: inputs.pypi_enabled && needs.detect-and-version.outputs.pypi_changed == 'true'
    permissions:
      id-token: write
      contents: read
    uses: hwinther/reusable-workflows/.github/workflows/pypi-deploy.yml@feat/python-support
    with:
      working-directory: ${{ inputs.pypi_working_directory }}
      python_version: ${{ inputs.pypi_python_version }}
      package_version: ${{ needs.detect-and-version.outputs.pypi_version }}
      is_alpha: ${{ inputs.is_alpha }}
      repository_url: ${{ inputs.pypi_repository_url }}
      environment: ${{ inputs.pypi_environment }}
