name: GitOps preview teardown

# Removes a per-PR preview overlay from a GitOps repo. Inverse of gitops-preview-upsert.yml.
# Designed to fire on `pull_request.closed` (merged or not) so cleanup is best-effort for all
# closed PRs without needing a label gate. Idempotent: if the overlay was never created (PR
# was never labelled) or was already removed, the workflow exits with no changes.

on:
  workflow_call:
    inputs:
      target_repo:
        required: true
        type: string
      target_ref:
        required: false
        type: string
        default: main
      preview_base_path:
        required: true
        type: string
      pr_number:
        required: true
        type: string
      app_name:
        required: false
        type: string
        default: ""
        description: "App label used in the GitOps commit message (e.g. clutterstock, ddnsadmin). Falls back to 'preview' when empty."
    secrets:
      app_id:
        required: true
      app_private_key:
        required: true

permissions: {}

jobs:
  teardown:
    runs-on: ubuntu-latest
    concurrency:
      group: gitops-teardown-${{ inputs.target_repo }}-${{ inputs.target_ref }}
      cancel-in-progress: false
    steps:
      - name: Parse target repo
        id: parse
        env:
          TARGET_REPO: ${{ inputs.target_repo }}
        run: |
          set -euo pipefail
          echo "owner=${TARGET_REPO%%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${TARGET_REPO##*/}"  >> "$GITHUB_OUTPUT"

      - name: Mint GitHub App installation token
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.app_id }}
          private-key: ${{ secrets.app_private_key }}
          owner: ${{ steps.parse.outputs.owner }}
          repositories: ${{ steps.parse.outputs.name }}
          # Scope the installation token to the minimum needed (checkout + git push to the
          # target repo). Without this the token inherits all of the App installation's
          # permissions — flagged by zizmor (dangerous use of GitHub App tokens).
          permission-contents: write

      - name: Checkout target GitOps repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.target_repo }}
          ref: ${{ inputs.target_ref }}
          token: ${{ steps.token.outputs.token }}
          path: target
          persist-credentials: true

      - name: Remove per-PR files and parent kustomization entries
        working-directory: target
        env:
          BASE: ${{ inputs.preview_base_path }}
          PR: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail

          # File system cleanup — idempotent.
          rm -rf "$BASE/pr-$PR"
          rm -f  "$BASE/databases/pr-$PR.yaml"

          # Parent kustomization edits — guard against absent files so a never-deployed PR no-ops.
          if [ -f "$BASE/kustomization.yaml" ]; then
            yq -i "del(.resources[] | select(. == \"pr-$PR\"))" "$BASE/kustomization.yaml"
          fi
          if [ -f "$BASE/databases/kustomization.yaml" ]; then
            yq -i "del(.resources[] | select(. == \"pr-$PR.yaml\"))" "$BASE/databases/kustomization.yaml"
          fi

      - name: Commit and push
        id: push
        working-directory: target
        env:
          PR: ${{ inputs.pr_number }}
          TARGET_REF: ${{ inputs.target_ref }}
          APP_NAME: ${{ inputs.app_name }}
        run: |
          set -euo pipefail
          git config user.name  "proxmox-gitops-bot[bot]"
          git config user.email "proxmox-gitops-bot[bot]@users.noreply.github.com"

          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to remove — preview was never deployed or already cleaned up."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git commit -m "preview(${APP_NAME:-preview}): teardown pr-$PR"

          n=0
          until git push origin "HEAD:$TARGET_REF"; do
            n=$((n+1))
            if [ "$n" -ge 3 ]; then
              echo "::error::Push failed after $n attempts"
              exit 1
            fi
            echo "Push rejected; rebasing and retrying ($n/3)"
            git pull --rebase --autostash origin "$TARGET_REF"
          done

      # Counterpart of the upsert reusable's run summary: makes the cleanup outcome visible straight
      # from the Actions UI without opening the job log.
      - name: Write run summary
        env:
          PR: ${{ inputs.pr_number }}
          APP_NAME: ${{ inputs.app_name }}
          TARGET_REPO: ${{ inputs.target_repo }}
          BASE: ${{ inputs.preview_base_path }}
          CHANGED: ${{ steps.push.outputs.changed }}
        run: |
          set -euo pipefail
          {
            echo "### Preview teardown (${APP_NAME:-preview})"
            echo ""
            if [ "$CHANGED" = "true" ]; then
              echo "Removed overlay \`$BASE/pr-$PR\` from \`$TARGET_REPO\` — Flux prunes the preview namespace within ~1 min."
            else
              echo "Nothing to remove for \`pr-$PR\` — the preview was never deployed or is already cleaned up."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
