# Build and lint in PR - supports node, dotnet, python and go

# Node expects a package lock from npm and the following scripts: typecheck (tsc), lint:ci (eslint -f json), build (npm run build), coverage:ci (test and generate coverage report)

# Dotnet expects a solution file (sln/slnx) and: build (dotnet build)

# On push and schedule (e.g. every push to main, for quality-artifact.yml) every enabled language
# builds and tests: there is no PR base to diff against. Pull requests, merge groups and manual runs
# still build only the languages with changes against main.

# Python expects a hatchling-style pyproject.toml in python_working_directory with a [project.optional-dependencies] dev group (ruff, mypy, pytest, pytest-cov, build). The action runs ruff check + ruff format --check + mypy + pytest + python -m build smoke.

# Go expects a go.mod in go_working_directory. The action runs gofmt -l + go vet + go build + go test (-race, JUnit via gotestsum, coverage as Cobertura).

name: "Build and lint in PR"

on:
  workflow_call:
    inputs:
      node_enabled:
        required: false
        type: boolean
        description: "Run node build and file change detection for frontend. Opt-in: callers must set this explicitly."
        default: false
      node_version:
        required: false
        type: string
        description: "Node version, e.g. 26.x"
        default: "26.x"
      node_working_directory:
        required: false
        type: string
        description: "Working directory for the build, the package.json and package-lock.json files are expected to be in this directory"
        default: ""
      node_changes_regex:
        required: false
        type: string
        description: "Regex for files to check for changes"
        default: ""
      npm_scope:
        required: false
        type: string
        description: "Package scope, e.g. '@org'"
        default: ''
      npm_registry_url:
        required: false
        type: string
        description: "npm registry URL for actions/setup-node. Defaults to GitHub Packages."
        default: "https://npm.pkg.github.com"
      node_extra_command:
        required: false
        type: string
        description: "Extra command to run after node build"
        default: ""
      node_test_enabled:
        required: false
        type: boolean
        description: "Run tests and generate coverage report"
        default: true
      dotnet_enabled:
        required: false
        type: boolean
        description: "Run dotnet build and file change detection for backend. Opt-in: callers must set this explicitly."
        default: false
      dotnet_version:
        required: false
        type: string
        description: ".NET version, e.g. 10.0.x"
        default: "10.0.x"
      dotnet_working_directory:
        required: false
        type: string
        description: Working directory for the build, the solution file is expected to be in this directory"
        default: ""
      dotnet_solution_file:
        required: false
        type: string
        description: "Solution file to build, e.g. ProjectName.slnx, relative to dotnet_source_path"
      dotnet_changes_regex:
        required: false
        type: string
        description: "Regex for files to check for changes"
        default: ""
      dotnet_primary_nuget_source:
        required: false
        type: string
        description: "Primary NuGet source URL passed to actions/setup-dotnet via source-url."
        default: ""
      dotnet_extra_nuget_source:
        required: false
        type: string
        description: "Extra NuGet source for private packages, e.g. https://pkgs.dev.azure.com/org/collection/_packaging/feed/nuget/v3/index.json"
        default: ""
      dotnet_extra_nuget_source_name:
        required: false
        type: string
        description: "Name of the extra NuGet source, e.g. 'feed'"
        default: ""
      dotnet_extra_nuget_source_username:
        required: false
        type: string
        description: "Username for `dotnet nuget add source` on the extra source. GitHub Packages and Azure Artifacts both accept any non-empty value alongside a PAT."
        default: "az"
      dotnet_extra_command:
        required: false
        type: string
        description: "Extra command to run after dotnet build"
        default: ""
      dotnet_test_enabled:
        required: false
        type: boolean
        description: "Run tests and generate coverage report"
        default: true
      dotnet_inspect_code_enabled:
        required: false
        type: boolean
        description: "Run jetbrains inspect code"
        default: true
      python_enabled:
        required: false
        type: boolean
        description: "Run python build and file change detection. Opt-in: callers must set this explicitly."
        default: false
      python_version:
        required: false
        type: string
        description: "Python version, e.g. 3.13"
        default: "3.13"
      python_working_directory:
        required: false
        type: string
        description: "Working directory for the python build. The pyproject.toml is expected to be in this directory."
        default: ""
      python_changes_regex:
        required: false
        type: string
        description: "Regex for files to check for changes. When unset, derived from python_working_directory plus python_local_path_dependencies (so a same-repo dep change triggers a rebuild)."
        default: ""
      python_local_path_dependencies:
        required: false
        type: string
        description: "Newline-separated repo-relative paths to install editable before the package itself. Use when this package depends on a sibling package in the same repo (e.g. client → contracts)."
        default: ""
      python_extra_command:
        required: false
        type: string
        description: "Extra command to run after install, before lint/test"
        default: ""
      python_test_enabled:
        required: false
        type: boolean
        description: "Run pytest with coverage"
        default: true
      python_typecheck_enabled:
        required: false
        type: boolean
        description: "Run mypy. Disable for projects without type stubs for their framework (e.g. Django without django-stubs)."
        default: true
      python_coverage_source:
        required: false
        type: string
        description: "Space-separated import names for pytest --cov. Default: [project].name from pyproject.toml; set it when the code spans several top-level packages (a Django project's apps)."
        default: ""
      go_enabled:
        required: false
        type: boolean
        description: "Run the go build (gofmt, go vet, go build, go test) and file change detection. Opt-in: callers must set this explicitly."
        default: false
      go_version:
        required: false
        type: string
        description: "Go version, e.g. 1.27 or stable. Default: the go (or toolchain) directive of go.mod in go_working_directory."
        default: ""
      go_working_directory:
        required: false
        type: string
        description: "Working directory for the go build. The go.mod is expected to be in this directory."
        default: ""
      go_changes_regex:
        required: false
        type: string
        description: "Regex for files to check for changes. When unset, derived from go_working_directory (everything when that is empty too)."
        default: ""
      go_extra_command:
        required: false
        type: string
        description: "Extra command to run after go mod download, before the checks (e.g. go generate ./...)"
        default: ""
      go_test_enabled:
        required: false
        type: boolean
        description: "Run go test with a JUnit report (gotestsum) and coverage"
        default: true
      go_race_enabled:
        required: false
        type: boolean
        description: "Run go test with -race"
        default: true
      runs_on:
        required: false
        type: string
        description: "Runner label for every job, e.g. `self-hosted` to keep a private repo's runs off the GitHub-hosted minutes quota. The runner needs bash, git and the network access the setup-* actions use."
        default: "ubuntu-latest"
      todo_comment_enabled:
        required: false
        type: boolean
        description: "Create TODO PR comment"
        default: true
      coverage_thresholds:
        required: false
        type: string
        description: 'Colours of the line coverage in the PR report, "red green": below red is 🔴, below green 🟡, else 🟢.'
        default: "40 80"
      pr_report_enabled:
        required: false
        type: boolean
        description: >-
          Add each build (and the gate's "no relevant changes") to the combined PR report rendered by
          pr-report.yml, instead of posting a comment per build. Needs a pr-report.yml caller in the repo.
        default: false
    secrets:
      npm_auth_token:
        description: "Auth token for the npm registry (passed to node-build as NODE_AUTH_TOKEN). When unset, falls back to GITHUB_TOKEN — the GitHub Packages flow."
        required: false
      nuget_auth_token:
        description: "Auth token for NuGet feeds (used as NUGET_AUTH_TOKEN and as the password for the extra-source `dotnet nuget add source` call). When unset, falls back to GITHUB_TOKEN."
        required: false

# Cancel superseded PR runs. Note: this only scopes the inner reusable-workflow runs;
# consumers should also set `concurrency:` on their caller workflow for cancellation
# to take effect at their level.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  detect-changes:
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 5
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    permissions:
      contents: read
    outputs:
      node_changes: ${{ steps.node-check.outputs.changes_detected || 'false' }}
      dotnet_changes: ${{ steps.dotnet-check.outputs.changes_detected || 'false' }}
      python_changes: ${{ steps.python-check.outputs.changes_detected || 'false' }}
      go_changes: ${{ steps.go-check.outputs.changes_detected || 'false' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set comparison base
        id: set-base
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          if [ "$EVENT_NAME" == "push" ] || [ "$EVENT_NAME" == "schedule" ]; then
            echo "base_ref=" >> "$GITHUB_OUTPUT"
            echo "Push or schedule: building every enabled language"
          elif [ "$EVENT_NAME" == "pull_request" ]; then
            echo "base_ref=$PR_BASE_SHA" >> "$GITHUB_OUTPUT"
            echo "Comparing with PR base branch ($PR_BASE_REF): $PR_BASE_SHA"
          else
            git fetch origin main
            echo "base_ref=origin/main" >> $GITHUB_OUTPUT
            echo "Comparing with main branch"
          fi

      - name: Check for frontend changes
        id: node-check
        if: inputs.node_enabled
        env:
          SOURCE_PATH: ${{ inputs.node_working_directory }}
          REGEX: ${{ inputs.node_changes_regex }}
          BASE_REF: ${{ steps.set-base.outputs.base_ref }}
          LABEL: "Frontend (node)"
        run: |
          set -euo pipefail
          if [ -n "$REGEX" ]; then
            PATTERN="$REGEX"
          elif [ -n "$SOURCE_PATH" ]; then
            PATTERN="^${SOURCE_PATH}/"
          else
            PATTERN=".*"
          fi

          echo "Using regex pattern: $PATTERN"
          echo "Files to check against:"
          [ -z "$BASE_REF" ] || git diff --name-only "$BASE_REF"...HEAD

          {
            echo "## 🔍 ${LABEL} change check"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -z "$BASE_REF" ] || git diff --name-only "$BASE_REF"...HEAD | grep -qE "$PATTERN"; then
            echo "changes_detected=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected in pattern."
            echo "✅ Changes detected matching pattern \`${PATTERN}\`." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changes_detected=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected in pattern."
            echo "⏭️ No changes detected matching pattern \`${PATTERN}\`." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check for backend changes
        id: dotnet-check
        if: inputs.dotnet_enabled
        env:
          SOURCE_PATH: ${{ inputs.dotnet_working_directory }}
          REGEX: ${{ inputs.dotnet_changes_regex }}
          BASE_REF: ${{ steps.set-base.outputs.base_ref }}
          LABEL: "Backend (dotnet)"
        run: |
          set -euo pipefail
          if [ -n "$REGEX" ]; then
            PATTERN="$REGEX"
          elif [ -n "$SOURCE_PATH" ]; then
            PATTERN="^${SOURCE_PATH}/"
          else
            PATTERN=".*"
          fi

          echo "Using regex pattern: $PATTERN"
          echo "Files to check against:"
          [ -z "$BASE_REF" ] || git diff --name-only "$BASE_REF"...HEAD

          {
            echo "## 🔍 ${LABEL} change check"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -z "$BASE_REF" ] || git diff --name-only "$BASE_REF"...HEAD | grep -qE "$PATTERN"; then
            echo "changes_detected=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected in pattern."
            echo "✅ Changes detected matching pattern \`${PATTERN}\`." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changes_detected=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected in pattern."
            echo "⏭️ No changes detected matching pattern \`${PATTERN}\`." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check for python changes
        id: python-check
        if: inputs.python_enabled
        env:
          SOURCE_PATH: ${{ inputs.python_working_directory }}
          REGEX: ${{ inputs.python_changes_regex }}
          LOCAL_DEPS: ${{ inputs.python_local_path_dependencies }}
          BASE_REF: ${{ steps.set-base.outputs.base_ref }}
          LABEL: "Python"
        run: |
          set -euo pipefail
          if [ -n "$REGEX" ]; then
            PATTERN="$REGEX"
          else
            # Build "^(p1|p2|...)/" from working_directory plus each local_path_dependencies
            # entry, so a change in a same-repo sibling dep triggers a rebuild.
            paths=()
            [ -n "$SOURCE_PATH" ] && paths+=("$SOURCE_PATH")
            while IFS= read -r line; do
              dep=$(echo "$line" | tr -d '[:space:]')
              [ -n "$dep" ] && paths+=("$dep")
            done <<< "$LOCAL_DEPS"
            if [ ${#paths[@]} -eq 0 ]; then
              PATTERN=".*"
            elif [ ${#paths[@]} -eq 1 ]; then
              PATTERN="^${paths[0]}/"
            else
              joined=$(IFS='|'; echo "${paths[*]}")
              PATTERN="^(${joined})/"
            fi
          fi

          echo "Using regex pattern: $PATTERN"
          echo "Files to check against:"
          [ -z "$BASE_REF" ] || git diff --name-only "$BASE_REF"...HEAD

          {
            echo "## 🔍 ${LABEL} change check"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -z "$BASE_REF" ] || git diff --name-only "$BASE_REF"...HEAD | grep -qE "$PATTERN"; then
            echo "changes_detected=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected in pattern."
            echo "✅ Changes detected matching pattern \`${PATTERN}\`." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changes_detected=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected in pattern."
            echo "⏭️ No changes detected matching pattern \`${PATTERN}\`." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check for go changes
        id: go-check
        if: inputs.go_enabled
        env:
          SOURCE_PATH: ${{ inputs.go_working_directory }}
          REGEX: ${{ inputs.go_changes_regex }}
          BASE_REF: ${{ steps.set-base.outputs.base_ref }}
          LABEL: "Go"
        run: |
          set -euo pipefail
          if [ -n "$REGEX" ]; then
            PATTERN="$REGEX"
          elif [ -n "$SOURCE_PATH" ]; then
            PATTERN="^${SOURCE_PATH}/"
          else
            PATTERN=".*"
          fi

          echo "Using regex pattern: $PATTERN"
          echo "Files to check against:"
          [ -z "$BASE_REF" ] || git diff --name-only "$BASE_REF"...HEAD

          {
            echo "## 🔍 ${LABEL} change check"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -z "$BASE_REF" ] || git diff --name-only "$BASE_REF"...HEAD | grep -qE "$PATTERN"; then
            echo "changes_detected=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected in pattern."
            echo "✅ Changes detected matching pattern \`${PATTERN}\`." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changes_detected=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected in pattern."
            echo "⏭️ No changes detected matching pattern \`${PATTERN}\`." >> "$GITHUB_STEP_SUMMARY"
          fi

  node-build:
    needs: detect-changes
    if: needs.detect-changes.outputs.node_changes == 'true'
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
      pull-requests: write
      checks: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build node
        id: node-build
        uses: hwinther/reusable-workflows/.github/actions/node-build@v2.46.0
        with:
          coverage_thresholds: ${{ inputs.coverage_thresholds }}
          node_version: ${{ inputs.node_version }}
          working_directory: ${{ inputs.node_working_directory }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          npm_registry_url: ${{ inputs.npm_registry_url }}
          npm_auth_token: ${{ secrets.npm_auth_token }}
          npm_scope: ${{ inputs.npm_scope }}
          extra_command: ${{ inputs.node_extra_command }}
          test: ${{ inputs.node_test_enabled }}

      - name: "Add the node build to the PR report"
        if: always() && github.event_name == 'pull_request' && inputs.pr_report_enabled
        uses: hwinther/reusable-workflows/.github/actions/pr-report-section@v2.46.0
        with:
          id: build-node-${{ inputs.node_working_directory }}
          title: Build · Node${{ inputs.node_working_directory != '' && format(' ({0})', inputs.node_working_directory) || '' }}
          # The build's own view adds warning (warnings only) to the step outcome.
          status: ${{ steps.node-build.outcome == 'success' && steps.node-build.outputs.status == 'warning' && 'warning' || steps.node-build.outcome }}
          summary: ${{ steps.node-build.outputs.summary }}
          content: ${{ steps.node-build.outputs.pr-comment || 'The build job stopped before it could write a report (a setup step failed, or the job timed out or was cancelled); see its run.' }}
          order: "10"

      - name: "Create or update PR comment for node"
        uses: hwinther/reusable-workflows/.github/actions/_sticky-pr-comment@v2.46.0
        if: always() && github.event_name == 'pull_request' && !inputs.pr_report_enabled
        # The result is in the job summary too; a comment that can't be posted (read-only token on a
        # fork PR, API error) must not fail a build that passed.
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          comment_identifier: "build-results-node"
          comment_content: ${{ steps.node-build.outputs.pr-comment }}
          # Empty when the build step never produced a report (setup failed, timeout, cancel).
          fallback_content: |
            ## ❌ No Node build report

            The build job stopped before it could write one: a setup step failed, or the job timed out or was cancelled. See the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).

  dotnet-build:
    needs: detect-changes
    if: needs.detect-changes.outputs.dotnet_changes == 'true'
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read
      pull-requests: write
      checks: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build dotnet
        id: dotnet-build
        uses: hwinther/reusable-workflows/.github/actions/dotnet-build@v2.46.0
        with:
          coverage_thresholds: ${{ inputs.coverage_thresholds }}
          dotnet_version: ${{ inputs.dotnet_version }}
          working_directory: ${{ inputs.dotnet_working_directory }}
          solution_file: ${{ inputs.dotnet_solution_file }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          nuget_auth_token: ${{ secrets.nuget_auth_token }}
          primary_nuget_source: ${{ inputs.dotnet_primary_nuget_source }}
          extra_nuget_source: ${{ inputs.dotnet_extra_nuget_source }}
          extra_nuget_source_name: ${{ inputs.dotnet_extra_nuget_source_name }}
          extra_nuget_source_username: ${{ inputs.dotnet_extra_nuget_source_username }}
          extra_command: ${{ inputs.dotnet_extra_command }}
          test: ${{ inputs.dotnet_test_enabled }}

      - name: "Add the dotnet build to the PR report"
        if: always() && github.event_name == 'pull_request' && inputs.pr_report_enabled
        uses: hwinther/reusable-workflows/.github/actions/pr-report-section@v2.46.0
        with:
          id: build-dotnet-${{ inputs.dotnet_solution_file }}
          title: Build · .NET${{ inputs.dotnet_solution_file != '' && format(' ({0})', inputs.dotnet_solution_file) || '' }}
          # The build's own view adds warning (warnings only) to the step outcome.
          status: ${{ steps.dotnet-build.outcome == 'success' && steps.dotnet-build.outputs.status == 'warning' && 'warning' || steps.dotnet-build.outcome }}
          summary: ${{ steps.dotnet-build.outputs.summary }}
          content: ${{ steps.dotnet-build.outputs.pr-comment || 'The build job stopped before it could write a report (a setup step failed, or the job timed out or was cancelled); see its run.' }}
          order: "10"

      - name: "Create or update PR comment for dotnet"
        uses: hwinther/reusable-workflows/.github/actions/_sticky-pr-comment@v2.46.0
        if: always() && github.event_name == 'pull_request' && !inputs.pr_report_enabled
        # The result is in the job summary too; a comment that can't be posted (read-only token on a
        # fork PR, API error) must not fail a build that passed.
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          comment_identifier: "build-results-dotnet"
          comment_content: ${{ steps.dotnet-build.outputs.pr-comment }}
          # Empty when the build step never produced a report (setup failed, timeout, cancel).
          fallback_content: |
            ## ❌ No Dotnet build report

            The build job stopped before it could write one: a setup step failed, or the job timed out or was cancelled. See the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).

  python-build:
    needs: detect-changes
    if: needs.detect-changes.outputs.python_changes == 'true'
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build python
        id: python-build
        uses: hwinther/reusable-workflows/.github/actions/python-build@v2.46.0
        with:
          python_version: ${{ inputs.python_version }}
          working_directory: ${{ inputs.python_working_directory }}
          local_path_dependencies: ${{ inputs.python_local_path_dependencies }}
          extra_command: ${{ inputs.python_extra_command }}
          test: ${{ inputs.python_test_enabled }}
          typecheck: ${{ inputs.python_typecheck_enabled }}
          coverage_source: ${{ inputs.python_coverage_source }}

      - name: "Add the python build to the PR report"
        if: always() && github.event_name == 'pull_request' && inputs.pr_report_enabled
        uses: hwinther/reusable-workflows/.github/actions/pr-report-section@v2.46.0
        with:
          id: build-python-${{ inputs.python_working_directory }}
          title: Build · Python${{ inputs.python_working_directory != '' && format(' ({0})', inputs.python_working_directory) || '' }}
          status: ${{ steps.python-build.outcome }}
          content: ${{ steps.python-build.outputs.pr-comment || 'The build job stopped before it could write a report (a setup step failed, or the job timed out or was cancelled); see its run.' }}
          order: "10"

      - name: "Create or update PR comment for python"
        uses: hwinther/reusable-workflows/.github/actions/_sticky-pr-comment@v2.46.0
        if: always() && github.event_name == 'pull_request' && !inputs.pr_report_enabled
        # The result is in the job summary too; a comment that can't be posted (read-only token on a
        # fork PR, API error) must not fail a build that passed.
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          comment_identifier: "build-results-python"
          comment_content: ${{ steps.python-build.outputs.pr-comment }}
          # Empty when the build step never produced a report (setup failed, timeout, cancel).
          fallback_content: |
            ## ❌ No Python build report

            The build job stopped before it could write one: a setup step failed, or the job timed out or was cancelled. See the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).

  go-build:
    needs: detect-changes
    if: needs.detect-changes.outputs.go_changes == 'true'
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build go
        id: go-build
        uses: hwinther/reusable-workflows/.github/actions/go-build@v2.46.0
        with:
          go_version: ${{ inputs.go_version }}
          working_directory: ${{ inputs.go_working_directory }}
          extra_command: ${{ inputs.go_extra_command }}
          test: ${{ inputs.go_test_enabled }}
          race: ${{ inputs.go_race_enabled }}

      - name: "Add the go build to the PR report"
        if: always() && github.event_name == 'pull_request' && inputs.pr_report_enabled
        uses: hwinther/reusable-workflows/.github/actions/pr-report-section@v2.46.0
        with:
          id: build-go-${{ inputs.go_working_directory }}
          title: Build · Go${{ inputs.go_working_directory != '' && format(' ({0})', inputs.go_working_directory) || '' }}
          status: ${{ steps.go-build.outcome }}
          content: ${{ steps.go-build.outputs.pr-comment || 'The build job stopped before it could write a report (a setup step failed, or the job timed out or was cancelled); see its run.' }}
          order: "10"

      - name: "Create or update PR comment for go"
        uses: hwinther/reusable-workflows/.github/actions/_sticky-pr-comment@v2.46.0
        if: always() && github.event_name == 'pull_request' && !inputs.pr_report_enabled
        # The result is in the job summary too; a comment that can't be posted (read-only token on a
        # fork PR, API error) must not fail a build that passed.
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          comment_identifier: "build-results-go"
          comment_content: ${{ steps.go-build.outputs.pr-comment }}
          # Empty when the build step never produced a report (setup failed, timeout, cancel).
          fallback_content: |
            ## ❌ No Go build report

            The build job stopped before it could write one: a setup step failed, or the job timed out or was cancelled. See the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).

  pr-build:
    needs: [detect-changes, node-build, dotnet-build, python-build, go-build]
    if: always()
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Write change check status to summary
        env:
          DETECT_RESULT: ${{ needs.detect-changes.result }}
          IS_DRAFT: ${{ github.event.pull_request.draft == true }}
        run: |
          echo "## Change checks" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "$DETECT_RESULT" != "success" ]; then
            echo "Change detection: **${DETECT_RESULT}**$( [ "$IS_DRAFT" = "true" ] && echo " (draft PR)")" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          echo "| Check | Changes detected | Build result |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|------------------|--------------|" >> $GITHUB_STEP_SUMMARY
          NODE_RESULT="${{ needs.node-build.result }}"
          DOTNET_RESULT="${{ needs.dotnet-build.result }}"
          PYTHON_RESULT="${{ needs.python-build.result }}"
          GO_RESULT="${{ needs.go-build.result }}"
          # Derive "changes detected" from whether the build ran (outputs can be empty when jobs are skipped + always())
          if [ "$NODE_RESULT" = "skipped" ]; then
            NODE_STATUS="No"
            NODE_BUILD="— (skipped)"
          else
            NODE_STATUS="✅ Yes"
            if [ "$NODE_RESULT" = "success" ]; then
              NODE_BUILD="✅ Success"
            else
              NODE_BUILD="❌ $NODE_RESULT"
            fi
          fi

          if [ "$DOTNET_RESULT" = "skipped" ]; then
            DOTNET_STATUS="No"
            DOTNET_BUILD="— (skipped)"
          else
            DOTNET_STATUS="✅ Yes"
            if [ "$DOTNET_RESULT" = "success" ]; then
              DOTNET_BUILD="✅ Success"
            else
              DOTNET_BUILD="❌ $DOTNET_RESULT"
            fi
          fi

          if [ "$PYTHON_RESULT" = "skipped" ]; then
            PYTHON_STATUS="No"
            PYTHON_BUILD="— (skipped)"
          else
            PYTHON_STATUS="✅ Yes"
            if [ "$PYTHON_RESULT" = "success" ]; then
              PYTHON_BUILD="✅ Success"
            else
              PYTHON_BUILD="❌ $PYTHON_RESULT"
            fi
          fi
          if [ "$GO_RESULT" = "skipped" ]; then
            GO_STATUS="No"
            GO_BUILD="— (skipped)"
          else
            GO_STATUS="✅ Yes"
            if [ "$GO_RESULT" = "success" ]; then
              GO_BUILD="✅ Success"
            else
              GO_BUILD="❌ $GO_RESULT"
            fi
          fi
          echo "| Node (frontend) | $NODE_STATUS | $NODE_BUILD |" >> $GITHUB_STEP_SUMMARY
          echo "| Dotnet (backend) | $DOTNET_STATUS | $DOTNET_BUILD |" >> $GITHUB_STEP_SUMMARY
          echo "| Python | $PYTHON_STATUS | $PYTHON_BUILD |" >> $GITHUB_STEP_SUMMARY
          echo "| Go | $GO_STATUS | $GO_BUILD |" >> $GITHUB_STEP_SUMMARY

      - name: Check build status
        env:
          DETECT_RESULT: ${{ needs.detect-changes.result }}
          IS_DRAFT: ${{ github.event.pull_request.draft == true }}
        run: |
          # Every build is skipped when change detection didn't run, so check it first: a failed
          # detect-changes used to read as "no relevant changes" and pass.
          if [ "$DETECT_RESULT" = "skipped" ] && [ "$IS_DRAFT" = "true" ]; then
            echo "Draft PR: builds are skipped until it is marked ready for review."
            exit 0
          fi
          if [ "$DETECT_RESULT" != "success" ]; then
            echo "❌ Change detection did not succeed (${DETECT_RESULT}), so no build ran."
            exit 1
          fi

          NODE_RESULT="${{ needs.node-build.result }}"
          DOTNET_RESULT="${{ needs.dotnet-build.result }}"
          PYTHON_RESULT="${{ needs.python-build.result }}"
          GO_RESULT="${{ needs.go-build.result }}"

          if [ "$NODE_RESULT" = "skipped" ] && [ "$DOTNET_RESULT" = "skipped" ] && [ "$PYTHON_RESULT" = "skipped" ] && [ "$GO_RESULT" = "skipped" ]; then
            echo "✅ No relevant changes found for build or lint."
            exit 0
          fi

          FAILED=0
          if [ "$NODE_RESULT" != "skipped" ] && [ "$NODE_RESULT" != "success" ]; then
            echo "❌ Node build failed or did not run."
            FAILED=1
          fi
          if [ "$DOTNET_RESULT" != "skipped" ] && [ "$DOTNET_RESULT" != "success" ]; then
            echo "❌ Dotnet build failed or did not run."
            FAILED=1
          fi
          if [ "$PYTHON_RESULT" != "skipped" ] && [ "$PYTHON_RESULT" != "success" ]; then
            echo "❌ Python build failed or did not run."
            FAILED=1
          fi
          if [ "$GO_RESULT" != "skipped" ] && [ "$GO_RESULT" != "success" ]; then
            echo "❌ Go build failed or did not run."
            FAILED=1
          fi

          if [ $FAILED -eq 1 ]; then
            exit 1
          fi
          echo "✅ All relevant builds succeeded."
          exit 0

      # These run after "Check build status", which exits 1 when a build or change detection failed,
      # hence always().
      # One gate comment (build-results): "no relevant changes", or why nothing ran. Deleted when
      # builds ran, since their own comments say how they went.
      - name: "Create or update PR comment (no relevant changes)"
        uses: hwinther/reusable-workflows/.github/actions/_sticky-pr-comment@v2.46.0
        if: always() && github.event_name == 'pull_request' && !inputs.pr_report_enabled && needs.detect-changes.result == 'success' && needs.node-build.result == 'skipped' && needs.dotnet-build.result == 'skipped' && needs.python-build.result == 'skipped' && needs.go-build.result == 'skipped'
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          comment_identifier: "build-results"
          comment_content: "## ✅ No relevant changes found for build or lint."

      - name: "Create or update PR comment (change detection failed)"
        uses: hwinther/reusable-workflows/.github/actions/_sticky-pr-comment@v2.46.0
        if: always() && github.event_name == 'pull_request' && !inputs.pr_report_enabled && needs.detect-changes.result != 'success' && needs.detect-changes.result != 'skipped'
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          comment_identifier: "build-results"
          comment_content: |
            ## ❌ Change detection failed, so no build ran

            See the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).

      - name: "Remove a stale gate comment (builds ran)"
        uses: hwinther/reusable-workflows/.github/actions/_sticky-pr-comment@v2.46.0
        if: always() && github.event_name == 'pull_request' && !inputs.pr_report_enabled && needs.detect-changes.result == 'success' && (needs.node-build.result != 'skipped' || needs.dotnet-build.result != 'skipped' || needs.python-build.result != 'skipped' || needs.go-build.result != 'skipped')
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          comment_identifier: "build-results"
          comment_content: ""
          delete_when_empty: "true"

      # With the PR report: a section only when no build ran (each build adds its own).
      - name: "Describe the gate for the PR report"
        id: gate-report
        if: always() && github.event_name == 'pull_request' && inputs.pr_report_enabled
        env:
          DETECT_RESULT: ${{ needs.detect-changes.result }}
          IS_DRAFT: ${{ github.event.pull_request.draft == true }}
          ANY_BUILD: ${{ needs.node-build.result != 'skipped' || needs.dotnet-build.result != 'skipped' || needs.python-build.result != 'skipped' || needs.go-build.result != 'skipped' }}
        run: |
          if [ "$DETECT_RESULT" = "success" ] && [ "$ANY_BUILD" = "true" ]; then
            echo "add=false" >> "$GITHUB_OUTPUT"
          elif [ "$DETECT_RESULT" = "success" ]; then
            { echo "add=true"; echo "status=neutral"; echo "summary=no relevant changes"; echo "content=No relevant changes found for build or lint."; } >> "$GITHUB_OUTPUT"
          elif [ "$DETECT_RESULT" = "skipped" ] && [ "$IS_DRAFT" = "true" ]; then
            { echo "add=true"; echo "status=skipped"; echo "summary=draft PR"; echo "content=Builds are skipped until the PR is marked ready for review."; } >> "$GITHUB_OUTPUT"
          else
            { echo "add=true"; echo "status=failure"; echo "summary=change detection ${DETECT_RESULT}"; echo "content=Change detection did not succeed (${DETECT_RESULT}), so no build ran."; } >> "$GITHUB_OUTPUT"
          fi

      - name: "Add the gate to the PR report"
        if: always() && steps.gate-report.outputs.add == 'true'
        uses: hwinther/reusable-workflows/.github/actions/pr-report-section@v2.46.0
        with:
          id: build
          title: Build
          status: ${{ steps.gate-report.outputs.status }}
          summary: ${{ steps.gate-report.outputs.summary }}
          content: ${{ steps.gate-report.outputs.content }}
          order: "10"

  dotnet-inspect-code:
    needs: detect-changes
    if: inputs.dotnet_inspect_code_enabled && needs.detect-changes.outputs.dotnet_changes == 'true'
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Restore and build
        id: dotnet-restore-build
        uses: hwinther/reusable-workflows/.github/actions/dotnet-build@v2.46.0
        with:
          dotnet_version: ${{ inputs.dotnet_version }}
          working_directory: ${{ inputs.dotnet_working_directory }}
          solution_file: ${{ inputs.dotnet_solution_file }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          nuget_auth_token: ${{ secrets.nuget_auth_token }}
          primary_nuget_source: ${{ inputs.dotnet_primary_nuget_source }}
          extra_nuget_source: ${{ inputs.dotnet_extra_nuget_source }}
          extra_nuget_source_name: ${{ inputs.dotnet_extra_nuget_source_name }}
          extra_nuget_source_username: ${{ inputs.dotnet_extra_nuget_source_username }}
          test: "false"

      - name: Inspect code
        uses: muno92/resharper_inspectcode@85a18351e1a10fc526932099d29c2dc9ac87d422 # 1.17.9
        with:
          workingDirectory: ${{ inputs.dotnet_working_directory }}
          solutionPath: ${{ inputs.dotnet_solution_file }}
          dotnetVersion: ${{ inputs.dotnet_version }}
          solutionWideAnalysis: true
          minimumReportSeverity: warning
          failOnIssue: false
          minimumSeverity: error
          include: |
            **.cs
          ignoreIssueType: NotAccessedPositionalProperty.Global,RedundantNameQualifier

  todo-comments:
    needs: detect-changes
    if: inputs.todo_comment_enabled && (needs.detect-changes.outputs.dotnet_changes == 'true' || needs.detect-changes.outputs.node_changes == 'true' || needs.detect-changes.outputs.python_changes == 'true')
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create TODO comments
        uses: gkampitakis/github-action-todo-commenter@06c49183cf11bc8d6e78ace915dce20649cf1ce7 # v1.3.0
        if: github.event_name == 'pull_request'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          review-message: "Please take a look :eyes:"
          tags: "TODO:,FIXME:,BUG:"
