name: "Playwright E2E against locally-loaded container images or a deployed app"

# Reusable e2e workflow that downloads pre-built image artifacts (from
# build-and-scan-{docker,dotnet}.yml jobs in the same run), loads them into
# the local Docker daemon, runs Playwright via docker-compose against them,
# captures logs and reports, and posts a sticky PR comment with the result
# summary. The caller's docker-compose file references images via env vars
# (e.g. ${API_IMAGE}); this workflow sets those env vars to the loaded
# refs before `docker compose up`.
#
# Without compose_file it runs against a deployed app instead: base_url is exported as BASE_URL
# for the Playwright config, and wait_url (if set) is polled until it answers 200, so a caller can
# start the run right after a deploy.

on:
  workflow_call:
    inputs:
      compose_file:
        description: "Path to docker-compose file in the consumer repo (e.g. docker-compose.e2e.yml). Empty = no compose stack; set base_url to test a deployed app."
        required: false
        type: string
        default: ""
      base_url:
        description: "URL of a deployed app to test instead of a compose stack, exported as BASE_URL for the Playwright run (the caller's config reads it). Only used without compose_file."
        required: false
        type: string
        default: ""
      wait_url:
        description: "Polled until it answers 200 before Playwright starts, e.g. the deployed app's readiness URL. Empty = no wait."
        required: false
        type: string
        default: ""
      container_image:
        description: |
          Run the job in this image instead of on the runner, e.g. a Playwright image with the browsers
          baked in: the browser cache and install steps are skipped, so the image's browsers must match
          the @playwright/test version in package-lock.json. Pulled with the workflow token, so it must
          be in GHCR. No docker in the container, so only with base_url, not compose_file. Empty = the
          runner (default).
        required: false
        type: string
        default: ""
      compose_playwright_service:
        description: |
          Run the tests as this service of compose_file (`docker compose --profile <profile> run --rm
          <service>`), e.g. a Playwright image with the tests baked in, instead of with Node and
          browsers on the runner: the runner's Node, npm, browser and Playwright steps are skipped.
          The service passes through E2E_USERNAME/E2E_PASSWORD/E2E_OTP_SECRET, CI and any
          playwright_env vars it lists, and mounts its report directories into
          playwright_working_directory so the summary and the report upload find them.
        required: false
        type: string
        default: ""
      compose_playwright_profile:
        description: "Compose profile that enables compose_playwright_service (so a plain `up` doesn't start it)."
        required: false
        type: string
        default: e2e
      otel_traces_file:
        description: |
          OTLP/JSON trace file an OpenTelemetry collector in the compose stack writes during the run
          (its `file` exporter), relative to the repository root, e.g. e2e/otel-out/traces.jsonl.
          When set, the stack is stopped after the tests (so the app and the collector flush) and the
          API requests and SQL queries slower than slow_span_threshold_ms are reported in the job
          summary and the PR comment. Empty = no report.
        required: false
        type: string
        default: ""
      slow_span_threshold_ms:
        description: "Report API requests and SQL queries slower than this, in milliseconds (with otel_traces_file)."
        required: false
        type: number
        default: 2000
      slow_span_top:
        description: "How many of the slowest spans to list regardless of the threshold (with otel_traces_file)."
        required: false
        type: number
        default: 10
      wait_timeout_seconds:
        description: "How long to poll wait_url before failing (seconds)."
        required: false
        type: number
        default: 600
      playwright_working_directory:
        description: "Directory containing package.json / playwright config."
        required: false
        type: string
        default: "."
      node_version:
        description: "Node version, e.g. 26.x"
        required: false
        type: string
        default: "26.x"
      playwright_browsers:
        description: "Browsers to install for Playwright, e.g. 'chromium' or 'chromium firefox'."
        required: false
        type: string
        default: "chromium"
      playwright_cache_enabled:
        description: "Cache Playwright browser binaries under ~/.cache/ms-playwright, keyed by Playwright version (read from <playwright_working_directory>/package-lock.json) and the playwright_browsers list. Opt-in; saves ~20-40s per run on a warm cache."
        required: false
        type: boolean
        default: false
      node_modules_cache_enabled:
        description: "Cache <playwright_working_directory>/node_modules, keyed by runner OS/arch, the exact Node version, package-lock.json and playwright_install_command. On an exact hit the install step is skipped. Opt-in; needs package-lock.json in playwright_working_directory, so it does not suit npm workspaces that hoist to a parent directory."
        required: false
        type: boolean
        default: false
      playwright_install_command:
        description: "Command to install npm deps in playwright_working_directory."
        required: false
        type: string
        default: "npm ci"
      playwright_run_command:
        description: "Command to run Playwright in playwright_working_directory."
        required: false
        type: string
        default: "npx playwright test"
      playwright_setup_project:
        description: "Optional Playwright project name to run on its own immediately before the main run (e.g. 'setup') to seed auth/storage state against the started compose stack. Empty = skip. Receives the same E2E_* secrets and exported playwright_env vars as the main run."
        required: false
        type: string
        default: ""
      image_artifacts_json:
        description: |
          JSON object mapping docker-compose env var names to images. Each value is either a workflow
          artifact name from build-and-scan-{docker,dotnet}.yml (downloaded and `docker load`ed), or the
          `image` output of build-image-{docker,dotnet}.yml, which may be a registry ref
          (repo@sha256:...) that compose pulls by digest. The env var is set before `docker compose up`.
          Example: {"API_IMAGE":"build-and-scan-api-image","FRONTEND_IMAGE":"ghcr.io/o/r/frontend@sha256:..."}
          Only used with compose_file.
        required: false
        type: string
        default: "{}"
      report_paths_json:
        description: "JSON array of paths (relative to playwright_working_directory) to upload as the playwright-report artifact."
        required: false
        type: string
        default: '["playwright-report","test-results"]'
      coverage_paths_json:
        description: "JSON array of paths (relative to playwright_working_directory) to upload as the e2e-coverage artifact. Empty array = skip."
        required: false
        type: string
        default: '[]'
      comment_identifier:
        description: "Sticky PR comment identifier passed to im-open/update-pr-comment."
        required: false
        type: string
        default: "e2e-results"
      compose_up_timeout_seconds:
        description: "Timeout for `docker compose up --wait` (seconds)."
        required: false
        type: number
        default: 180
      pr_comment_enabled:
        description: "Post a PR comment with the Playwright summary on pull_request events."
        required: false
        type: boolean
        default: true
      playwright_env:
        description: "Extra environment variables for the Playwright run. Newline-separated KEY=VALUE pairs; each is exported into $GITHUB_ENV before 'Run Playwright' so the test command sees them. Caller resolves any secrets at its level (e.g. KEY=secrets.E2E_USERNAME via the standard expression syntax) before passing the value in. The runner masks known secret values in logs."
        required: false
        type: string
        default: ""
      results_json_path:
        description: "Path to Playwright JSON report (relative to playwright_working_directory). Used to build the PR comment."
        required: false
        type: string
        default: "playwright-report/results.json"
      artifact_retention_days:
        description: "Retention for the playwright-report and e2e-coverage artifacts."
        required: false
        type: number
        default: 14
      environment:
        description: "GitHub environment to associate with the e2e job (for environment-scoped secrets, approvals, or rules). Empty means no environment."
        required: false
        type: string
        default: ""
      npm_registry_url:
        description: "npm registry URL passed to actions/setup-node for the runner-side npm ci. Defaults to GitHub Packages."
        required: false
        type: string
        default: "https://npm.pkg.github.com"
      npm_scope:
        description: "Package scope (e.g. '@org') passed to actions/setup-node for the runner-side npm ci."
        required: false
        type: string
        default: ""
    secrets:
      e2e_username:
        description: "Username for the auth setup project (exported as E2E_USERNAME for the Playwright run)."
        required: false
      e2e_password:
        description: "Password for the auth setup project (exported as E2E_PASSWORD for the Playwright run)."
        required: false
      e2e_otp_secret:
        description: "TOTP shared secret for the auth setup project (exported as E2E_OTP_SECRET for the Playwright run)."
        required: false
      npm_auth_token:
        description: "Auth token written into ~/.npmrc as NODE_AUTH_TOKEN for the runner-side npm ci. When unset, falls back to GITHUB_TOKEN."
        required: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      packages: read
      pull-requests: write
      # `gh run download` (artifact fetch for image_artifacts_json) hits the Actions REST API,
      # which requires `actions: read` on the workflow token.
      actions: read
    # An empty image runs the job on the runner itself.
    container:
      image: ${{ inputs.container_image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR (for base-image and side-car pulls)
        if: ${{ inputs.container_image == '' }}
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        if: ${{ inputs.compose_playwright_service == '' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node_version }}
          cache: npm
          cache-dependency-path: ${{ inputs.playwright_working_directory != '' && format('{0}/package-lock.json', inputs.playwright_working_directory) || 'package-lock.json' }}
          registry-url: ${{ inputs.npm_registry_url }}
          scope: ${{ inputs.npm_scope }}

      # The npm download cache from setup-node still leaves `npm ci` to unpack and link the whole
      # tree (~45s for a typical frontend). Caching node_modules itself skips that. The exact Node
      # version is in the key because packages with native builds are tied to it.
      - name: node_modules cache key
        id: node-modules-key
        if: ${{ inputs.compose_playwright_service == '' && (inputs.node_modules_cache_enabled) }}
        shell: bash
        working-directory: ${{ inputs.playwright_working_directory }}
        env:
          INSTALL_CMD: ${{ inputs.playwright_install_command }}
          RUNNER_ARCH_NAME: ${{ runner.arch }}
        run: |
          set -euo pipefail
          if [ ! -f package-lock.json ]; then
            echo "::notice::No package-lock.json in ${PWD}; node_modules cache disabled."
            exit 0
          fi
          lock=$(sha256sum package-lock.json | cut -c1-16)
          cmd=$(printf '%s' "$INSTALL_CMD" | sha256sum | cut -c1-8)
          echo "key=${RUNNER_OS}-${RUNNER_ARCH_NAME}-node-modules-$(node -v)-${lock}-${cmd}" >> "$GITHUB_OUTPUT"
          echo "path=${PWD}/node_modules" >> "$GITHUB_OUTPUT"

      - name: Restore node_modules
        id: node-modules-cache
        if: ${{ inputs.compose_playwright_service == '' && (steps.node-modules-key.outputs.key != '') }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.node-modules-key.outputs.path }}
          key: ${{ steps.node-modules-key.outputs.key }}

      - name: Install npm dependencies
        if: ${{ inputs.compose_playwright_service == '' && (steps.node-modules-cache.outputs.cache-hit != 'true') }}
        shell: bash
        working-directory: ${{ inputs.playwright_working_directory }}
        env:
          INSTALL_CMD: ${{ inputs.playwright_install_command }}
          NODE_AUTH_TOKEN: ${{ secrets.npm_auth_token != '' && secrets.npm_auth_token || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          eval "$INSTALL_CMD"

      # Saved straight after the install, so a failing test run still leaves a warm cache.
      - name: Save node_modules
        if: ${{ inputs.compose_playwright_service == '' && (steps.node-modules-key.outputs.key != '' && steps.node-modules-cache.outputs.cache-hit != 'true') }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.node-modules-key.outputs.path }}
          key: ${{ steps.node-modules-key.outputs.key }}

      - name: Resolve Playwright version (for cache key)
        id: playwright-version
        if: ${{ inputs.compose_playwright_service == '' && (inputs.container_image == '' && inputs.playwright_cache_enabled) }}
        shell: bash
        working-directory: ${{ inputs.playwright_working_directory }}
        run: |
          set -euo pipefail
          version=$(node -e "console.log(require('./package-lock.json').packages['node_modules/@playwright/test'].version)")
          if [ -z "$version" ] || [ "$version" = "undefined" ]; then
            echo "::error::Could not resolve @playwright/test version from package-lock.json in ${PWD}."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Playwright version: $version"

      - name: Restore Playwright browsers cache
        id: playwright-cache
        if: ${{ inputs.compose_playwright_service == '' && (inputs.container_image == '' && inputs.playwright_cache_enabled) }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}-${{ inputs.playwright_browsers }}

      - name: Install Playwright browsers (with system deps)
        if: ${{ inputs.compose_playwright_service == '' && (inputs.container_image == '' && (!inputs.playwright_cache_enabled || steps.playwright-cache.outputs.cache-hit != 'true')) }}
        shell: bash
        working-directory: ${{ inputs.playwright_working_directory }}
        env:
          BROWSERS: ${{ inputs.playwright_browsers }}
          NODE_AUTH_TOKEN: ${{ secrets.npm_auth_token != '' && secrets.npm_auth_token || secrets.GITHUB_TOKEN }}
        run: npx playwright install --with-deps $BROWSERS

      - name: Install Playwright system deps only (cache hit)
        if: ${{ inputs.compose_playwright_service == '' && (inputs.container_image == '' && inputs.playwright_cache_enabled && steps.playwright-cache.outputs.cache-hit == 'true') }}
        shell: bash
        working-directory: ${{ inputs.playwright_working_directory }}
        env:
          BROWSERS: ${{ inputs.playwright_browsers }}
          NODE_AUTH_TOKEN: ${{ secrets.npm_auth_token != '' && secrets.npm_auth_token || secrets.GITHUB_TOKEN }}
        run: npx playwright install-deps $BROWSERS

      - name: Check the target
        shell: bash
        env:
          COMPOSE_FILE: ${{ inputs.compose_file }}
          BASE_URL_INPUT: ${{ inputs.base_url }}
          CONTAINER_IMAGE: ${{ inputs.container_image }}
          PLAYWRIGHT_SERVICE: ${{ inputs.compose_playwright_service }}
        run: |
          if [ -z "$COMPOSE_FILE" ] && [ -z "$BASE_URL_INPUT" ]; then
            echo "::error::Set compose_file (a local stack) or base_url (a deployed app)."
            exit 1
          fi
          if [ -n "$CONTAINER_IMAGE" ] && [ -n "$COMPOSE_FILE" ]; then
            echo "::error::container_image has no docker for a compose stack; use base_url."
            exit 1
          fi
          if [ -n "$PLAYWRIGHT_SERVICE" ] && [ -z "$COMPOSE_FILE" ]; then
            echo "::error::compose_playwright_service needs compose_file."
            exit 1
          fi

      - name: Resolve images (download artifacts, or use registry refs)
        if: ${{ inputs.compose_file != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_ARTIFACTS_JSON: ${{ inputs.image_artifacts_json }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          download_dir="${RUNNER_TEMP}/e2e-images"
          mkdir -p "$download_dir"
          # Iterate JSON entries: { "<ENV_VAR>": "<artifact_name or repo@sha256:...>", ... }
          while IFS=$'\t' read -r env_var artifact_name; do
            [ -z "$env_var" ] || [ -z "$artifact_name" ] && continue
            # A staging ref from build-image-*.yml: compose pulls it by digest.
            if [[ "$artifact_name" =~ ^[^[:space:]]+@sha256:[a-f0-9]{64}$ ]]; then
              echo "${env_var}=${artifact_name}" >> "$GITHUB_ENV"
              echo "Set ${env_var}=${artifact_name} (registry)"
              continue
            fi
            target="$download_dir/$artifact_name"
            mkdir -p "$target"
            echo "Downloading artifact $artifact_name -> $target"
            gh run download "$RUN_ID" --name "$artifact_name" --dir "$target"
            archive=$(find "$target" -maxdepth 2 -type f \( -name '*.tar.gz' -o -name '*.tar' \) | head -1)
            [ -n "$archive" ] || { echo "::error::No tar(.gz) found inside artifact $artifact_name"; ls -la "$target"; exit 1; }
            if [ "${archive##*.}" = "gz" ]; then
              loaded=$(gunzip -c "$archive" | docker load | sed -n 's/^Loaded image: //p' | head -1)
            else
              loaded=$(docker load -i "$archive" | sed -n 's/^Loaded image: //p' | head -1)
            fi
            [ -n "$loaded" ] || { echo "::error::docker load produced no image for $artifact_name"; exit 1; }
            echo "${env_var}=${loaded}" >> "$GITHUB_ENV"
            echo "Set ${env_var}=${loaded}"
          done < <(echo "$IMAGE_ARTIFACTS_JSON" | jq -r 'to_entries[] | "\(.key)\t\(.value)"')

      - name: Pull non-artifact compose images
        if: ${{ inputs.compose_file != '' }}
        shell: bash
        env:
          COMPOSE_FILE: ${{ inputs.compose_file }}
        run: |
          # Pull external services (postgres, redis, etc.); ignore failures for
          # services backed by locally-loaded images that aren't in the registry.
          docker compose -f "$COMPOSE_FILE" pull --ignore-pull-failures || true

      - name: Start compose stack
        if: ${{ inputs.compose_file != '' }}
        shell: bash
        env:
          COMPOSE_FILE: ${{ inputs.compose_file }}
          COMPOSE_TIMEOUT: ${{ inputs.compose_up_timeout_seconds }}
        run: |
          docker compose -f "$COMPOSE_FILE" up -d --wait --wait-timeout "$COMPOSE_TIMEOUT"

      - name: Point Playwright at the deployed app
        if: ${{ inputs.compose_file == '' }}
        shell: bash
        env:
          BASE_URL_INPUT: ${{ inputs.base_url }}
        run: echo "BASE_URL=${BASE_URL_INPUT}" >> "$GITHUB_ENV"

      - name: Wait for the app
        if: ${{ inputs.wait_url != '' }}
        shell: bash
        env:
          WAIT_URL: ${{ inputs.wait_url }}
          WAIT_TIMEOUT: ${{ inputs.wait_timeout_seconds }}
        run: |
          deadline=$(( $(date +%s) + WAIT_TIMEOUT ))
          while :; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$WAIT_URL" || true)
            if [ "$code" = "200" ]; then
              echo "$WAIT_URL answered 200."
              break
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::$WAIT_URL did not answer 200 within ${WAIT_TIMEOUT}s (last: $code)."
              exit 1
            fi
            echo "$WAIT_URL: $code, retrying in 10s"
            sleep 10
          done

      - name: Export extra Playwright env vars
        if: ${{ inputs.playwright_env != '' }}
        shell: bash
        env:
          EXTRA_ENV: ${{ inputs.playwright_env }}
        run: |
          set -euo pipefail
          # Parse newline-separated KEY=VALUE pairs and append each to $GITHUB_ENV
          # using the heredoc form so multiline values survive intact. Subsequent
          # steps (Run Playwright) inherit these as ordinary env vars.
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            case "$line" in
              \#*) continue ;;
              *=*) ;;
              *)
                echo "::warning::Skipping malformed playwright_env line (no '='): $line"
                continue
                ;;
            esac
            key="${line%%=*}"
            value="${line#*=}"
            # Trim leading/trailing whitespace from the key only; values are kept verbatim.
            key=$(printf '%s' "$key" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
            [ -z "$key" ] && continue
            delim="GHA_ENV_$(date +%s%N)_$$"
            {
              printf '%s<<%s\n' "$key" "$delim"
              printf '%s\n' "$value"
              printf '%s\n' "$delim"
            } >> "$GITHUB_ENV"
            echo "Exported $key (value masked if a registered secret)"
          done <<< "$EXTRA_ENV"

      - name: Seed Playwright auth state (setup project)
        if: ${{ inputs.compose_playwright_service == '' && (inputs.playwright_setup_project != '') }}
        shell: bash
        working-directory: ${{ inputs.playwright_working_directory }}
        env:
          CI: "true"
          SETUP_PROJECT: ${{ inputs.playwright_setup_project }}
          E2E_USERNAME: ${{ secrets.e2e_username }}
          E2E_PASSWORD: ${{ secrets.e2e_password }}
          E2E_OTP_SECRET: ${{ secrets.e2e_otp_secret }}
        run: |
          set -euo pipefail
          npx playwright test --project="$SETUP_PROJECT"

      - name: Run Playwright
        if: ${{ inputs.compose_playwright_service == '' }}
        shell: bash
        working-directory: ${{ inputs.playwright_working_directory }}
        env:
          CI: "true"
          RUN_CMD: ${{ inputs.playwright_run_command }}
          E2E_USERNAME: ${{ secrets.e2e_username }}
          E2E_PASSWORD: ${{ secrets.e2e_password }}
          E2E_OTP_SECRET: ${{ secrets.e2e_otp_secret }}
        run: |
          set -euo pipefail
          eval "$RUN_CMD"

      - name: Run Playwright (compose service)
        if: ${{ inputs.compose_playwright_service != '' }}
        shell: bash
        env:
          CI: "true"
          COMPOSE_FILE: ${{ inputs.compose_file }}
          PROFILE: ${{ inputs.compose_playwright_profile }}
          SERVICE: ${{ inputs.compose_playwright_service }}
          E2E_USERNAME: ${{ secrets.e2e_username }}
          E2E_PASSWORD: ${{ secrets.e2e_password }}
          E2E_OTP_SECRET: ${{ secrets.e2e_otp_secret }}
        run: docker compose -f "$COMPOSE_FILE" --profile "$PROFILE" run --rm "$SERVICE"
      # Stopping the stack ends the app first and the collector last (compose stops dependents
      # before their dependencies), so both flush their batches into the trace file.
      - name: Stop the compose stack (flush traces)
        if: ${{ always() && inputs.otel_traces_file != '' && inputs.compose_file != '' }}
        shell: bash
        env:
          COMPOSE_FILE: ${{ inputs.compose_file }}
        run: docker compose -f "$COMPOSE_FILE" stop

      - name: Slow spans report
        if: ${{ always() && inputs.otel_traces_file != '' }}
        uses: hwinther/reusable-workflows/.github/actions/otel-slow-spans@v2.16.0
        with:
          traces_file: ${{ inputs.otel_traces_file }}
          threshold_ms: ${{ inputs.slow_span_threshold_ms }}
          top: ${{ inputs.slow_span_top }}
          output_file: ${{ runner.temp }}/slow-spans.md

      - name: Capture compose logs
        if: ${{ always() && inputs.compose_file != '' }}
        shell: bash
        env:
          COMPOSE_FILE: ${{ inputs.compose_file }}
        run: |
          docker compose -f "$COMPOSE_FILE" logs --no-color > "${RUNNER_TEMP}/compose-logs.txt" || true

      - name: Build Playwright summary
        id: e2e-summary
        if: always()
        shell: bash
        env:
          REPORT_JSON: ${{ inputs.playwright_working_directory }}/${{ inputs.results_json_path }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          out=/tmp/comment.md
          if [ ! -f "$REPORT_JSON" ]; then
            {
              echo "### 🎭 Playwright E2E"
              echo
              echo "The Playwright run did not produce a report — check the [workflow logs](${RUN_URL}) for setup or compose failures."
            } > "$out"
          else
            passed=$(jq -r '.stats.expected // 0' "$REPORT_JSON")
            failed=$(jq -r '.stats.unexpected // 0' "$REPORT_JSON")
            flaky=$(jq -r '.stats.flaky // 0' "$REPORT_JSON")
            skipped=$(jq -r '.stats.skipped // 0' "$REPORT_JSON")
            duration_ms=$(jq -r '.stats.duration // 0' "$REPORT_JSON")
            duration=$(awk -v ms="$duration_ms" 'BEGIN { s=int(ms/1000); m=int(s/60); s=s%60; printf "%dm %ds", m, s }')
            total=$((passed + failed + flaky + skipped))
            if [ "$failed" -eq 0 ]; then
              header="✅ All tests passed"
            else
              header="❌ ${failed} test(s) failed"
            fi
            {
              echo "### 🎭 Playwright E2E — ${header}"
              echo
              echo "| Result | Count |"
              echo "|--------|------:|"
              echo "| ✅ Passed | ${passed} |"
              echo "| ❌ Failed | ${failed} |"
              echo "| ⚠️ Flaky | ${flaky} |"
              echo "| ⏭️ Skipped | ${skipped} |"
              echo "| **Total** | **${total}** |"
              echo
              echo "Duration: ${duration}"
              echo
              if [ "$failed" -gt 0 ] || [ "$flaky" -gt 0 ]; then
                echo "<details open><summary><strong>Failed and flaky tests</strong></summary>"
                echo
                # For each non-passing test: file/title/project/status + first line of the first error,
                # ANSI-stripped and truncated to 240 chars. Errors may live under .results[].errors[] or
                # the singular .results[].error — collect both, pick the first non-null.
                jq -r '
                  [ .suites[] | recurse(.suites[]?) | .specs[]? as $s
                    | $s.tests[] | select(.status != "expected" and .status != "skipped") as $t
                    | ( [ $t.results[]?.errors[]?.message, $t.results[]?.error?.message ]
                        | map(select(. != null)) | .[0] // "" ) as $raw
                    | ( $raw | gsub("\\x1b\\[[0-9;]+m"; "") | split("\n")[0] | .[0:240] ) as $msg
                    | "- `\($s.file // "")` — \($s.title) [\($t.projectName // "")] (\($t.status))"
                      + ( if ($msg | length) == 0 then "" else "\n  > " + $msg end )
                  ] | unique[]
                ' "$REPORT_JSON"
                echo
                echo "</details>"
                echo
              fi
              echo "Full report and traces: [download the \`playwright-report\` artifact](${RUN_URL}#artifacts)."
            } > "$out"
          fi
          # The slow spans report (otel_traces_file), under the test results.
          if [ -s "${RUNNER_TEMP}/slow-spans.md" ]; then
            { echo; cat "${RUNNER_TEMP}/slow-spans.md"; } >> "$out"
          fi
          # Job summary: always — useful for workflow_dispatch / push runs too, not just PRs.
          cat "$out" >> "$GITHUB_STEP_SUMMARY"
          # Stash the same markdown for the downstream PR-comment step.
          {
            echo "comment<<__EOM__"
            cat "$out"
            echo "__EOM__"
          } >> "$GITHUB_OUTPUT"

      - name: Post or update PR comment
        if: ${{ always() && github.event_name == 'pull_request' && inputs.pr_comment_enabled }}
        uses: im-open/update-pr-comment@add297ea3bc82b349c880eb70a1c2d7d5eaff93d # v2.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          comment-identifier: ${{ inputs.comment_identifier }}
          comment-content: ${{ steps.e2e-summary.outputs.comment }}

      - name: Resolve report and coverage paths
        id: resolve-paths
        if: always()
        shell: bash
        env:
          WD: ${{ inputs.playwright_working_directory }}
          REPORT_PATHS_JSON: ${{ inputs.report_paths_json }}
          COVERAGE_PATHS_JSON: ${{ inputs.coverage_paths_json }}
        run: |
          set -euo pipefail
          # Render JSON arrays as newline-separated paths, prefixed with playwright_working_directory.
          REPORT_PATHS=$(echo "$REPORT_PATHS_JSON" | jq -r --arg wd "$WD" '.[] | "\($wd)/\(.)"')
          COVERAGE_PATHS=$(echo "$COVERAGE_PATHS_JSON" | jq -r --arg wd "$WD" '.[] | "\($wd)/\(.)"')
          # Always include the captured compose logs in the report artifact.
          REPORT_PATHS_WITH_LOGS=$(printf '%s\n%s' "$REPORT_PATHS" "${RUNNER_TEMP}/compose-logs.txt")
          {
            echo "report_paths<<__EOP__"
            echo "$REPORT_PATHS_WITH_LOGS"
            echo "__EOP__"
            echo "coverage_paths<<__EOC__"
            echo "$COVERAGE_PATHS"
            echo "__EOC__"
            if [ -n "$COVERAGE_PATHS" ]; then
              echo "has_coverage=true"
            else
              echo "has_coverage=false"
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Upload Playwright report and compose logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: ${{ steps.resolve-paths.outputs.report_paths }}
          retention-days: ${{ inputs.artifact_retention_days }}
          if-no-files-found: warn

      # The JSON report alone for quality-artifact.yml, which collects every `quality-*` artifact
      # of the run.
      - name: Upload Playwright JSON report (quality-e2e)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-e2e
          path: ${{ inputs.playwright_working_directory }}/${{ inputs.results_json_path }}
          retention-days: ${{ inputs.artifact_retention_days }}
          if-no-files-found: ignore

      - name: Upload e2e coverage
        if: ${{ always() && steps.resolve-paths.outputs.has_coverage == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-coverage
          path: ${{ steps.resolve-paths.outputs.coverage_paths }}
          retention-days: ${{ inputs.artifact_retention_days }}
          if-no-files-found: warn

      # No compose teardown: the job runs on a fresh hosted runner (runs-on is fixed above), so
      # `docker compose down -v` only spent ~11s on the critical path before the push jobs.
