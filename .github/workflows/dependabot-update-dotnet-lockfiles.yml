name: "Oppdater dotnet lockfiles i dependabot PR-er (gjenbrukbar)"

# Intended trigger in the caller workflow:
#   on:
#     pull_request_target:
#       types: [labeled, synchronize]
#
# The job's `if:` gates on user.login == 'dependabot[bot]' and the configured
# label, so the reusable workflow can be invoked unconditionally — runs for
# unrelated PRs are skipped at the job level.

on:
  workflow_call:
    inputs:
      solution_path:
        required: true
        type: string
        description: "Mappen som inneholder .NET solution-filen"
      solution_name:
        required: true
        type: string
        description: "Navn på solution-filen (f.eks. Backend.slnx)"
      dotnet_version:
        required: false
        type: string
        description: ".NET versjon, f.eks. 10.0.x"
        default: "10.0.x"
      label:
        required: false
        type: string
        description: "PR-label som styrer om lockfile-oppdatering kjøres"
        default: "update-dotnet-lockfiles"
      primary_nuget_source:
        required: false
        type: string
        description: "Primær NuGet-feed-URL sendt til actions/setup-dotnet via source-url. Tom = standard nuget.org."
        default: ''
      extra_nuget_source:
        required: false
        type: string
        description: "Ekstra privat NuGet-feed lagt til via `dotnet nuget add source` før restore."
        default: ''
      extra_nuget_source_name:
        required: false
        type: string
        description: "Navn på den ekstra NuGet-kilden."
        default: ''
      extra_nuget_source_username:
        required: false
        type: string
        description: "Username for `dotnet nuget add source` on the extra source."
        default: 'az'
    secrets:
      WORKFLOW_TOKEN:
        required: true
        description: "PAT med contents:write som kan pushe tilbake til dependabot-PR-grenen"
      nuget_auth_token:
        required: false
        description: "Auth token for NuGet-feeds (NUGET_AUTH_TOKEN for setup-dotnet og --password på ekstra-kilde). Tom = fall tilbake til GITHUB_TOKEN."

jobs:
  update-lockfiles:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      (
        (github.event.action == 'labeled' && github.event.label.name == inputs.label) ||
        (github.event.action == 'synchronize' &&
          contains(join(github.event.pull_request.labels.*.name, ','), inputs.label))
      )
    steps:
      - name: Checkout ${{ github.head_ref }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.WORKFLOW_TOKEN }}

      - name: Setup .NET
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          dotnet-version: ${{ inputs.dotnet_version }}
          source-url: ${{ inputs.primary_nuget_source }}
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.nuget_auth_token != '' && secrets.nuget_auth_token || secrets.GITHUB_TOKEN }}

      - name: Add extra NuGet source
        if: inputs.extra_nuget_source != ''
        uses: hwinther/reusable-workflows/.github/actions/_dotnet-add-nuget-source@v2
        with:
          extra_nuget_source: ${{ inputs.extra_nuget_source }}
          extra_nuget_source_name: ${{ inputs.extra_nuget_source_name }}
          extra_nuget_source_username: ${{ inputs.extra_nuget_source_username }}
          nuget_auth_token: ${{ secrets.nuget_auth_token != '' && secrets.nuget_auth_token || secrets.GITHUB_TOKEN }}
          working_directory: ${{ inputs.solution_path }}

      - name: Setup git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update lockfiles
        working-directory: ${{ inputs.solution_path }}
        env:
          SOLUTION_NAME: ${{ inputs.solution_name }}
        run: |
          set -euo pipefail
          dotnet restore "$SOLUTION_NAME"
          if git ls-files --error-unmatch nuget.config > /dev/null 2>&1; then
            git checkout HEAD -- nuget.config
          else
            rm -f nuget.config || true
          fi
          git status
          if output=$(git status --porcelain) && [ -z "$output" ]; then
            echo "Working directory clean"
            exit 0
          else
            echo "Add and commit changes"
            git commit -a -m "Update lockfiles"
            git push
          fi
