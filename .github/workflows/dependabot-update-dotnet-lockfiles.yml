name: "Update dotnet lockfiles in Dependabot PRs (reusable)"

# Intended trigger in the caller workflow:
#   on:
#     pull_request_target:
#       types: [labeled, synchronize]
#
# The job's `if:` gates on user.login == 'dependabot[bot]' and the configured
# label, so the reusable workflow can be invoked unconditionally — runs for
# unrelated PRs are skipped at the job level.
#
# With solution_path and solution_name empty, every tracked .sln/.slnx is restored, so one
# identical caller works in every repo. The push needs a token that triggers the PR's workflows
# (GITHUB_TOKEN doesn't): a GitHub App token (app_client_id + app_private_key, optionally from a
# main-only environment; pull_request_target runs on the base branch, so the policy lets it in)
# or the WORKFLOW_TOKEN PAT.
#
# The job runs `dotnet restore` on the PR's code (MSBuild props/targets) while holding that token.
# Only Dependabot-authored PRs get here, and only people with write access can push to their
# branches; the App token is scoped to this repository and Contents: write.

on:
  workflow_call:
    inputs:
      solution_path:
        required: false
        type: string
        description: "Directory containing the .NET solution file. Empty (with solution_name empty) = every tracked .sln/.slnx."
        default: ""
      solution_name:
        required: false
        type: string
        description: "Solution file name (e.g. Backend.slnx). Empty = every tracked .sln/.slnx."
        default: ""
      dotnet_version:
        required: false
        type: string
        description: ".NET version, e.g. 10.0.x"
        default: "10.0.x"
      label:
        required: false
        type: string
        description: "PR label that controls whether the lockfile update runs"
        default: "update-dotnet-lockfiles"
      primary_nuget_source:
        required: false
        type: string
        description: "Primary NuGet feed URL passed to actions/setup-dotnet as source-url. Empty = nuget.org."
        default: ''
      extra_nuget_source:
        required: false
        type: string
        description: "Extra private NuGet feed added with `dotnet nuget add source` before restore."
        default: ''
      extra_nuget_source_name:
        required: false
        type: string
        description: "Name of the extra NuGet source."
        default: ''
      extra_nuget_source_username:
        required: false
        type: string
        description: "Username for `dotnet nuget add source` on the extra source."
        default: 'az'
      app_client_id:
        required: false
        type: string
        description: >-
          Client ID (Iv23…) of a GitHub App to push the lockfiles with, instead of WORKFLOW_TOKEN.
          Not a secret; pass it from a repository variable. Needs `app_private_key`. The App needs
          Contents: write on the repo.
        default: ""
      environment:
        required: false
        type: string
        description: >-
          Environment to run the job in, so `app_private_key` can be an environment secret limited
          to the default branch. Empty = no environment.
        default: ""
      commit_message:
        required: false
        type: string
        description: "Message of the lockfile commit pushed to the PR branch (Conventional Commits)."
        default: "chore(deps): update packages.lock.json"
    secrets:
      WORKFLOW_TOKEN:
        required: false
        description: "PAT with contents:write that can push back to the Dependabot PR branch. Not needed with app_client_id."
      app_private_key:
        required: false
        description: "Private key of the GitHub App in app_client_id."
      nuget_auth_token:
        required: false
        description: "Auth token for the NuGet feeds (NUGET_AUTH_TOKEN for setup-dotnet and --password on the extra source). Empty = GITHUB_TOKEN."

jobs:
  update-lockfiles:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: ${{ inputs.environment }}
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      (
        (github.event.action == 'labeled' && github.event.label.name == inputs.label) ||
        (github.event.action == 'synchronize' &&
          contains(join(github.event.pull_request.labels.*.name, ','), inputs.label))
      )
    steps:
      - name: Mint GitHub App token for the push
        id: app-token
        if: inputs.app_client_id
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ inputs.app_client_id }}
          private-key: ${{ secrets.app_private_key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Checkout ${{ github.head_ref }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          token: ${{ steps.app-token.outputs.token || secrets.WORKFLOW_TOKEN }}
          persist-credentials: true # zizmor: ignore[artipacked] -- pushes the refreshed lockfiles back to the PR branch

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: ${{ inputs.dotnet_version }}
          source-url: ${{ inputs.primary_nuget_source }}
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.nuget_auth_token != '' && secrets.nuget_auth_token || secrets.GITHUB_TOKEN }}

      - name: Add extra NuGet source
        if: inputs.extra_nuget_source != ''
        uses: hwinther/reusable-workflows/.github/actions/_dotnet-add-nuget-source@v2.31.0
        with:
          extra_nuget_source: ${{ inputs.extra_nuget_source }}
          extra_nuget_source_name: ${{ inputs.extra_nuget_source_name }}
          extra_nuget_source_username: ${{ inputs.extra_nuget_source_username }}
          nuget_auth_token: ${{ secrets.nuget_auth_token != '' && secrets.nuget_auth_token || secrets.GITHUB_TOKEN }}
          working_directory: ${{ inputs.solution_path || '.' }}

      - name: Setup git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update lockfiles
        env:
          SOLUTION_PATH: ${{ inputs.solution_path }}
          SOLUTION_NAME: ${{ inputs.solution_name }}
          COMMIT_MESSAGE: ${{ inputs.commit_message }}
        run: |
          set -euo pipefail
          if [ -n "$SOLUTION_NAME" ]; then
            solutions=("${SOLUTION_PATH:-.}/$SOLUTION_NAME")
          else
            mapfile -t solutions < <(git ls-files '*.sln' '*.slnx')
            if [ "${#solutions[@]}" -eq 0 ]; then
              echo "::error::No tracked .sln/.slnx; set solution_path and solution_name."
              exit 1
            fi
          fi
          for sln in "${solutions[@]}"; do
            dir=$(dirname "$sln")
            echo "::group::dotnet restore $sln"
            (cd "$dir" && dotnet restore "$(basename "$sln")")
            echo "::endgroup::"
          done
          # setup-dotnet's source-url and the extra-source step edit or write a nuget.config; only the
          # lockfiles go back. Tracked ones are reset; untracked ones aren't committed by `commit -a`.
          { git diff --name-only | grep -iE '(^|/)nuget\.config$' || true; } | while read -r f; do git checkout HEAD -- "$f"; done
          git status
          if git diff --quiet; then
            echo "No lockfile changes"
            exit 0
          else
            echo "Add and commit changes"
            git commit -a -m "$COMMIT_MESSAGE"
            git push
          fi
