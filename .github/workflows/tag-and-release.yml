# Creates a tag and release based on user input or automatic version increment.
# When tag_name is set to "auto", the latest semver tag in the repo is found and
# incremented by 1 on the minor version (patch reset to 0).
# Floating tags (vX and vX.Y) are updated with `git push -f`; useful for reusable
# workflow scenarios where consumers pin to floating major/minor refs.
# The canonical release tag is always full semver (vX.Y.Z) in auto mode — that's
# what GitVersion expects and what immutable releases need.
name: "Create tag and release"

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag name (e.g. v1.2.3), or 'auto' to bump minor from the latest tag"
        required: false
        default: "auto"
      release_notes:
        description: "Release notes for this tag"
        required: false
      create_release:
        description: "Create a GitHub Release for this tag"
        required: false
        type: boolean
        default: true
      floating_tags:
        description: "Create/update floating tags (vX and vX.Y) on the same commit"
        required: false
        type: boolean
        default: true
  workflow_call:
    inputs:
      tag_name:
        description: "Tag name (e.g. v1.2.3), or 'auto' to bump minor from the latest tag"
        type: string
        required: false
        default: "auto"
      release_notes:
        description: "Release notes for this tag"
        type: string
        required: false
      create_release:
        description: "Create a GitHub Release for this tag"
        type: string
        required: false
        default: "true"
      floating_tags:
        description: "Create/update floating tags (vX and vX.Y) on the same commit"
        type: string
        required: false
        default: "false"
      emit_pinned_uses_summary:
        description: "Write a list of pinned `uses:` references (all workflows + composite actions under .github/) to the job summary. Turn on for repos that publish reusable workflows/actions; leave off for repos that primarily publish other artifacts (containers, packages)."
        type: string
        required: false
        default: "false"
    outputs:
      tag_name:
        description: "Name of the created tag"
        value: ${{ jobs.tag.outputs.tag_name }}

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CREATE_FLOATING_TAGS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.floating_tags || inputs.floating_tags }}
      EMIT_PINNED_USES_SUMMARY: ${{ github.event_name == 'workflow_dispatch' && 'true' || inputs.emit_pinned_uses_summary }}
    outputs:
      tag_name: ${{ steps.determine_tag.outputs.tag_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Determine package version and container image tag
        id: gitversion
        if: github.event.inputs.tag_name == 'auto'
        uses: hwinther/reusable-workflows/.github/actions/gitversion@v1
        with:
          persist_checkout_credentials: 'true'

      - name: Determine tag name
        id: determine_tag
        run: |
          TAG_INPUT="${{ github.event.inputs.tag_name }}"

          if [ "$TAG_INPUT" == "auto" ]; then
            IFS='.' read -ra VERSION_PARTS <<< "${{ steps.gitversion.outputs.version }}"
            MAJOR=${VERSION_PARTS[0]}
            MINOR=${VERSION_PARTS[1]:-0}
            PATCH=${VERSION_PARTS[2]:-0}

            MINOR=$((MINOR + 1))
            PATCH=0

            FULL_TAG="v${MAJOR}.${MINOR}.${PATCH}"
            MINOR_TAG="v${MAJOR}.${MINOR}"
            MAJOR_TAG="v${MAJOR}"

            echo "tag_name=$FULL_TAG" >> $GITHUB_OUTPUT
            echo "tag_name_full=$FULL_TAG" >> $GITHUB_OUTPUT

            if [ "$CREATE_FLOATING_TAGS" = "true" ]; then
              echo "tag_name_minor=$MINOR_TAG" >> $GITHUB_OUTPUT
              echo "tag_name_major=$MAJOR_TAG" >> $GITHUB_OUTPUT
            else
              echo "tag_name_minor=" >> $GITHUB_OUTPUT
              echo "tag_name_major=" >> $GITHUB_OUTPUT
            fi

            echo "New tag (semver): $FULL_TAG"
            if [ "$CREATE_FLOATING_TAGS" = "true" ]; then
              echo "Floating tags: $MINOR_TAG, $MAJOR_TAG"
            fi
          else
            echo "tag_name=$TAG_INPUT" >> $GITHUB_OUTPUT
            echo "tag_name_full=$TAG_INPUT" >> $GITHUB_OUTPUT
            echo "Using supplied tag: $TAG_INPUT"
          fi

      # In auto mode: avoid creating a new tag/release on the same commit as the latest
      # semver tag (no new commits since the previous release).
      - name: Check for new commits since last tag (auto)
        if: (github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name == 'auto') || (github.event_name == 'workflow_call' && inputs.tag_name == 'auto')
        shell: bash
        run: |
          set -euo pipefail
          LATEST=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1 || true)
          if [ -z "$LATEST" ]; then
            echo "No existing semver tag (vX.Y.Z) — continuing."
            exit 0
          fi
          HEAD_SHA=$(git rev-parse HEAD)
          TAG_SHA=$(git rev-parse "$LATEST^{commit}")
          if [ "$HEAD_SHA" = "$TAG_SHA" ]; then
            echo "::error::No new commits since last tag ($LATEST). HEAD and the tag point to the same commit. Aborting to avoid a duplicate tag and release."
            exit 1
          fi
          echo "OK: commits exist after $LATEST (HEAD is not at the tag's commit)."

      - name: Create tag(s) ${{ steps.determine_tag.outputs.tag_name }}
        id: create_tag
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          FULL_TAG="${{ steps.determine_tag.outputs.tag_name_full }}"
          MINOR_TAG="${{ steps.determine_tag.outputs.tag_name_minor }}"
          MAJOR_TAG="${{ steps.determine_tag.outputs.tag_name_major }}"

          if [ -n "$FULL_TAG" ]; then
            git tag "$FULL_TAG"
            git push origin "$FULL_TAG"
          fi

          # Floating vX.Y and vX — only when floating_tags is enabled (requires push -f).
          if [ -n "$MINOR_TAG" ] && [ "$CREATE_FLOATING_TAGS" = "true" ]; then
            git tag -f "$MINOR_TAG"
            git push -f origin "$MINOR_TAG"
          fi
          if [ -n "$MAJOR_TAG" ] && [ "$CREATE_FLOATING_TAGS" = "true" ]; then
            git tag -f "$MAJOR_TAG"
            git push -f origin "$MAJOR_TAG"
          fi

      - name: Create release ${{ steps.determine_tag.outputs.tag_name }}
        id: create_release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        if: github.event.inputs.create_release == 'true'
        with:
          tag_name: ${{ steps.determine_tag.outputs.tag_name }}
          draft: false
          prerelease: false
          make_latest: true
          body: ${{ github.event.inputs.release_notes }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Show release link for ${{ steps.determine_tag.outputs.tag_name }}
        if: github.event.inputs.create_release == 'true'
        env:
          TAG_NAME: ${{ steps.determine_tag.outputs.tag_name }}
          RELEASE_URL: ${{ steps.create_release.outputs.url }}
        run: |
          {
            echo "## ✅ Release created"
            echo ""
            echo "**Tag:** $TAG_NAME"
            echo ""
            echo "🔗 [Go to release for review]($RELEASE_URL)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Show pinned uses references for ${{ steps.determine_tag.outputs.tag_name }}
        if: env.EMIT_PINNED_USES_SUMMARY == 'true'
        shell: bash
        env:
          TAG_NAME: ${{ steps.determine_tag.outputs.tag_name_full }}
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          {
            echo ""
            echo "## 📌 Pinned \`uses:\` references for ${TAG_NAME}"
            echo ""
            echo "Paste one of the lines below into your own workflow to pin to this exact commit (Dependabot updates the \`# ${TAG_NAME}\` comment automatically):"
            echo ""
            echo '```yaml'
            for f in .github/workflows/*.yml; do
              [ -f "$f" ] || continue
              name=$(basename "$f")
              case "$name" in _*) continue ;; esac
              echo "uses: ${GITHUB_REPOSITORY}/.github/workflows/${name}@${SHA} # ${TAG_NAME}"
            done
            for d in .github/actions/*/; do
              [ -d "$d" ] || continue
              name=$(basename "$d")
              case "$name" in _*) continue ;; esac
              echo "uses: ${GITHUB_REPOSITORY}/.github/actions/${name}@${SHA} # ${TAG_NAME}"
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
