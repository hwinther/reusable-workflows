name: "Format-and-PR helper (reusable)"

# Multi-formatter helper. Each mode is its own job, gated by `inputs.mode`:
#   mode=format            → find what the repository has and run every formatter
#                            that applies, then open ONE PR: jb cleanupcode per
#                            *.slnx, prettier per npm project that depends on it,
#                            ruff format when Ruff is configured, gofmt when there
#                            is a go.mod. Needs no inputs; an optional
#                            .github/format.yml excludes paths, lists solutions or
#                            turns a formatter off (see
#                            .github/actions/_format-detect/scripts/detect.sh).
#   mode=eslint-fix        → `eslint --fix` per npm project with eslint and a flat
#                            config, in a PR of its own: unlike the formatters it
#                            can change code, so it gets its own review.
#   mode=cleanupcode       → run `jb cleanupcode` against a .NET solution and
#                            open a PR with the diff.
#   mode=ruff-format       → run `ruff format` against a Python tree and
#                            open a PR with the diff.
#   mode=blame-ignore-revs → after a formatter PR has merged to the default
#                            branch (squash/rebase), sync .git-blame-ignore-revs
#                            from that history and open a PR. Formatter-agnostic;
#                            matches commits by the caller-supplied `commit_subject`.
#
# Caller owns the trigger (workflow_dispatch with a `mode` choice input is the
# expected shape); the job-level `if:` here gates which job runs.

on:
  workflow_call:
    inputs:
      runs_on:
        description: "Runner label for every job, e.g. `self-hosted` to keep a private repo's runs off the GitHub-hosted minutes quota. The runner needs bash, git and the toolchains the chosen mode installs (setup-node, setup-python, setup-dotnet)."
        required: false
        type: string
        default: "ubuntu-latest"
      mode:
        required: true
        type: string
        description: "Which job to run: 'format' (every formatter that applies, detected), 'eslint-fix', 'cleanupcode', 'ruff-format' or 'blame-ignore-revs'."
      solution_path:
        required: false
        type: string
        description: "Directory containing the .NET solution file (mode=cleanupcode only)."
        default: ''
      solution_name:
        required: false
        type: string
        description: "Solution file name, e.g. Backend.slnx (mode=cleanupcode only)."
        default: ''
      dotnet_version:
        required: false
        type: string
        description: ".NET version, e.g. 10.0.x (mode=cleanupcode / format)."
        default: "10.0.x"
      python_version:
        required: false
        type: string
        description: "Python version (mode=ruff-format only), passed to actions/setup-python."
        default: "3.13"
      ruff_version:
        required: false
        type: string
        description: "Ruff version (mode=ruff-format / format), e.g. '0.9.0'. Empty = the latest available."
        default: ''
      target_path:
        required: false
        type: string
        description: "Path `ruff format` runs against (mode=ruff-format only)."
        default: '.'
      commit_subject:
        required: false
        type: string
        description: "Commit subject for the formatter PR (cleanupcode / ruff-format), and the search string for the blame-ignore-revs sync. Ruff callers typically override it, e.g. 'chore: ruff format'."
        default: "chore: ReSharper CleanupCode"
      format_commit_subject:
        required: false
        type: string
        description: "Commit subject and PR title for mode=format. Conventional Commits 'style' (layout only): labelled chore, a patch release. mode=blame-ignore-revs also lists the commits matching it."
        default: "style: format code"
      eslint_commit_subject:
        required: false
        type: string
        description: "Commit subject and PR title for mode=eslint-fix. 'style' too, as eslint's fixes keep what the code does; not added to .git-blame-ignore-revs, as they still change code worth blaming."
        default: "style: apply eslint --fix"
      node_version:
        required: false
        type: string
        description: "Node.js version for prettier and eslint (mode=format / eslint-fix), passed to actions/setup-node."
        default: "lts/*"
      primary_nuget_source:
        required: false
        type: string
        description: "Primary NuGet feed URL passed to actions/setup-dotnet as source-url. Note: `dotnet tool install JetBrains.ReSharper.GlobalTools` needs nuget.org, so when overriding, point it at a feed that upstreams nuget.org."
        default: ''
      extra_nuget_source:
        required: false
        type: string
        description: "Extra private NuGet feed added with `dotnet nuget add source` before restore."
        default: ''
      extra_nuget_source_name:
        required: false
        type: string
        description: "Name of the extra NuGet source."
        default: ''
      extra_nuget_source_username:
        required: false
        type: string
        description: "Username for `dotnet nuget add source` on the extra source."
        default: 'az'
    secrets:
      nuget_auth_token:
        required: false
        description: "Auth token for the NuGet feeds (NUGET_AUTH_TOKEN for setup-dotnet and --password on the extra source). Empty = GITHUB_TOKEN."

jobs:
  cleanupcode:
    if: ${{ inputs.mode == 'cleanupcode' }}
    runs-on: ${{ inputs.runs_on || 'ubuntu-latest' }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true # zizmor: ignore[artipacked] -- a later step pushes a branch

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: ${{ inputs.dotnet_version }}
          source-url: ${{ inputs.primary_nuget_source }}
          cache: true
          cache-dependency-path: ${{ inputs.solution_path != '' && format('{0}/**/packages.lock.json', inputs.solution_path) || '**/packages.lock.json' }}
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.nuget_auth_token != '' && secrets.nuget_auth_token || secrets.GITHUB_TOKEN }}

      - name: Add extra NuGet source
        if: inputs.extra_nuget_source != ''
        uses: hwinther/reusable-workflows/.github/actions/_dotnet-add-nuget-source@v2.45.0
        with:
          extra_nuget_source: ${{ inputs.extra_nuget_source }}
          extra_nuget_source_name: ${{ inputs.extra_nuget_source_name }}
          extra_nuget_source_username: ${{ inputs.extra_nuget_source_username }}
          nuget_auth_token: ${{ secrets.nuget_auth_token != '' && secrets.nuget_auth_token || secrets.GITHUB_TOKEN }}
          working_directory: ${{ inputs.solution_path }}

      - name: Restore
        working-directory: ${{ inputs.solution_path }}
        env:
          SOLUTION_FILE: ${{ inputs.solution_name }}
        run: |
          set -euo pipefail
          dotnet restore --locked-mode "$SOLUTION_FILE"
          if git ls-files --error-unmatch nuget.config > /dev/null 2>&1; then
            git checkout HEAD -- nuget.config
          else
            rm -f nuget.config || true
          fi

      - name: Install JetBrains.ReSharper.GlobalTools
        run: dotnet tool install JetBrains.ReSharper.GlobalTools --global

      - name: Run CleanupCode
        working-directory: ${{ inputs.solution_path }}
        env:
          SOLUTION_FILE: ${{ inputs.solution_name }}
        run: jb cleanupcode "$SOLUTION_FILE"

      - name: Branch, commit, and open pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_SUBJECT: ${{ inputs.commit_subject }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes after CleanupCode; skipping PR."
            exit 0
          fi
          branch="jb/cleanupcode-${GITHUB_RUN_ID}"
          git checkout -b "$branch"
          git add -A
          git commit -m "$COMMIT_SUBJECT"
          git push origin "$branch"
          base_branch="$GITHUB_REF_NAME"
          if [ -z "$(git ls-remote origin "refs/heads/${base_branch}")" ]; then
            base_branch="$DEFAULT_BRANCH"
            echo "::warning::Trigger branch ${GITHUB_REF_NAME} is not on origin; opening PR against ${base_branch}."
          fi
          gh pr create \
            --base "$base_branch" \
            --head "$branch" \
            --title "$COMMIT_SUBJECT" \
            --body "Automated changes from JetBrains [CleanupCode](https://www.jetbrains.com/help/resharper/CleanupCode.html) (\`jb cleanupcode\` via [JetBrains.ReSharper.GlobalTools](https://www.nuget.org/packages/JetBrains.ReSharper.GlobalTools))."

  ruff-format:
    if: ${{ inputs.mode == 'ruff-format' }}
    runs-on: ${{ inputs.runs_on || 'ubuntu-latest' }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true # zizmor: ignore[artipacked] -- a later step pushes a branch

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ inputs.python_version }}

      - name: Install Ruff
        env:
          RUFF_VERSION: ${{ inputs.ruff_version }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -n "$RUFF_VERSION" ]; then
            pip install "ruff==$RUFF_VERSION"
          else
            pip install ruff
          fi

      - name: Run ruff format
        env:
          TARGET_PATH: ${{ inputs.target_path }}
        run: ruff format "$TARGET_PATH"

      - name: Branch, commit, and open pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_SUBJECT: ${{ inputs.commit_subject }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes after ruff format; skipping PR."
            exit 0
          fi
          branch="ruff/format-${GITHUB_RUN_ID}"
          git checkout -b "$branch"
          git add -A
          git commit -m "$COMMIT_SUBJECT"
          git push origin "$branch"
          base_branch="$GITHUB_REF_NAME"
          if [ -z "$(git ls-remote origin "refs/heads/${base_branch}")" ]; then
            base_branch="$DEFAULT_BRANCH"
            echo "::warning::Trigger branch ${GITHUB_REF_NAME} is not on origin; opening PR against ${base_branch}."
          fi
          gh pr create \
            --base "$base_branch" \
            --head "$branch" \
            --title "$COMMIT_SUBJECT" \
            --body "Automated changes from [Ruff](https://docs.astral.sh/ruff/) (\`ruff format\`)."

  format:
    if: ${{ inputs.mode == 'format' || inputs.mode == 'eslint-fix' }}
    runs-on: ${{ inputs.runs_on || 'ubuntu-latest' }}
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true # zizmor: ignore[artipacked] -- a later step pushes a branch

      - name: Detect formatters
        id: detect
        uses: hwinther/reusable-workflows/.github/actions/_format-detect@v2.45.0
        with:
          mode: ${{ inputs.mode }}

      - name: Set up .NET
        if: steps.detect.outputs.solutions != ''
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: ${{ inputs.dotnet_version }}
          source-url: ${{ inputs.primary_nuget_source }}
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.nuget_auth_token != '' && secrets.nuget_auth_token || secrets.GITHUB_TOKEN }}

      - name: Add extra NuGet source
        if: steps.detect.outputs.solutions != '' && inputs.extra_nuget_source != ''
        uses: hwinther/reusable-workflows/.github/actions/_dotnet-add-nuget-source@v2.45.0
        with:
          extra_nuget_source: ${{ inputs.extra_nuget_source }}
          extra_nuget_source_name: ${{ inputs.extra_nuget_source_name }}
          extra_nuget_source_username: ${{ inputs.extra_nuget_source_username }}
          nuget_auth_token: ${{ secrets.nuget_auth_token != '' && secrets.nuget_auth_token || secrets.GITHUB_TOKEN }}

      - name: Run CleanupCode
        if: steps.detect.outputs.solutions != ''
        env:
          SOLUTIONS: ${{ steps.detect.outputs.solutions }}
        run: |
          set -euo pipefail
          dotnet tool install JetBrains.ReSharper.GlobalTools --global
          while IFS= read -r solution; do
            [ -n "$solution" ] || continue
            echo "::group::jb cleanupcode $solution"
            # --locked-mode where the solution keeps lock files, so restore matches CI.
            locked=()
            if [ -n "$(git ls-files -- "$(dirname "$solution")/**/packages.lock.json")" ]; then
              locked=(--locked-mode)
            fi
            dotnet restore "${locked[@]}" "$solution"
            jb cleanupcode "$solution"
            echo "::endgroup::"
          done <<< "$SOLUTIONS"
          # Restore may write a nuget.config next to a solution (extra source); don't commit it.
          git checkout -- '*nuget.config' 2> /dev/null || true
          git clean -fq -- '*nuget.config' 2> /dev/null || true

      - name: Set up Node.js
        if: steps.detect.outputs.install_dirs != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node_version }}

      - name: Install npm packages
        if: steps.detect.outputs.install_dirs != ''
        env:
          INSTALL_DIRS: ${{ steps.detect.outputs.install_dirs }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          while IFS= read -r dir; do
            [ -n "$dir" ] || continue
            echo "::group::npm ci in $dir"
            (cd "$dir" && npm ci --ignore-scripts --no-audit --no-fund)
            echo "::endgroup::"
          done <<< "$INSTALL_DIRS"

      - name: Run prettier
        if: steps.detect.outputs.prettier_dirs != ''
        env:
          PRETTIER_DIRS: ${{ steps.detect.outputs.prettier_dirs }}
          EXCLUDES: ${{ steps.detect.outputs.excludes }}
        run: |
          set -euo pipefail
          is_excluded() {
            local e
            while IFS= read -r e; do
              [ -n "$e" ] || continue
              if [ "$1" = "$e" ] || [[ "$1" == "$e/"* ]]; then return 0; fi
            done <<< "$EXCLUDES"
            return 1
          }
          bin_for() { # nearest node_modules/.bin/<tool> at or above a directory
            local d="$1"
            while :; do
              if [ -x "$d/node_modules/.bin/$2" ]; then echo "$(cd "$d" && pwd)/node_modules/.bin/$2"; return 0; fi
              [ "$d" = "." ] && return 1
              d="$(dirname "$d")"
            done
          }
          while IFS= read -r dir; do
            [ -n "$dir" ] || continue
            prettier="$(bin_for "$dir" prettier)" || { echo "::error::prettier is not installed for $dir"; exit 1; }
            # Tracked files only, run from the project directory so its .prettierignore and config
            # apply. .github/ and .poutine.yml (largely synced from wshno/devops, which owns their
            # layout) and lock files are left alone, as are the exclude paths from .github/format.yml.
            list="$(mktemp)"
            while IFS= read -r -d '' f; do
              full="$f"
              [ "$dir" = "." ] || full="$dir/$f"
              case "$full" in
                .github/*|*/.github/*|.poutine.yml|*package-lock.json|*pnpm-lock.yaml|*yarn.lock) continue ;;
              esac
              is_excluded "$full" && continue
              printf '%s\0' "$f" >> "$list"
            done < <(cd "$dir" && git ls-files -z -- .)
            echo "::group::prettier in $dir ($(tr -cd '\0' < "$list" | wc -c) files)"
            if [ -s "$list" ]; then
              (cd "$dir" && xargs -0 "$prettier" --write --ignore-unknown --log-level warn < "$list")
            fi
            echo "::endgroup::"
            rm -f "$list"
          done <<< "$PRETTIER_DIRS"

      - name: Run eslint --fix
        if: steps.detect.outputs.eslint_dirs != ''
        env:
          ESLINT_DIRS: ${{ steps.detect.outputs.eslint_dirs }}
        run: |
          set -euo pipefail
          bin_for() {
            local d="$1"
            while :; do
              if [ -x "$d/node_modules/.bin/$2" ]; then echo "$(cd "$d" && pwd)/node_modules/.bin/$2"; return 0; fi
              [ "$d" = "." ] && return 1
              d="$(dirname "$d")"
            done
          }
          report="${RUNNER_TEMP}/eslint-remaining.md"
          : > "$report"
          i=0
          while IFS= read -r dir; do
            [ -n "$dir" ] || continue
            i=$((i + 1))
            eslint="$(bin_for "$dir" eslint)" || { echo "::error::eslint is not installed for $dir"; exit 1; }
            out="${RUNNER_TEMP}/eslint-${i}.json"
            echo "::group::eslint --fix in $dir"
            # Exits non-zero while problems remain that --fix can't fix; those are reported, not fatal.
            (cd "$dir" && "$eslint" . --fix --format json --output-file "$out") || true
            echo "::endgroup::"
            if [ -s "$out" ]; then
              jq -r --arg dir "$dir" \
                '([.[].errorCount] | add // 0) as $e | "- `\($dir)`: \($e) error(s) left that --fix could not fix"' \
                "$out" >> "$report"
            fi
          done <<< "$ESLINT_DIRS"
          cat "$report"

      - name: Run ruff format
        if: steps.detect.outputs.ruff == 'true'
        env:
          RUFF_VERSION: ${{ inputs.ruff_version }}
          EXCLUDES: ${{ steps.detect.outputs.excludes }}
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r e; do
            if [ -n "$e" ]; then args+=(--extend-exclude "$e"); fi
          done <<< "$EXCLUDES"
          pipx run "ruff${RUFF_VERSION:+==$RUFF_VERSION}" format "${args[@]}" .

      - name: Run gofmt
        if: steps.detect.outputs.gofmt == 'true'
        env:
          EXCLUDES: ${{ steps.detect.outputs.excludes }}
        run: |
          set -euo pipefail
          is_excluded() {
            local e
            while IFS= read -r e; do
              [ -n "$e" ] || continue
              if [ "$1" = "$e" ] || [[ "$1" == "$e/"* ]]; then return 0; fi
            done <<< "$EXCLUDES"
            return 1
          }
          git ls-files -z -- '*.go' | while IFS= read -r -d '' f; do
            is_excluded "$f" || printf '%s\0' "$f"
          done | xargs -0 --no-run-if-empty gofmt -w

      - name: Branch, commit, and open pull request
        if: steps.detect.outputs.any == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: ${{ inputs.mode }}
          COMMIT_SUBJECT: ${{ inputs.mode == 'eslint-fix' && inputs.eslint_commit_subject || inputs.format_commit_subject }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SOLUTIONS: ${{ steps.detect.outputs.solutions }}
          PRETTIER_DIRS: ${{ steps.detect.outputs.prettier_dirs }}
          ESLINT_DIRS: ${{ steps.detect.outputs.eslint_dirs }}
          RUFF: ${{ steps.detect.outputs.ruff }}
          GOFMT: ${{ steps.detect.outputs.gofmt }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes after $MODE; skipping PR."
            exit 0
          fi
          bullets() { sed '/^$/d; s/^/  - `/; s/$/`/' <<< "$1"; }
          body="${RUNNER_TEMP}/pr-body.md"
          {
            if [ "$MODE" = "eslint-fix" ]; then
              echo "Automated \`eslint --fix\` in:"
              bullets "$ESLINT_DIRS"
              if [ -s "${RUNNER_TEMP}/eslint-remaining.md" ]; then
                echo
                cat "${RUNNER_TEMP}/eslint-remaining.md"
              fi
              echo
              echo "eslint --fix can change code, not only layout, so review it as a code change."
            else
              echo "Automated formatting:"
              if [ -n "$SOLUTIONS" ]; then
                echo "- [CleanupCode](https://www.jetbrains.com/help/resharper/CleanupCode.html) (\`jb cleanupcode\`):"
                bullets "$SOLUTIONS"
              fi
              if [ -n "$PRETTIER_DIRS" ]; then
                echo "- [Prettier](https://prettier.io/) (\`prettier --write\`, tracked files outside \`.github/\` and \`.poutine.yml\`):"
                bullets "$PRETTIER_DIRS"
              fi
              if [ "$RUFF" = "true" ]; then echo "- [Ruff](https://docs.astral.sh/ruff/formatter/) (\`ruff format\`)"; fi
              if [ "$GOFMT" = "true" ]; then echo "- \`gofmt -w\`"; fi
              echo
              echo "Layout only. Once merged, run this workflow with mode \`blame-ignore-revs\` to add the commit to \`.git-blame-ignore-revs\`."
            fi
            echo
            echo "Paths, solutions or formatters can be adjusted in \`.github/format.yml\` (see [_format-detect](https://github.com/hwinther/reusable-workflows/blob/main/.github/actions/_format-detect/scripts/detect.sh))."
          } > "$body"
          branch="format/${MODE}-${GITHUB_RUN_ID}"
          git checkout -b "$branch"
          git add -A
          git commit -q -m "$COMMIT_SUBJECT"
          git push origin "$branch"
          base_branch="$GITHUB_REF_NAME"
          if [ -z "$(git ls-remote origin "refs/heads/${base_branch}")" ]; then
            base_branch="$DEFAULT_BRANCH"
            echo "::warning::Trigger branch ${GITHUB_REF_NAME} is not on origin; opening PR against ${base_branch}."
          fi
          gh pr create --base "$base_branch" --head "$branch" --title "$COMMIT_SUBJECT" --body-file "$body"

      - name: Nothing to format
        if: steps.detect.outputs.any != 'true'
        env:
          MODE: ${{ inputs.mode }}
        run: echo "No formatter applies to this repository in mode $MODE; nothing to do."

  sync-git-blame-ignore-revs:
    if: ${{ inputs.mode == 'blame-ignore-revs' }}
    runs-on: ${{ inputs.runs_on || 'ubuntu-latest' }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true # zizmor: ignore[artipacked] -- a later step pushes a branch
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync .git-blame-ignore-revs from formatter commits on default branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_SUBJECT: ${{ inputs.commit_subject }}
          FORMAT_COMMIT_SUBJECT: ${{ inputs.format_commit_subject }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          default_branch="$DEFAULT_BRANCH"
          git fetch origin --prune
          git checkout "$default_branch"
          git reset --hard "origin/${default_branch}"

          subject="$COMMIT_SUBJECT"
          # Commits from the single-formatter modes (commit_subject) and from mode=format whose SUBJECT
          # starts with one of them (a squash merge appends " (#123)"). Not `git log --grep`: that
          # searches the whole message, and a squash body quoting the subject (a PR description
          # mentioning "style: format code") would list an unrelated commit.
          mapfile -t cleanup_shas < <(git log "$default_branch" --reverse --pretty=format:'%H%x09%s' \
            | awk -F'\t' -v a="$subject" -v b="$FORMAT_COMMIT_SUBJECT" \
                '(a != "" && index($2, a) == 1) || (b != "" && index($2, b) == 1) { print $1 }' || true)
          if [ "${#cleanup_shas[@]}" -eq 0 ] || [ -z "${cleanup_shas[0]:-}" ]; then
            echo "No commits on ${default_branch} match the formatter subject (merge the formatter PR first, or ensure the squash/rebase title still contains: ${subject})."
            exit 0
          fi

          ignore_file=".git-blame-ignore-revs"
          header="# Revisions listed here are ignored by git blame (see https://git-scm.com/docs/git-blame#Documentation/git-blame.txt-ignoreRevsFile)"
          declare -A seen=()
          declare -a existing_shas=()
          comment_block=""

          if [ -f "$ignore_file" ]; then
            while IFS= read -r line || [ -n "$line" ]; do
              if [[ "$line" =~ ^[0-9a-f]{40}$ ]]; then
                break
              fi
              comment_block+="${line}"$'\n'
            done < "$ignore_file"
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              if [ -z "${seen[$line]:-}" ]; then
                existing_shas+=("$line")
                seen["$line"]=1
              fi
            done < <(grep -E '^[0-9a-f]{40}$' "$ignore_file" || true)
          fi

          added=0
          for sha in "${cleanup_shas[@]}"; do
            if [ -z "$sha" ]; then
              continue
            fi
            if [ -z "${seen[$sha]:-}" ]; then
              existing_shas+=("$sha")
              seen["$sha"]=1
              added=$((added + 1))
            fi
          done

          sort_shas_chronologically() {
            for sha in "$@"; do
              [ -n "$sha" ] || continue
              ts="$(git log -1 --format=%ct "$sha" 2>/dev/null || echo "0")"
              printf '%s %s\n' "$ts" "$sha"
            done | sort -n | cut -d' ' -f2-
          }

          mapfile -t sorted_shas < <(sort_shas_chronologically "${existing_shas[@]}")

          tmpfile="$(mktemp)"
          if [ -n "$comment_block" ]; then
            printf '%s' "$comment_block" > "$tmpfile"
          else
            printf '%s\n\n' "$header" > "$tmpfile"
          fi
          for sha in "${sorted_shas[@]}"; do
            printf '%s\n' "$sha" >> "$tmpfile"
          done

          if [ -f "$ignore_file" ] && cmp -s "$ignore_file" "$tmpfile"; then
            echo ".git-blame-ignore-revs already lists all matching formatter commits."
            rm -f "$tmpfile"
            exit 0
          fi

          # Legacy branch prefix `jb/` kept to avoid churning consumer-side
          # branch-protection patterns; this job is formatter-agnostic.
          branch="jb/blame-ignore-revs-${GITHUB_RUN_ID}"
          git checkout -b "$branch"

          mv "$tmpfile" "$ignore_file"
          git add "$ignore_file"

          if git diff --cached --quiet; then
            exit 0
          fi

          msg="chore: sync .git-blame-ignore-revs"
          if [ "$added" -gt 0 ]; then
            git commit -m "$msg" -m "Added $added missing revision(s) matching: $subject"
          else
            git commit -m "$msg"
          fi

          git push origin "$branch"
          gh pr create \
            --base "$default_branch" \
            --head "$branch" \
            --title "chore: sync .git-blame-ignore-revs" \
            --body "Adds missing full SHAs for commits on \`${default_branch}\` whose message matches the workflow input \`commit_subject\` (\`${subject}\`). Merge after required checks (e.g. pr-build, CodeQL) pass."
