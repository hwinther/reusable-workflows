name: "Format-and-PR helper (reusable)"

# Multi-formatter helper. Each mode is its own job, gated by `inputs.mode`:
#   mode=cleanupcode       → run `jb cleanupcode` against a .NET solution and
#                            open a PR with the diff.
#   mode=ruff-format       → run `ruff format` against a Python tree and
#                            open a PR with the diff.
#   mode=blame-ignore-revs → after a formatter PR has merged to the default
#                            branch (squash/rebase), sync .git-blame-ignore-revs
#                            from that history and open a PR. Formatter-agnostic;
#                            matches commits by the caller-supplied `commit_subject`.
#
# Caller owns the trigger (workflow_dispatch with a `mode` choice input is the
# expected shape); the job-level `if:` here gates which job runs.

on:
  workflow_call:
    inputs:
      mode:
        required: true
        type: string
        description: "Which job to run: 'cleanupcode', 'ruff-format' or 'blame-ignore-revs'."
      solution_path:
        required: false
        type: string
        description: "Directory containing the .NET solution file (mode=cleanupcode only)."
        default: ''
      solution_name:
        required: false
        type: string
        description: "Solution file name, e.g. Backend.slnx (mode=cleanupcode only)."
        default: ''
      dotnet_version:
        required: false
        type: string
        description: ".NET version, e.g. 10.0.x (mode=cleanupcode only)."
        default: "10.0.x"
      python_version:
        required: false
        type: string
        description: "Python version (mode=ruff-format only), passed to actions/setup-python."
        default: "3.13"
      ruff_version:
        required: false
        type: string
        description: "Ruff version to install with pip (e.g. '0.9.0'). Empty = the latest available."
        default: ''
      target_path:
        required: false
        type: string
        description: "Path `ruff format` runs against (mode=ruff-format only)."
        default: '.'
      commit_subject:
        required: false
        type: string
        description: "Commit subject for the formatter PR (cleanupcode / ruff-format), and the search string for the blame-ignore-revs sync. Ruff callers typically override it, e.g. 'chore: ruff format'."
        default: "chore: ReSharper CleanupCode"
      primary_nuget_source:
        required: false
        type: string
        description: "Primary NuGet feed URL passed to actions/setup-dotnet as source-url. Note: `dotnet tool install JetBrains.ReSharper.GlobalTools` needs nuget.org, so when overriding, point it at a feed that upstreams nuget.org."
        default: ''
      extra_nuget_source:
        required: false
        type: string
        description: "Extra private NuGet feed added with `dotnet nuget add source` before restore."
        default: ''
      extra_nuget_source_name:
        required: false
        type: string
        description: "Name of the extra NuGet source."
        default: ''
      extra_nuget_source_username:
        required: false
        type: string
        description: "Username for `dotnet nuget add source` on the extra source."
        default: 'az'
    secrets:
      nuget_auth_token:
        required: false
        description: "Auth token for the NuGet feeds (NUGET_AUTH_TOKEN for setup-dotnet and --password on the extra source). Empty = GITHUB_TOKEN."

jobs:
  cleanupcode:
    if: ${{ inputs.mode == 'cleanupcode' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true # zizmor: ignore[artipacked] -- a later step pushes a branch

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: ${{ inputs.dotnet_version }}
          source-url: ${{ inputs.primary_nuget_source }}
          cache: true
          cache-dependency-path: ${{ inputs.solution_path != '' && format('{0}/**/packages.lock.json', inputs.solution_path) || '**/packages.lock.json' }}
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.nuget_auth_token != '' && secrets.nuget_auth_token || secrets.GITHUB_TOKEN }}

      - name: Add extra NuGet source
        if: inputs.extra_nuget_source != ''
        uses: hwinther/reusable-workflows/.github/actions/_dotnet-add-nuget-source@v2.36.0
        with:
          extra_nuget_source: ${{ inputs.extra_nuget_source }}
          extra_nuget_source_name: ${{ inputs.extra_nuget_source_name }}
          extra_nuget_source_username: ${{ inputs.extra_nuget_source_username }}
          nuget_auth_token: ${{ secrets.nuget_auth_token != '' && secrets.nuget_auth_token || secrets.GITHUB_TOKEN }}
          working_directory: ${{ inputs.solution_path }}

      - name: Restore
        working-directory: ${{ inputs.solution_path }}
        env:
          SOLUTION_FILE: ${{ inputs.solution_name }}
        run: |
          set -euo pipefail
          dotnet restore --locked-mode "$SOLUTION_FILE"
          if git ls-files --error-unmatch nuget.config > /dev/null 2>&1; then
            git checkout HEAD -- nuget.config
          else
            rm -f nuget.config || true
          fi

      - name: Install JetBrains.ReSharper.GlobalTools
        run: dotnet tool install JetBrains.ReSharper.GlobalTools --global

      - name: Run CleanupCode
        working-directory: ${{ inputs.solution_path }}
        env:
          SOLUTION_FILE: ${{ inputs.solution_name }}
        run: jb cleanupcode "$SOLUTION_FILE"

      - name: Branch, commit, and open pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_SUBJECT: ${{ inputs.commit_subject }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes after CleanupCode; skipping PR."
            exit 0
          fi
          branch="jb/cleanupcode-${GITHUB_RUN_ID}"
          git checkout -b "$branch"
          git add -A
          git commit -m "$COMMIT_SUBJECT"
          git push origin "$branch"
          base_branch="$GITHUB_REF_NAME"
          if [ -z "$(git ls-remote origin "refs/heads/${base_branch}")" ]; then
            base_branch="$DEFAULT_BRANCH"
            echo "::warning::Trigger branch ${GITHUB_REF_NAME} is not on origin; opening PR against ${base_branch}."
          fi
          gh pr create \
            --base "$base_branch" \
            --head "$branch" \
            --title "$COMMIT_SUBJECT" \
            --body "Automated changes from JetBrains [CleanupCode](https://www.jetbrains.com/help/resharper/CleanupCode.html) (\`jb cleanupcode\` via [JetBrains.ReSharper.GlobalTools](https://www.nuget.org/packages/JetBrains.ReSharper.GlobalTools))."

  ruff-format:
    if: ${{ inputs.mode == 'ruff-format' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true # zizmor: ignore[artipacked] -- a later step pushes a branch

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ inputs.python_version }}

      - name: Install Ruff
        env:
          RUFF_VERSION: ${{ inputs.ruff_version }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -n "$RUFF_VERSION" ]; then
            pip install "ruff==$RUFF_VERSION"
          else
            pip install ruff
          fi

      - name: Run ruff format
        env:
          TARGET_PATH: ${{ inputs.target_path }}
        run: ruff format "$TARGET_PATH"

      - name: Branch, commit, and open pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_SUBJECT: ${{ inputs.commit_subject }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes after ruff format; skipping PR."
            exit 0
          fi
          branch="ruff/format-${GITHUB_RUN_ID}"
          git checkout -b "$branch"
          git add -A
          git commit -m "$COMMIT_SUBJECT"
          git push origin "$branch"
          base_branch="$GITHUB_REF_NAME"
          if [ -z "$(git ls-remote origin "refs/heads/${base_branch}")" ]; then
            base_branch="$DEFAULT_BRANCH"
            echo "::warning::Trigger branch ${GITHUB_REF_NAME} is not on origin; opening PR against ${base_branch}."
          fi
          gh pr create \
            --base "$base_branch" \
            --head "$branch" \
            --title "$COMMIT_SUBJECT" \
            --body "Automated changes from [Ruff](https://docs.astral.sh/ruff/) (\`ruff format\`)."

  sync-git-blame-ignore-revs:
    if: ${{ inputs.mode == 'blame-ignore-revs' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true # zizmor: ignore[artipacked] -- a later step pushes a branch
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync .git-blame-ignore-revs from formatter commits on default branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_SUBJECT: ${{ inputs.commit_subject }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          default_branch="$DEFAULT_BRANCH"
          git fetch origin --prune
          git checkout "$default_branch"
          git reset --hard "origin/${default_branch}"

          subject="$COMMIT_SUBJECT"
          mapfile -t cleanup_shas < <(git log "$default_branch" --reverse --fixed-strings --grep="$subject" --pretty=format:%H || true)
          if [ "${#cleanup_shas[@]}" -eq 0 ] || [ -z "${cleanup_shas[0]:-}" ]; then
            echo "No commits on ${default_branch} match the formatter subject (merge the formatter PR first, or ensure the squash/rebase title still contains: ${subject})."
            exit 0
          fi

          ignore_file=".git-blame-ignore-revs"
          header="# Revisions listed here are ignored by git blame (see https://git-scm.com/docs/git-blame#Documentation/git-blame.txt-ignoreRevsFile)"
          declare -A seen=()
          declare -a existing_shas=()
          comment_block=""

          if [ -f "$ignore_file" ]; then
            while IFS= read -r line || [ -n "$line" ]; do
              if [[ "$line" =~ ^[0-9a-f]{40}$ ]]; then
                break
              fi
              comment_block+="${line}"$'\n'
            done < "$ignore_file"
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              if [ -z "${seen[$line]:-}" ]; then
                existing_shas+=("$line")
                seen["$line"]=1
              fi
            done < <(grep -E '^[0-9a-f]{40}$' "$ignore_file" || true)
          fi

          added=0
          for sha in "${cleanup_shas[@]}"; do
            if [ -z "$sha" ]; then
              continue
            fi
            if [ -z "${seen[$sha]:-}" ]; then
              existing_shas+=("$sha")
              seen["$sha"]=1
              added=$((added + 1))
            fi
          done

          sort_shas_chronologically() {
            for sha in "$@"; do
              [ -n "$sha" ] || continue
              ts="$(git log -1 --format=%ct "$sha" 2>/dev/null || echo "0")"
              printf '%s %s\n' "$ts" "$sha"
            done | sort -n | cut -d' ' -f2-
          }

          mapfile -t sorted_shas < <(sort_shas_chronologically "${existing_shas[@]}")

          tmpfile="$(mktemp)"
          if [ -n "$comment_block" ]; then
            printf '%s' "$comment_block" > "$tmpfile"
          else
            printf '%s\n\n' "$header" > "$tmpfile"
          fi
          for sha in "${sorted_shas[@]}"; do
            printf '%s\n' "$sha" >> "$tmpfile"
          done

          if [ -f "$ignore_file" ] && cmp -s "$ignore_file" "$tmpfile"; then
            echo ".git-blame-ignore-revs already lists all matching formatter commits."
            rm -f "$tmpfile"
            exit 0
          fi

          # Legacy branch prefix `jb/` kept to avoid churning consumer-side
          # branch-protection patterns; this job is formatter-agnostic.
          branch="jb/blame-ignore-revs-${GITHUB_RUN_ID}"
          git checkout -b "$branch"

          mv "$tmpfile" "$ignore_file"
          git add "$ignore_file"

          if git diff --cached --quiet; then
            exit 0
          fi

          msg="chore: sync .git-blame-ignore-revs"
          if [ "$added" -gt 0 ]; then
            git commit -m "$msg" -m "Added $added missing revision(s) matching: $subject"
          else
            git commit -m "$msg"
          fi

          git push origin "$branch"
          gh pr create \
            --base "$default_branch" \
            --head "$branch" \
            --title "chore: sync .git-blame-ignore-revs" \
            --body "Adds missing full SHAs for commits on \`${default_branch}\` whose message matches the workflow input \`commit_subject\` (\`${subject}\`). Merge after required checks (e.g. pr-build, CodeQL) pass."
