name: "Prune GHCR images (reusable)"

# Deletes:
#   - untagged manifests that are NOT OCI 1.1 referrers (i.e. not attestations
#     pointing at another image via .subject.digest) and not a child of an
#     index (multi-arch platform manifests follow their index)
#   - tagged manifests whose only tags are GitVersion prerelease semvers
#     (X.Y.Z-<label>.<n>) for branches that no longer exist on origin
#   - tagged manifests whose only tags belong to a closed pull request: pr-<N>
#     (and pr-<N>-<anything>), or a prerelease whose label is the PR form
#     GitVersion emits for refs/pull/<N>/merge builds (PullRequest<N>). Tags of
#     open PRs are kept, so running previews keep their pinned digests.
#   - signatures and attestations whose parent manifest is being deleted in the
#     same run or no longer exists: cosign legacy sha256-XXXX.{sig,att,sbom}
#     tags, OCI referrers-tag indexes (bare sha256-XXXX tags), and untagged OCI
#     1.1 referrers (.subject.digest)
#
# Anything unrecognised is KEPT (fail-safe).
#
# Auth note:
#   For USER-scoped GHCR namespaces, the caller's GITHUB_TOKEN can DELETE
#   versions only when each package has "Inherit access from source repository"
#   enabled (GHCR's default when first pushed from a workflow). If deletion
#   403s, the caller should pass GHCR_PRUNE_TOKEN — a PAT with the
#   `delete:packages` scope (and `read:packages` if you want auto-discovery
#   to enumerate private user packages).

on:
  workflow_call:
    inputs:
      dry_run:
        description: "When false, actually delete versions. When true, only print what would be deleted."
        type: boolean
        required: true
      images:
        description: "Comma-separated GHCR package names to prune (e.g. 'clutterstock/api,clutterstock/migrator'). Blank = auto-discover via the API."
        type: string
        required: false
        default: ""
      package_namespace_prefix:
        description: "When auto-discovering, filter the result to package names starting with this prefix (e.g. 'clutterstock/'). Blank = no filter."
        type: string
        required: false
        default: ""
      nuke_package:
        description: >-
          DESTRUCTIVE. When set to a package name (e.g. 'proxmox/scratch'), DELETE the entire
          package and every version in one shot, then exit. The smart-prune logic does not run.
          dry_run=true makes this a no-op print. Refused on non-workflow_dispatch events, so
          cron callers are unaffected even if they wire the input through.
        type: string
        required: false
        default: ""
    secrets:
      GHCR_PRUNE_TOKEN:
        description: "Optional PAT with delete:packages (and read:packages for discovery). Falls back to GITHUB_TOKEN when not set."
        required: false

jobs:
  prune:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      pull-requests: read  # open-PR lookup for pr-<N> / PullRequest<N> tags
    env:
      OWNER: ${{ github.repository_owner }}
      REPO: ${{ github.repository }}
      DRY_RUN: ${{ inputs.dry_run }}
      IMAGES_INPUT: ${{ inputs.images }}
      NAMESPACE_PREFIX: ${{ inputs.package_namespace_prefix }}
      GH_TOKEN: ${{ secrets.GHCR_PRUNE_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - name: Nuke single package (destructive)
        if: inputs.nuke_package != ''
        env:
          NUKE_PACKAGE: ${{ inputs.nuke_package }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            echo "::error::nuke_package may only be used from workflow_dispatch (got $EVENT_NAME)."
            exit 1
          fi
          enc=$(jq -rn --arg s "$NUKE_PACKAGE" '$s|@uri')
          echo "::warning::NUKE requested for package '$NUKE_PACKAGE' (owner=$OWNER, dry_run=$DRY_RUN)"
          if [ "$DRY_RUN" = "true" ]; then
            echo "DRY-RUN: would DELETE /users/$OWNER/packages/container/$enc"
            {
              echo "## Nuke summary"
              echo
              echo "- package: \`$NUKE_PACKAGE\`"
              echo "- dry_run: \`true\` (no API call made)"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! gh api -X DELETE "/users/$OWNER/packages/container/$enc" 2>/tmp/nuke.err; then
            echo "::error::Failed to delete package '$NUKE_PACKAGE'"
            cat /tmp/nuke.err >&2
            exit 1
          fi
          echo "DELETED package $NUKE_PACKAGE"
          {
            echo "## Nuke summary"
            echo
            echo "- package: \`$NUKE_PACKAGE\` — **DELETED**"
            echo "- dry_run: \`false\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Show config
        if: inputs.nuke_package == ''
        run: |
          echo "trigger=${{ github.event_name }}"
          echo "owner=$OWNER"
          echo "repo=$REPO"
          echo "dry_run=$DRY_RUN"
          echo "images_input=$IMAGES_INPUT"
          echo "namespace_prefix=$NAMESPACE_PREFIX"
          echo "token_source=${{ secrets.GHCR_PRUNE_TOKEN != '' && 'GHCR_PRUNE_TOKEN' || 'GITHUB_TOKEN' }}"
          if [ -z "$IMAGES_INPUT" ] && [ -z "$NAMESPACE_PREFIX" ]; then
            echo "::warning::package_namespace_prefix is empty — pruner will enumerate ALL container packages owned by $OWNER."
          fi

      - name: Compute live branch labels
        if: inputs.nuke_package == ''
        id: live
        run: |
          set -euo pipefail
          OWNER_LC=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          gh api "repos/$REPO/branches" --paginate --jq '.[].name' > /tmp/live-branches.txt
          # Approximate GitVersion's branch -> prerelease-label sanitisation:
          # lowercase, replace any character that isn't [a-z0-9-] with '-',
          # strip a trailing '-', and fall back to literal 'branch' when the
          # result is empty. Both extra steps only widen the live-label set
          # (never narrow it) so they cannot introduce a false PRUNE relative
          # to the prior behaviour. We deliberately do NOT length-truncate
          # here — GitVersion's default config does not, so truncating would
          # narrow the set and risk false PRUNE on long branches.
          : > /tmp/live-labels.txt
          while read -r b; do
            s=$(echo "$b" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g')
            s=${s%-}
            [ -z "$s" ] && s="branch"
            echo "$s"
          done < /tmp/live-branches.txt | sort -u > /tmp/live-labels.txt
          echo "Live branches:"; cat /tmp/live-branches.txt
          echo "Live labels:";   cat /tmp/live-labels.txt
          echo "owner_lc=$OWNER_LC" >> "$GITHUB_OUTPUT"

      - name: Compute open pull requests
        if: inputs.nuke_package == ''
        run: |
          set -euo pipefail
          # A failed lookup fails the run: without it every PR tag would read as closed.
          gh api "repos/$REPO/pulls?state=open" --paginate --jq '.[].number' | sort -u > /tmp/open-prs.txt
          echo "Open PRs:"; cat /tmp/open-prs.txt

      - name: Discover packages
        if: inputs.nuke_package == ''
        run: |
          set -euo pipefail
          if [ -n "$IMAGES_INPUT" ]; then
            echo "$IMAGES_INPUT" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | grep -v '^$' > /tmp/packages.txt
          else
            # Auto-discover. An empty NAMESPACE_PREFIX matches all packages.
            gh api "/users/$OWNER/packages?package_type=container" --paginate \
              --jq '.[].name' \
              | grep "^${NAMESPACE_PREFIX}" > /tmp/packages.txt || true
          fi
          if [ ! -s /tmp/packages.txt ]; then
            echo "No packages in scope. Nothing to do."
          else
            echo "Packages in scope:"; cat /tmp/packages.txt
          fi

      - name: Prune
        if: inputs.nuke_package == ''
        env:
          OWNER_LC: ${{ steps.live.outputs.owner_lc }}
        run: |
          set -euo pipefail

          if [ ! -s /tmp/packages.txt ]; then
            echo "No packages — skipping."
            exit 0
          fi

          # Registry reads need a registry token. Exchange the GitHub token for
          # a pull-scoped one per package, as docker login does. (Sending the
          # GitHub token itself as the Bearer made every manifest fetch fail,
          # so untagged versions were all kept as manifest-fetch-failed.)
          registry_token() {
            curl -sS --fail -u "$OWNER_LC:$GH_TOKEN" \
              "https://ghcr.io/token?service=ghcr.io&scope=repository:$OWNER_LC/$1:pull" \
              | jq -r '.token // empty'
          }

          fetch_manifest() {
            # Prints the manifest JSON; returns non-zero if it cannot be read.
            local pkg="$1" digest="$2"
            if ! curl -sS --fail \
                -H "Authorization: Bearer $REGISTRY_TOKEN" \
                -H "Accept: application/vnd.oci.image.manifest.v1+json, application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.v2+json, application/vnd.docker.distribution.manifest.list.v2+json" \
                "https://ghcr.io/v2/$OWNER_LC/$pkg/manifests/$digest" 2>/tmp/fetch.err; then
              # Log the first failure per package (stderr: stdout is the caller's).
              if [ ! -e /tmp/fetch-failed-logged ]; then
                echo "  WARN: manifest fetch failed for $digest: $(cat /tmp/fetch.err)" >&2
                touch /tmp/fetch-failed-logged
              fi
              return 1
            fi
          }

          fetch_manifest_classification() {
            # Echoes one of:
            #   attestation:<subject-digest>   (OCI 1.1 referrer — follows its subject)
            #   orphan                         (untagged, not a referrer — prune,
            #                                   unless pass 1b finds it in an index)
            #   fetch-failed                   (network/auth blip — fail-safe keep)
            local pkg="$1" digest="$2"
            local resp
            if ! resp=$(fetch_manifest "$pkg" "$digest"); then
              echo "fetch-failed"
              return 0
            fi
            local subj
            subj=$(echo "$resp" | jq -r '.subject.digest // ""')
            if [ -n "$subj" ]; then
              echo "attestation:$subj"
            else
              echo "orphan"
            fi
          }

          delete_version() {
            local pkg="$1" id="$2" enc
            enc=$(jq -rn --arg s "$pkg" '$s|@uri')
            if [ "$DRY_RUN" = "true" ]; then
              echo "    DRY-RUN: would DELETE id=$id"
              return 0
            fi
            if ! gh api -X DELETE "/users/$OWNER/packages/container/$enc/versions/$id" 2>/tmp/del.err; then
              echo "    ERROR deleting id=$id:" >&2
              cat /tmp/del.err >&2
              return 1
            fi
            echo "    DELETED id=$id"
          }

          TOTAL_KEEP=0
          TOTAL_PRUNE=0
          ANY_FAILED=0
          : > /tmp/summary.md

          while read -r pkg; do
            [ -z "$pkg" ] && continue
            echo
            echo "=== $pkg ==="
            enc=$(jq -rn --arg s "$pkg" '$s|@uri')
            rm -f /tmp/fetch-failed-logged
            if ! REGISTRY_TOKEN=$(registry_token "$pkg") || [ -z "$REGISTRY_TOKEN" ]; then
              # Untagged versions then classify as manifest-fetch-failed (KEEP).
              echo "  WARN: no registry token for $pkg"
              REGISTRY_TOKEN=""
            fi

            if ! gh api "/users/$OWNER/packages/container/$enc/versions" --paginate \
                --jq '.[] | {id, name, tags: (.metadata.container.tags // [])}' \
                > /tmp/versions.json 2>/tmp/versions.err; then
              if grep -q 'HTTP 404' /tmp/versions.err; then
                echo "  Package not found — skipping."
                continue
              fi
              echo "  Error listing versions:" >&2
              cat /tmp/versions.err >&2
              exit 1
            fi
            COUNT=$(wc -l < /tmp/versions.json | tr -d ' ')
            echo "  $COUNT versions"

            # Pass 1: classify each version.
            # Layout: id<TAB>verdict<TAB>reason<TAB>digest<TAB>tags(comma)
            : > /tmp/verdicts.tsv
            while IFS= read -r v; do
              id=$(echo "$v" | jq -r '.id')
              digest=$(echo "$v" | jq -r '.name')
              tags_csv=$(echo "$v" | jq -r '.tags | join(",")')

              if [ -z "$tags_csv" ]; then
                cls=$(fetch_manifest_classification "$pkg" "$digest")
                case "$cls" in
                  attestation:*)
                    # Follows its subject in pass 2.
                    printf '%s\t%s\t%s\t%s\t%s\n' "$id" "DEFER" "$cls" "$digest" "" >> /tmp/verdicts.tsv ;;
                  fetch-failed)
                    printf '%s\t%s\t%s\t%s\t%s\n' "$id" "KEEP" "manifest-fetch-failed" "$digest" "" >> /tmp/verdicts.tsv ;;
                  orphan)
                    printf '%s\t%s\t%s\t%s\t%s\n' "$id" "PRUNE" "untagged-orphan" "$digest" "" >> /tmp/verdicts.tsv ;;
                esac
                continue
              fi

              # Tagged. If every tag is sha256-XXXX[.{sig,att,sbom}], defer: the
              # legacy cosign tags and the OCI referrers-tag fallback index
              # (bare sha256-XXXX) both name their parent digest.
              all_sigatt=true
              n_tags=0
              for t in $(echo "$v" | jq -r '.tags[]'); do
                n_tags=$((n_tags + 1))
                if ! echo "$t" | grep -Eq '^sha256-[a-f0-9]{64}(\.(sig|att|sbom))?$'; then
                  all_sigatt=false; break
                fi
              done
              # tags_csv is non-empty, so zero iterations means the tags did not parse.
              [ "$n_tags" -eq 0 ] && all_sigatt=false
              if [ "$all_sigatt" = "true" ]; then
                printf '%s\t%s\t%s\t%s\t%s\n' "$id" "DEFER" "sig-att-tag" "$digest" "$tags_csv" >> /tmp/verdicts.tsv
                continue
              fi

              # Vote per tag — KEEP wins ties (fail-safe).
              keep=false
              reasons=""
              for t in $(echo "$v" | jq -r '.tags[]'); do
                if [ "$t" = "latest" ]; then
                  keep=true; reasons="$reasons latest"; continue
                fi
                if echo "$t" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
                  keep=true; reasons="$reasons release($t)"; continue
                fi
                # PR-scoped: pr-<N>[-…] or a PullRequest<N> prerelease label.
                pr=""
                if echo "$t" | grep -Eq '^pr-[0-9]+(-.+)?$'; then
                  pr=$(echo "$t" | sed -E 's/^pr-([0-9]+).*$/\1/')
                elif echo "$t" | grep -Eiq '^[0-9]+\.[0-9]+\.[0-9]+-pull-?request-?[0-9]+\.[0-9]+$'; then
                  pr=$(echo "$t" | sed -E 's/^[0-9]+\.[0-9]+\.[0-9]+-[A-Za-z-]+([0-9]+)\.[0-9]+$/\1/')
                fi
                if [ -n "$pr" ]; then
                  if grep -Fxq "$pr" /tmp/open-prs.txt; then
                    keep=true; reasons="$reasons open-pr($pr)"; continue
                  else
                    reasons="$reasons closed-pr($pr)"; continue
                  fi
                fi
                if echo "$t" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-.+\.[0-9]+$'; then
                  label=$(echo "$t" | sed -E 's/^[0-9]+\.[0-9]+\.[0-9]+-(.+)\.[0-9]+$/\1/')
                  if grep -Fxq "$label" /tmp/live-labels.txt; then
                    keep=true; reasons="$reasons live-branch($label)"; continue
                  else
                    reasons="$reasons dead-branch($label)"; continue
                  fi
                fi
                # Unrecognised tag — fail-safe KEEP.
                keep=true; reasons="$reasons unknown-tag($t)"
              done
              if [ -z "$reasons" ]; then
                # No tag was voted on although tags_csv is set: the tags did not parse.
                keep=true; reasons="tags-unparsed"
              fi
              if [ "$keep" = "true" ]; then
                printf '%s\t%s\t%s\t%s\t%s\n' "$id" "KEEP" "${reasons# }" "$digest" "$tags_csv" >> /tmp/verdicts.tsv
              else
                printf '%s\t%s\t%s\t%s\t%s\n' "$id" "PRUNE" "${reasons# }" "$digest" "$tags_csv" >> /tmp/verdicts.tsv
              fi
            done < /tmp/versions.json

            # Pass 1b: the platform manifests (and buildx attestation
            # manifests) of a multi-arch index are untagged and have no
            # subject, so they look like orphans. Collect the children of every
            # tagged index and make them follow their index in pass 2. If any
            # tagged manifest cannot be read, its children are unknown, so no
            # untagged version is pruned as an orphan.
            : > /tmp/children.tsv
            children_unknown=false
            while IFS=$'\t' read -r _id _verdict _reason digest tags_csv; do
              [ -n "$tags_csv" ] || continue
              if ! resp=$(fetch_manifest "$pkg" "$digest"); then
                children_unknown=true
                continue
              fi
              echo "$resp" | jq -r --arg p "$digest" '.manifests[]? | "\(.digest)\t\($p)"' >> /tmp/children.tsv
            done < /tmp/verdicts.tsv
            echo "  index children: $(wc -l < /tmp/children.tsv | tr -d ' ')"
            awk -F'\t' -v OFS='\t' -v unknown="$children_unknown" '
              FILENAME==ARGV[1] { parent[$1]=$2; next }
              $2=="PRUNE" && $3=="untagged-orphan" {
                if ($4 in parent) { $2="DEFER"; $3="index-child:" parent[$4] }
                else if (unknown=="true") { $2="KEEP"; $3="index-children-unknown" }
              }
              { print }
            ' /tmp/children.tsv /tmp/verdicts.tsv > /tmp/verdicts.1b.tsv
            mv /tmp/verdicts.1b.tsv /tmp/verdicts.tsv

            # Pass 2: resolve DEFER rows (signature tags and untagged referrers)
            # by looking up the parent digest's verdict in the rows we just
            # wrote. A parent that is not in the package at all was deleted
            # earlier, so its signatures go too. A parent that is itself a
            # DEFER row is KEPT (fail-safe).
            awk -F'\t' '$2!="DEFER"' /tmp/verdicts.tsv > /tmp/verdicts.final.tsv
            awk -F'\t' '$2=="DEFER"'  /tmp/verdicts.tsv > /tmp/verdicts.defer.tsv
            while IFS=$'\t' read -r id _verdict reason digest tags_csv; do
              if [ -z "$tags_csv" ]; then
                # attestation:<subject> or index-child:<index>
                parent_digest=${reason#*:}
              else
                first=$(echo "$tags_csv" | tr ',' '\n' | head -1)
                parent_digest="sha256:$(echo "$first" | sed -E 's/^sha256-([a-f0-9]{64}).*/\1/')"
              fi
              parent_short=${parent_digest#sha256:}
              parent_short=${parent_short:0:12}
              parent_verdict=$(awk -F'\t' -v d="$parent_digest" '$4==d {print $2; exit}' /tmp/verdicts.tsv)
              if ! echo "$parent_digest" | grep -Eq '^sha256:[a-f0-9]{64}$'; then
                # Could not read a parent digest: never treat that as parent-gone.
                printf '%s\t%s\t%s\t%s\t%s\n' "$id" "KEEP" "parent-unparsed" "$digest" "$tags_csv" >> /tmp/verdicts.final.tsv
              elif [ "$parent_verdict" = "PRUNE" ]; then
                printf '%s\t%s\t%s\t%s\t%s\n' "$id" "PRUNE" "follows-parent-prune($parent_short)" "$digest" "$tags_csv" >> /tmp/verdicts.final.tsv
              elif [ -z "$parent_verdict" ]; then
                printf '%s\t%s\t%s\t%s\t%s\n' "$id" "PRUNE" "parent-gone($parent_short)" "$digest" "$tags_csv" >> /tmp/verdicts.final.tsv
              else
                printf '%s\t%s\t%s\t%s\t%s\n' "$id" "KEEP"  "follows-parent-keep($parent_short)"  "$digest" "$tags_csv" >> /tmp/verdicts.final.tsv
              fi
            done < /tmp/verdicts.defer.tsv
            mv /tmp/verdicts.final.tsv /tmp/verdicts.tsv

            keep_n=$(awk -F'\t' '$2=="KEEP"'  /tmp/verdicts.tsv | wc -l | tr -d ' ')
            prune_n=$(awk -F'\t' '$2=="PRUNE"' /tmp/verdicts.tsv | wc -l | tr -d ' ')
            echo "  KEEP=$keep_n PRUNE=$prune_n"
            # Verdicts by reason, with the digest/label/PR detail stripped.
            awk -F'\t' '{print $2 "\t" $3}' /tmp/verdicts.tsv \
              | sed -E 's/\([^)]*\)//g; s/:sha256:[a-f0-9]+//' | sort | uniq -c | sed 's/^/   /'
            TOTAL_KEEP=$((TOTAL_KEEP + keep_n))
            TOTAL_PRUNE=$((TOTAL_PRUNE + prune_n))

            {
              echo "### $pkg"
              echo
              echo "| | count |"
              echo "|---|---:|"
              echo "| Total | $COUNT |"
              echo "| KEEP  | $keep_n |"
              echo "| PRUNE | $prune_n |"
              echo
            } >> /tmp/summary.md

            # Print every PRUNE row, then delete (or pretend to).
            while IFS=$'\t' read -r id verdict reason digest tags_csv; do
              [ "$verdict" = "PRUNE" ] || continue
              echo "  PRUNE id=$id digest=$digest tags=[$tags_csv] reason=$reason"
              if ! delete_version "$pkg" "$id"; then
                ANY_FAILED=1
              fi
            done < /tmp/verdicts.tsv
          done < /tmp/packages.txt

          {
            echo "## Prune summary"
            echo
            echo "- dry_run: \`$DRY_RUN\`"
            echo "- trigger: \`${{ github.event_name }}\`"
            echo "- TOTAL KEEP: $TOTAL_KEEP"
            echo "- TOTAL PRUNE: $TOTAL_PRUNE"
            echo
            cat /tmp/summary.md
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$ANY_FAILED" -ne 0 ]; then
            echo "::error::One or more deletions failed."
            exit 1
          fi
