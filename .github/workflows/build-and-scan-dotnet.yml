name: "Build and scan dotnet container (no push)"

# PR-time companion to dotnet-container.yml. Produces the same image content
# (tagged with the same gitversion refs, no registry prefix) but does NOT
# push. Uploads the loaded image as a workflow artifact so a downstream job
# can run e2e tests against it and, conditionally, push the same
# byte-identical image.

on:
  workflow_call:
    inputs:
      dotnet_version:
        description: ".NET version, e.g. 10.0.x"
        required: true
        type: string
      solution_path:
        description: "Solution path, e.g. backend"
        required: true
        type: string
      solution_file:
        description: "Solution file, e.g. ProjectName.slnx"
        required: true
        type: string
      project_file:
        description: "Project file, e.g. src/Api/Api.csproj"
        required: true
        type: string
      cache_enabled:
        description: "Enable NuGet package caching, requires dotnet lockfiles"
        required: false
        type: boolean
        default: true
      container_registry:
        description: "Container registry, e.g. ghcr.io"
        required: false
        type: string
        default: "ghcr.io"
      container_image_name_postfix:
        description: "Container image name postfix, e.g. api"
        required: true
        type: string
      override_config:
        description: "Override config"
        required: false
        type: string
        default: ""
      grype_scan_enabled:
        description: "Run Anchore Grype vulnerability scan (SBOM is still generated when false)"
        required: false
        type: boolean
        default: true
      grype_severity_cutoff:
        description: "Grype severity-cutoff (fail on this level and above)"
        required: false
        type: string
        default: high
      grype_only_fixed:
        description: "Grype only-fixed: only report vulnerabilities that have a fix available"
        required: false
        type: boolean
        default: true
      grype_fail_build:
        description: "Grype fail-build mode: 'auto' (fail on every event except pull_request — PRs get report/SARIF only), 'always' (fail whenever vulnerabilities meet severity-cutoff), or 'never' (report/SARIF only). Replaces the former boolean: migrate true->'always' (or 'auto'), false->'never'."
        required: false
        type: string
        default: auto
      code_scanning_upload_enabled:
        description: "Upload the Grype SARIF to GitHub Code Scanning. Set to false on private repositories without GitHub Advanced Security; findings still go to the job summary, the PR comment, and the severity gate."
        required: false
        type: boolean
        default: true
      release_asset_upload_enabled:
        description: "Attach generated SBOMs to a matching GitHub Release as release assets (anchore/sbom-action default on tag pushes). Requires `contents: write` — set to false on private repos / workflows where the build job only has `contents: read`. SBOMs are still uploaded as workflow artifacts when false; only the release-asset attachment is skipped."
        required: false
        type: boolean
        default: true
      generate_supply_chain_artifacts:
        description: "Generate CycloneDX SBOM and Grype JSON for downstream cosign attestations in image-push.yml"
        required: false
        type: boolean
        default: true
      artifact_retention_days:
        description: "Retention period for the image, SBOM, and Grype JSON artifacts."
        required: false
        type: number
        default: 1
      artifact_name_suffix:
        description: "Optional suffix appended to scan-related artifact names inside `_scan-image` (SPDX/CycloneDX SBOM workflow artifacts, SARIF category, PR-comment identifier). Use when calling this workflow from a build matrix — pass the matrix dimension value (for example the matrix.debian_release expression evaluated at the call site). NOTE: the workflow-level `image_artifact`, `sbom_artifact`, and `grype_artifact` outputs are still derived from `container_image_name_postfix` alone, so matrix callers that also hand the image off to downstream jobs (e.g. image-push.yml) need to disambiguate those names themselves (typically by giving each matrix entry a distinct `container_image_name_postfix`)."
        required: false
        type: string
        default: ""
      primary_nuget_source:
        description: "Primary NuGet source URL passed to actions/setup-dotnet via source-url."
        required: false
        type: string
        default: ""
      extra_nuget_source:
        description: "Additional private NuGet feed URL added via `dotnet nuget add source` before restore."
        required: false
        type: string
        default: ""
      extra_nuget_source_name:
        description: "Name for the extra NuGet source."
        required: false
        type: string
        default: ""
      extra_nuget_source_username:
        description: "Username for `dotnet nuget add source` on the extra source."
        required: false
        type: string
        default: "az"
    secrets:
      nuget_auth_token:
        description: "Auth token for NuGet feeds (NUGET_AUTH_TOKEN for setup-dotnet primary source and --password for the extra source). When unset, falls back to GITHUB_TOKEN."
        required: false
    outputs:
      image_artifact:
        description: "Workflow artifact name holding the gzipped tarball of the built image."
        value: ${{ jobs['build-and-scan'].outputs.image_artifact }}
      sbom_artifact:
        description: "Workflow artifact name holding the CycloneDX SBOM uploaded by _scan-image (the predicate sign-image consumes). Single-format artifact since v1.55.0 (the previous bundled SPDX+CycloneDX zip is gone)."
        value: ${{ jobs['build-and-scan'].outputs.sbom_artifact }}
      sbom_spdx_artifact:
        description: "Workflow artifact name holding the SPDX SBOM uploaded by _scan-image. New in v1.55.0."
        value: ${{ jobs['build-and-scan'].outputs.sbom_spdx_artifact }}
      grype_artifact:
        description: "Workflow artifact name holding the Grype JSON for cosign vuln attestation (empty when generate_supply_chain_artifacts=false). Now references the canonical _scan-image artifact name; the previous build-and-scan-${postfix}-grype artifact is gone."
        value: ${{ jobs['build-and-scan'].outputs.grype_artifact }}
      sbom_cyclonedx_sha256:
        description: "sha256 of the CycloneDX SBOM file uploaded under sbom_artifact. Pass to image-push.yml or sign-image so the consumer-side sign job can verify the predicate has not been swapped between jobs."
        value: ${{ jobs['build-and-scan'].outputs.sbom_cyclonedx_sha256 }}
      grype_json_sha256:
        description: "sha256 of the Grype JSON file uploaded under grype_artifact. Pass to image-push.yml or sign-image for cross-job integrity verification."
        value: ${{ jobs['build-and-scan'].outputs.grype_json_sha256 }}
      container_image_tags:
        description: "Full image refs that will be used when pushing (registry/name:tag, comma-separated)."
        value: ${{ jobs.gitversion.outputs.container_image_tags }}
      image_tags:
        description: "Image tags only (semicolon-separated)."
        value: ${{ jobs.gitversion.outputs.image_tags }}
      image_digest:
        description: "Local image digest (sha256:...) of the built image. Used by image-push.yml for byte-identity assertion."
        value: ${{ jobs['build-and-scan'].outputs.image_digest }}
      version:
        description: "GitVersion-derived version string."
        value: ${{ jobs.gitversion.outputs.version }}
      is_alpha:
        description: "Whether the build is from a feature/bugfix branch (string 'true'/'false')."
        value: ${{ jobs.gitversion.outputs.is_alpha }}

jobs:
  prepare-repository-name:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      repository: ${{ steps.lower-repo.outputs.repository }}
    steps:
      - id: lower-repo
        run: |
          echo "repository=${GITHUB_REPOSITORY@L}" >> $GITHUB_OUTPUT

  gitversion:
    needs: prepare-repository-name
    permissions:
      contents: read
    uses: hwinther/reusable-workflows/.github/workflows/gitversion.yml@v2.0.0
    with:
      container_registry: ${{ inputs.container_registry }}
      container_image_name: ${{ needs.prepare-repository-name.outputs.repository }}/${{ inputs.container_image_name_postfix }}
      override_config: ${{ inputs.override_config }}

  build-and-scan:
    name: Build and scan (${{ needs.gitversion.outputs.container_image_tags }})
    needs: [prepare-repository-name, gitversion]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write
      pull-requests: write  # for the Grype findings PR comment via _grype-summary
    outputs:
      image_artifact: ${{ steps.save.outputs.artifact_name }}
      image_digest: ${{ steps.save.outputs.image_digest }}
      # SBOM + Grype artifacts are uploaded by _scan-image directly (since v1.53.0 for
      # Grype, since forever for SBOMs via anchore/sbom-action's artifact-name). v1.55.0
      # drops the duplicate build-and-scan-${postfix}-{sboms,grype} uploads this job used
      # to do — these outputs now forward _scan-image's canonical artifact names.
      sbom_artifact: ${{ inputs.generate_supply_chain_artifacts && steps.scan.outputs.cyclonedx_artifact_name || '' }}
      sbom_spdx_artifact: ${{ steps.scan.outputs.spdx_artifact_name }}
      grype_artifact: ${{ inputs.generate_supply_chain_artifacts && steps.scan.outputs.grype_artifact_name || '' }}
      sbom_cyclonedx_sha256: ${{ steps.predicate-hashes.outputs.sbom_cyclonedx_sha256 }}
      grype_json_sha256: ${{ steps.predicate-hashes.outputs.grype_json_sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Log in to GitHub Container Registry (for base-image pulls)
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ inputs.container_registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build dotnet container (publish to archive, load locally)
        id: build
        uses: hwinther/reusable-workflows/.github/actions/_build-image-dotnet@v2.0.0
        with:
          dotnet_version: ${{ inputs.dotnet_version }}
          solution_path: ${{ inputs.solution_path }}
          solution_file: ${{ inputs.solution_file }}
          project_file: ${{ inputs.project_file }}
          cache_enabled: ${{ inputs.cache_enabled }}
          image_tags: ${{ needs.gitversion.outputs.image_tags }}
          repository: ${{ needs.prepare-repository-name.outputs.repository }}
          container_image_name_postfix: ${{ inputs.container_image_name_postfix }}
          version: ${{ needs.gitversion.outputs.version }}
          git_sha: ${{ github.sha }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          nuget_auth_token: ${{ secrets.nuget_auth_token }}
          primary_nuget_source: ${{ inputs.primary_nuget_source }}
          extra_nuget_source: ${{ inputs.extra_nuget_source }}
          extra_nuget_source_name: ${{ inputs.extra_nuget_source_name }}
          extra_nuget_source_username: ${{ inputs.extra_nuget_source_username }}

      - name: Generate SBOM and scan with Grype
        id: scan
        uses: hwinther/reusable-workflows/.github/actions/_scan-image@v2.0.0
        with:
          image_ref: ${{ steps.build.outputs.local_ref }}
          container_image_name_postfix: ${{ inputs.container_image_name_postfix }}
          artifact_name_suffix: ${{ inputs.artifact_name_suffix }}
          grype_scan_enabled: ${{ inputs.grype_scan_enabled }}
          grype_severity_cutoff: ${{ inputs.grype_severity_cutoff }}
          grype_only_fixed: ${{ inputs.grype_only_fixed }}
          grype_fail_build: ${{ inputs.grype_fail_build == 'always' || (inputs.grype_fail_build == 'auto' && github.event_name != 'pull_request') }}
          code_scanning_upload_enabled: ${{ inputs.code_scanning_upload_enabled }}
          release_asset_upload_enabled: ${{ inputs.release_asset_upload_enabled }}
          cosign_supply_chain_attest_enabled: ${{ inputs.generate_supply_chain_artifacts }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Save image as workflow artifact
        id: save
        uses: hwinther/reusable-workflows/.github/actions/_save-image-artifact@v2.0.0
        with:
          image_ref: ${{ steps.build.outputs.local_ref }}
          artifact_name: build-and-scan-${{ inputs.container_image_name_postfix }}-image
          retention_days: ${{ inputs.artifact_retention_days }}

      # _scan-image uploads the SPDX+CycloneDX SBOMs (via anchore/sbom-action's
      # artifact-name field) and the Grype JSON (since v1.53.0) under matrix-safe
      # canonical names — see the sbom_artifact / sbom_spdx_artifact / grype_artifact
      # workflow outputs above. v1.55.0 dropped the duplicate upload-sboms /
      # upload-grype steps this job used to do.

      # Hash the SBOM and Grype JSON so a downstream sign job (image-push.yml
      # or sign-image composite) can verify the predicate hasn't been swapped
      # in transit. Job outputs travel through the actions service plan, not
      # through artifact storage, so they share the same trust root as the
      # image_digest assertion above.
      - name: Hash supply-chain predicates
        id: predicate-hashes
        if: ${{ inputs.generate_supply_chain_artifacts }}
        shell: bash
        env:
          CYCLONEDX_PATH: ${{ steps.scan.outputs.sbom_cyclonedx_path }}
          GRYPE_PATH: ${{ steps.scan.outputs.grype_json_path }}
        run: |
          set -euo pipefail
          sbom_sha=$(sha256sum "$CYCLONEDX_PATH" | cut -d' ' -f1)
          grype_sha=$(sha256sum "$GRYPE_PATH" | cut -d' ' -f1)
          echo "sbom_cyclonedx_sha256=$sbom_sha" >> "$GITHUB_OUTPUT"
          echo "grype_json_sha256=$grype_sha" >> "$GITHUB_OUTPUT"
          echo "CycloneDX SBOM sha256: $sbom_sha"
          echo "Grype JSON sha256:     $grype_sha"
