name: "Stryker mutasjonstesting (gjenbrukbar)"

# Two optional jobs:
#   dotnet-stryker — `dotnet stryker` against a .NET solution.
#   node-stryker   — `npm run stryker` against a Node project.
#
# Both default to producing an upload-artifact named after the input
# (default: stryker-report-dotnet / stryker-report-node) so a downstream
# job (e.g. a GitHub Pages publisher) can pick the reports up.

on:
  workflow_call:
    inputs:
      run_dotnet_stryker:
        required: false
        type: boolean
        description: "Kjør dotnet-stryker-jobben."
        default: false
      run_node_stryker:
        required: false
        type: boolean
        description: "Kjør node-stryker-jobben."
        default: true

      dotnet_version:
        required: false
        type: string
        description: ".NET versjon, f.eks. 10.0.x."
        default: "10.0.x"
      solution_path:
        required: false
        type: string
        description: "Mappen som inneholder .NET solution-filen. Påkrevd når run_dotnet_stryker = true."
        default: ""
      solution_name:
        required: false
        type: string
        description: "Navn på solution-filen (f.eks. ClutterStock.slnx). Påkrevd når run_dotnet_stryker = true."
        default: ""

      node_version:
        required: false
        type: string
        description: "Node versjon, f.eks. 24.x."
        default: "24.x"
      node_working_directory:
        required: false
        type: string
        description: "Mappen som inneholder Node-prosjektet. Påkrevd når run_node_stryker = true."
        default: ""

      mutation_level:
        required: false
        type: string
        description: "Stryker --mutation-level (Basic | Standard | Advanced | Complete)."
        default: "Standard"
      extra_arguments:
        required: false
        type: string
        description: "Ekstra flagg som sendes uendret til `dotnet stryker`."
        default: "--diag"

      dotnet_artifact_name:
        required: false
        type: string
        description: "Navn på upload-artifact for dotnet-rapporten."
        default: "stryker-report-dotnet"
      node_artifact_name:
        required: false
        type: string
        description: "Navn på upload-artifact for node-rapporten."
        default: "stryker-report-node"

      npm_registry_url:
        required: false
        type: string
        description: "npm registry-URL som sendes til actions/setup-node. Standard er GitHub Packages."
        default: "https://npm.pkg.github.com"
      npm_scope:
        required: false
        type: string
        description: "npm scope, f.eks. '@org'."
        default: ''
      primary_nuget_source:
        required: false
        type: string
        description: "Primær NuGet-feed-URL sendt til actions/setup-dotnet via source-url. Tom = standard nuget.org."
        default: ''
      extra_nuget_source:
        required: false
        type: string
        description: "Ekstra privat NuGet-feed lagt til via `dotnet nuget add source` før restore."
        default: ''
      extra_nuget_source_name:
        required: false
        type: string
        description: "Navn på den ekstra NuGet-kilden."
        default: ''
      extra_nuget_source_username:
        required: false
        type: string
        description: "Username for `dotnet nuget add source` on the extra source."
        default: 'az'
    secrets:
      npm_auth_token:
        required: false
        description: "Auth token brukt som NODE_AUTH_TOKEN i npm-jobben. Tom = fall tilbake til GITHUB_TOKEN."
      nuget_auth_token:
        required: false
        description: "Auth token for NuGet-feeds (NUGET_AUTH_TOKEN for setup-dotnet og --password på ekstra-kilde). Tom = fall tilbake til GITHUB_TOKEN."

jobs:
  dotnet-stryker:
    if: ${{ inputs.run_dotnet_stryker }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: ${{ inputs.dotnet_version }}
          source-url: ${{ inputs.primary_nuget_source }}
          cache: true
          cache-dependency-path: ${{ inputs.solution_path != '' && format('{0}/**/packages.lock.json', inputs.solution_path) || '**/packages.lock.json' }}
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.nuget_auth_token != '' && secrets.nuget_auth_token || secrets.GITHUB_TOKEN }}

      - name: Add extra NuGet source
        if: inputs.extra_nuget_source != ''
        uses: hwinther/reusable-workflows/.github/actions/_dotnet-add-nuget-source@v1
        with:
          extra_nuget_source: ${{ inputs.extra_nuget_source }}
          extra_nuget_source_name: ${{ inputs.extra_nuget_source_name }}
          extra_nuget_source_username: ${{ inputs.extra_nuget_source_username }}
          nuget_auth_token: ${{ secrets.nuget_auth_token != '' && secrets.nuget_auth_token || secrets.GITHUB_TOKEN }}
          working_directory: ${{ inputs.solution_path }}

      - name: Restore
        working-directory: ${{ inputs.solution_path }}
        env:
          SOLUTION_FILE: ${{ inputs.solution_name }}
        run: |
          set -euo pipefail
          dotnet restore --locked-mode "$SOLUTION_FILE"
          if git ls-files --error-unmatch nuget.config > /dev/null 2>&1; then
            git checkout HEAD -- nuget.config
          else
            rm -f nuget.config || true
          fi

      - name: Test with Stryker
        working-directory: ${{ inputs.solution_path }}
        env:
          SOLUTION_FILE: ${{ inputs.solution_name }}
          MUTATION_LEVEL: ${{ inputs.mutation_level }}
          EXTRA_ARGS: ${{ inputs.extra_arguments }}
        run: |
          dotnet tool restore
          # dotnet tool install -g dotnet-stryker # For now relying on the local tool
          dotnet stryker --solution "$SOLUTION_FILE" --test-runner mtp --mutation-level "$MUTATION_LEVEL" -r html -r json -r cleartext $EXTRA_ARGS

      - name: Upload dotnet stryker report artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.dotnet_artifact_name }}
          path: stryker-report-dotnet

  node-stryker:
    if: ${{ inputs.run_node_stryker }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ inputs.node_version }}
          registry-url: ${{ inputs.npm_registry_url }}
          scope: ${{ inputs.npm_scope }}
          cache: npm
          cache-dependency-path: ${{ inputs.node_working_directory != '' && format('{0}/package-lock.json', inputs.node_working_directory) || 'package-lock.json' }}

      - name: Install dependencies
        working-directory: ${{ inputs.node_working_directory }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.npm_auth_token != '' && secrets.npm_auth_token || secrets.GITHUB_TOKEN }}
        run: npm ci

      - name: Run Stryker
        working-directory: ${{ inputs.node_working_directory }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.npm_auth_token != '' && secrets.npm_auth_token || secrets.GITHUB_TOKEN }}
        run: npm run stryker

      - name: Upload frontend Stryker report artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.node_artifact_name }}
          path: "${{ inputs.node_working_directory }}/reports/mutation"
